    <div class="grid2">${S.tracks.map(t=>`<div class="typebox"><h4>${t.h}</h4><ul class="plainul">${t.d.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div></div>
   <div class="card"><h3>8 lỗi ưu tiên xử lý dứt điểm trong unit này</h3>
    <div class="codegrid">${S.topErr.map(e=>`<div><span class="code">${e[0]}</span> ${esc(L(ERRCODES[e[0]]))} — <i>${esc(e[1])}</i></div>`).join('')}</div></div>
   <div class="card"><h3>Đánh giá</h3><div class="grid2">${S.assess.map(a=>`<div class="typebox"><h4>${a[0]}</h4><div>${a[1]}</div></div>`).join('')}</div></div>`);
}

/* ---------- Student · Start here ---------- */
function buildPath(){
  const steps=[
   ["📄","Readings","25–30 min","Read the model essay “Should healthcare be free?” and the nine statements about preventative healthcare in full. Pass 1: skim. Pass 2: do the tasks. Pass 3: turn on Highlight and notice the phrases worth borrowing.","texts"],
   ["📘","Vocabulary","25 min","Do the vocabulary exercises (synonyms, the word box, medical vocabulary, adjective forms) and check your answers. Learn the collocations in the glossary.","vocab"],
   ["📖","Reading Lab","40 min","For each card: ① Understand → ② Mine the idea for a real exam prompt → ③ Borrow the phrase in a new sentence. Write BEFORE you open the model.","lab"],
   ["✍️","Skills & Ideas","40 min","Learn the eight article rules and the language of concession; study the argument chains and the framework for each essay type.","skills"],
   ["🛠","Sentence Clinic","30 min","Fix, choose and order the sentences. Every miss goes into your Error Log. Any code that appears 3 times: redo all its items and write 5 new correct sentences.","clinic"],
   ["🗂","Real prompts & Practice","60 min + 40 min","Scan the real prompts from 2024–2026, then complete the guided tasks: analyse → outline → key sentences → body paragraph → full essay in 40 minutes.","bank"],
   ["✅","Checklist","10 min","Check your essay with the course’s Task checklist and Language checklist, then against the band descriptors.","check"]];
  sec('path', hero('U2','Unit 2 · Healthcare','Your study path: read first → notice → practise → write')+
  `<div class="card"><h3>How to use this unit</h3><div class="lead" style="max-width:none">Work through the tabs in order. This unit’s reading is itself a model essay, so you will learn both <b>ideas</b> (three ways of paying for healthcare, who is responsible for preventing illness) and <b>techniques</b> (advantages and disadvantages in one paragraph, concession, inversion). The grammar focus is <b>articles</b> and <b>concession</b>.</div>
   <div class="flow6">${steps.map((s,i)=>`<div class="f6" style="cursor:pointer" onclick="show('${s[4]}')"><div class="f6n">${i+1}</div><div><b>${s[0]} ${s[1]}</b> <span class="tm">${s[2]}</span><div>${s[3]}</div></div></div>`).join('')}</div></div>
   <div class="card"><h3>Unit goals</h3><div class="grid2">
    <div class="typebox"><h4><span class="code">TR</span> Task Response</h4><div>Give a clear position (or verdict for “outweigh” questions) in the introduction and keep it; include at least one concession and rebuttal in every essay.</div></div>
    <div class="typebox"><h4><span class="code">CC</span> Coherence &amp; Cohesion</h4><div>Organise paragraphs as Concession → Rebuttal → Explanation → Example → Result; make solutions match problems one-to-one.</div></div>
    <div class="typebox"><h4><span class="code">LR</span> Lexical Resource</h4><div>Use at least 10 phrases from the readings (e.g. <i>free basic healthcare, regardless of income, an unsustainable financial burden, preventative medicine</i>) and academic adjectives (<i>adverse, adequate, conventional</i>).</div></div>
    <div class="typebox"><h4><span class="code">GRA</span> Grammar</h4><div>Zero article errors and zero concession errors (<i>Despite of</i>, <i>Despite + clause</i>, <i>Although … but</i>, <i>…, however …</i>); use inversion with <i>Not only</i>.</div></div></div></div>`);
}

/* ---------- Readings ---------- */
function buildTexts(){
  const T=TEXTS2, X=BOOKEX2;
  const ess=T.essay.paras.map((p,i)=>`<p>${p.h?`<b class="esh">${p.h}</b><br>`:''}${p.t} ${p.cards.map(c=>`<a class="rlink" onclick="gotoCard('${c}')">${c}</a>`).join(' ')}</p>`).join('');
  sec('texts', hero('📄', V('Bài đọc — đọc TOÀN BỘ trước khi phân tích & viết','Readings — read in FULL before analysing & writing'), V('Nguyên văn từ tài liệu Writing Studio · Unit 2 Healthcare','Verbatim from the Writing Studio course material · Unit 2 Healthcare'))+
  `<div class="card"><div class="note" style="margin:0">${V('<b>Quy trình đọc 3 lượt:</b> ① <b>Đọc lướt</b> (3 phút) — mỗi đoạn nói về mô hình nào? ② <b>Đọc tìm chi tiết</b> — làm bài tập đi kèm. ③ <b>Đọc sâu</b> — bật <i>Highlight</i> để thấy cụm từ đáng mượn, bấm mã thẻ (HC-1…) để sang Reading Lab.','<b>3-pass reading:</b> ① <b>Skim</b> (3 min) — which model does each section describe? ② <b>Scan</b> — do the tasks. ③ <b>Deep read</b> — turn on <i>Highlight</i> to see phrases worth borrowing; click a card code (HC-1…) to work on it in the Reading Lab.')}</div>
    <div class="hltoggle"><label><input type="checkbox" checked onchange="document.body.classList.toggle('hl-off',!this.checked)"> ${V('Highlight cụm từ đáng mượn','Highlight phrases worth borrowing')}</label>
    <span class="gjump" style="margin:0"><a href="#rd1">Reading 1</a><a href="#rd2">Reading 2</a><a href="#rd3">${V('Kỹ năng','Skills texts')}</a></span></div></div>

  <div class="card" id="rd1"><div class="rlabel">BEFORE YOU READ · Discuss</div>
   <div class="ex"><h4>${X.disc.h}</h4><ol class="rqs">${X.disc.items.map((q,i)=>`<li class="rq"><span>${i+1}. ${esc(q)}</span>${ta('disc-'+i,1)}</li>`).join('')}</ol></div>
   <div class="rlabel" style="margin-top:18px">READING 1 · Vocabulary in context</div>
   <article class="article essay2"><h2>${T.essay.title}</h2>${ess}</article>
   ${selEx('ex-cty', V('Exercise 4 · Mỗi quốc gia dùng mô hình nào (1–3)?','Exercise 4 · Which system (1–3) does each country use?'), T.countries.map(c=>[c[0].replace(/<[^>]+>/g,''),c[1]]), [["1","1 · Free or public healthcare"],["2","2 · Private healthcare"],["3","3 · A mixed system"]])}
   <div class="ex"><h4>${X.scan.h}</h4><div class="exnote">${V('Ghi các từ tìm được vào từng ô, sau đó bấm “Xem đáp án” để đối chiếu.','Write the words you find in each box, then click “Show key” to compare.')}</div>
    ${Object.keys(X.scan.cats).map((c,i)=>`<div class="scanrow"><b>${c}</b>${ta('scan-'+i,1)}<details><summary>${V('Xem đáp án','Show key')}</summary><div class="ans">${X.scan.cats[c].join(', ')}</div></details></div>`).join('')}</div>
  </div>

  <div class="card" id="rd2"><div class="rlabel">READING 2 · ${V('Ai chịu trách nhiệm phòng bệnh?','Who is responsible for preventing illness?')}</div>
   <div class="ex"><h4>${V('Exercise 1 · Chọn 5 hành động phòng bệnh quan trọng nhất','Exercise 1 · Agree on the five most important actions to avoid becoming ill')}</h4><div class="exbox">${T.prevent.actions}</div>
    <ol class="rqs">${T.prevent.qs.map((q,i)=>`<li class="rq"><span>${i+1}. ${esc(q)}</span>${ta('prev-'+i,2)}</li>`).join('')}</ol></div>
   ${selEx('ex-stm', V('Exercise 3 · Nhận định nào ỦNG HỘ, nhận định nào PHẢN ĐỐI trách nhiệm cá nhân trong phòng bệnh?','Exercise 3 · Which statements are in favour of individual responsibility for preventative healthcare, and which are against?'), T.prevent.statements, [["for",V('Ủng hộ (for)','In favour')],["against",V('Phản đối (against)','Against')]])}
   <div class="exnote"><a class="rlink" onclick="gotoCard('PR-1')">PR-1</a> <a class="rlink" onclick="gotoCard('PR-2')">PR-2</a> ${V('— khai thác các nhận định này trong Reading Lab.','— work on these statements in the Reading Lab.')}</div>
  </div>

  <div class="card" id="rd3"><div class="rlabel">WRITING SKILLS TEXTS</div>
   <h4 style="margin-bottom:6px">Grammar: Articles</h4>
   <div class="skillbox"><p><b>Definite article (the)</b></p><ul class="rules">${T.articles.rules.slice(0,4).map(r=>`<li><b>${r[0]}</b> ${r[1]}</li>`).join('')}</ul>
    <p><b>Indefinite article (a/an)</b></p><ul class="rules">${T.articles.rules.slice(4,5).map(r=>`<li><b>${r[0]}</b> ${r[1]}</li>`).join('')}</ul>
    <p><b>Zero article (no article)</b></p><ul class="rules">${T.articles.rules.slice(5).map(r=>`<li><b>${r[0]}</b> ${r[1]}</li>`).join('')}</ul></div>
   <h4 style="margin:16px 0 6px">Language of concession</h4>
   <div class="skillbox"><p>${T.concession.intro}</p><p><i>${T.concession.base}</i></p>
    <p><b>Simple language of concession</b></p><ul>${T.concession.simple.map(x=>`<li>${x}</li>`).join('')}</ul>
    <p><b>More complex language of concession</b></p><ul>${T.concession.complex.map(x=>`<li>${x}</li>`).join('')}</ul> <a class="rlink" onclick="gotoCard('CON-1')">CON-1</a></div>
   <div class="rlabel" style="margin-top:20px">WRITING PRACTICE · ${V('Đề viết của unit','Unit writing task')}</div>
   <div class="prompt star"><p><b>${T.practice}</b></p><button class="linkbtn" style="margin-top:8px" onclick="show('bank');setTimeout(()=>gotoGP('gp0'),150)">${xt('bank.gp')} →</button></div>
  </div>`);
}

/* ---------- Vocabulary ---------- */
function buildVocab(){
  const X=BOOKEX2;
  const chooseRows=X.choose.items.map(i=>[i[0],i[1]]);
  sec('vocab', hero('📘', V('Từ vựng chủ đề Healthcare','Healthcare vocabulary'), V('Bài tập trong tài liệu (có chấm) + glossary phát âm, collocation, câu band 7+','Course exercises (auto-checked) + glossary with pronunciation, collocations, band-7+ examples'))+
  `<div class="card"><h3>A · Topic-related vocabulary</h3>
    ${selEx('ex-syn',X.syn.h,X.syn.items,[["yes",V('Đồng nghĩa ✓','Synonyms ✓')],["no",V('Không đồng nghĩa ✗','Not synonyms ✗')]])}
    ${gapEx('ex-box',X.box)}</div>
   <div class="card"><h3>B · Medical vocabulary</h3>${matchEx('ex-med',X.med)}${gapEx('ex-medf',X.medf)}</div>
   <div class="card"><h3>C · ${V('Tính từ học thuật','Academic adjectives')}</h3>${gapEx('ex-adj',X.adj)}
    <div class="ex" id="ex-choose"><h4>${X.choose.h}</h4><table class="extbl"><tbody>${X.choose.items.map((it,i)=>`<tr data-ans="${it[1]}"><td class="n">${i+1}</td><td>${esc(it[0])}</td><td><select data-k="ch-${i}" onchange="ST.drafts[this.dataset.k]=this.value"><option value="">—</option>${it[2].map(o=>`<option value="${o}" ${ST.drafts['ch-'+i]===o?'selected':''}>${o}</option>`).join('')}</select></td><td class="mk"></td></tr>`).join('')}</tbody></table>
     <div class="exbtn"><button class="linkbtn" onclick="checkSel('ex-choose')">${xt('check')}</button><button class="resetbtn" onclick="keySel('ex-choose')">${V('Xem đáp án','Show key')}</button></div></div></div>
   <div class="card"><h3>${tr('vocab.h')}</h3>${richVocabHTML('t2')}</div>`);
}

/* ---------- Lab / Clinic / Check ---------- */
function buildLab(){ const n=READING.t1.sources.reduce((s,x)=>s+x.cards.length,0); sec('lab', hero('📖', xt('rl.h'), V(n+' thẻ · nguyên văn → hiểu → khai thác ý → mượn cụm từ',n+' cards · verbatim → understand → mine ideas → borrow phrases'))+`<div class="card">${readingHTML('t1')}</div>`); }
function buildClinic(){ const n=CLINIC.t1.groups.reduce((s,g)=>s+g.items.length,0); sec('clinic', hero('🛠', xt('sc.h'), V(n+' câu · mạo từ – nhượng bộ – collocation y tế – sắp xếp ý · Error Log cá nhân',n+' items · articles – concession – health collocations – organisation · personal Error Log'))+`<div class="card" id="clinicbody">${clinicHTML('t1')}</div>`); }
function buildCheck(){
  const T=TEXTS2;
  sec('check', hero('✅', tr('cl.title'), V('Tự kiểm tra trước khi nộp bài','Self-check before submitting'))+
  `<div class="card"><h3>${V('Checklist của tài liệu (Unit 2)','Course checklists (Unit 2)')}</h3><div class="grid2">
    <div class="typebox"><h4>TASK CHECKLIST</h4>${T.taskCheck.map((x,i)=>`<div class="check"><input type="checkbox" id="tc${i}"><label for="tc${i}">${x}</label></div>`).join('')}</div>
    <div class="typebox"><h4>LANGUAGE CHECKLIST</h4>${T.langCheck.map((x,i)=>`<div class="check"><input type="checkbox" id="lc${i}"><label for="lc${i}">${x}</label></div>`).join('')}</div></div></div>
   <div class="card"><div class="lead">${tr('cl.lead')}</div>${checklistHTML('hc')}</div>`);
}

/* ---------- Skills & Ideas ---------- */
function buildSkills(){
  const X=BOOKEX2, T=TEXTS2;
  const t2=topics.find(t=>t.id==='t2');
  const ruleOpts=T.articles.rules.map(r=>[r[0],r[0]+' · '+r[1].replace(/<[^>]+>/g,'').slice(0,60)+'…']);
  sec('skills', hero('✍️', V('Kỹ năng viết & phát triển ý','Writing skills & idea development'), V('Mạo từ · nhượng bộ · khung đoạn văn · ý tưởng Healthcare','Articles · concession · paragraph frames · Healthcare ideas'))+
  `<div class="card"><h3>1 · Grammar: Articles</h3>
    <div class="skillbox"><ul class="rules">${T.articles.rules.map(r=>`<li><b>${r[0]}</b> ${r[1]}</li>`).join('')}</ul></div>
    ${selEx('ex-art1',X.art1.h,X.art1.items,ruleOpts)}
    ${gapEx('ex-art2',X.art2)}<div class="exnote">${X.art2.note}</div></div>
   <div class="card"><h3>2 · Language of concession</h3>
    <div class="grid2"><div class="typebox"><h4>${V('Đơn giản','Simple')}</h4><div><b>but</b> · <b>However,</b> + clause</div></div>
    <div class="typebox"><h4>${V('Phức tạp (band 7+)','More complex (band 7+)')}</h4><div><b>Nevertheless,</b> + clause · <b>Even though / Despite the fact that / In spite of the fact that</b> + clause · <b>Despite / In spite of</b> + noun / -ing</div></div></div>
    <h4 style="margin:14px 0 6px">${X.conc.h}</h4>
    <ol class="rqs">${X.conc.items.map((c,i)=>`<li class="rq rq-cum"><span>${esc(c[0])}</span>${ta('conc-'+i,2)}<details><summary>${xt('model')}</summary><div class="ans">${esc(c[1])}</div></details></li>`).join('')}</ol></div>
   <div class="card"><h3>3 · ${V('Khung đoạn văn có nhượng bộ','A paragraph frame with concession')}</h3>
    <div class="flow6">${[["Concession","Admittedly, / It is true that …"],["Rebuttal","However, / Nevertheless, …"],["Explanation","This is because …"],["Example","For instance, …"],["Result","As a result, / Therefore, …"]].map((s,i)=>`<div class="f6"><div class="f6n">${i+1}</div><div><b>${s[0]}</b><div><i>${s[1]}</i></div></div></div>`).join('')}</div>
    <div class="lead" style="margin-top:10px">${V('Mô hình này có sẵn trong bài đọc: “One advantage, <b>however</b>, is that…” (HC-7) và “The advantage … is clear… <b>However</b>, it is a very expensive system…” (HC-4).','The reading already uses this pattern: “One advantage, <b>however</b>, is that…” (HC-7) and “The advantage … is clear… <b>However</b>, it is a very expensive system…” (HC-4).')}</div></div>
   <div class="card"><h3>4 · ${V('Phát triển ý (chuỗi lập luận)','Idea development (argument chains)')}</h3><div class="lead">${tr('idea.lead')}</div>${t2.ideas.map(ideaHTML).join('')}</div>
   <div class="card"><h3>5 · ${V('Khung theo dạng bài · lỗi tổ chức ý hay gặp','Frameworks by essay type · common organisation errors')}</h3>
    <div class="grid2">${ROADMAP.types.map(t=>`<div class="typebox tb2"><h4>${typePill(t.ty)}</h4><div class="sig"><b>${xt('rm.sig')}:</b> <i>${esc(t.sig)}</i></div>
    <div class="tbh">${xt('rm.plan')}</div><ol>${t.plan.map(x=>`<li>${x}</li>`).join('')}</ol>
    <div class="tbh">${xt('rm.errs')}</div><ul class="errs">${t.errs.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="tbh">${xt('rm.frame')}</div><div class="frame">${t.frame}</div></div>`).join('')}</div></div>`);
}

/* ---------- Teacher · Answer keys ---------- */
function buildKeys(){
  const X=BOOKEX2, T=TEXTS2, L2='abcdefg';
  const li=(arr)=>`<ol>${arr.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  const block=(h,body)=>`<div class="keyblock"><h4>${h}</h4>${body}</div>`;
  const clinicKey=CLINIC.t1.groups.map(g=>block(L(g.title), li(g.items.map(it=>`<span class="code">${it.c}</span> `+(it.t==='fix'?`<s>${esc(it.w)}</s> → ${it.a}`:it.t==='mcq'?`${it.q} → <b>${String.fromCharCode(97+it.k)}. ${esc(it.o[it.k])}</b>`:`${it.q} → <b>${it.k.split('').join(' ')}</b>`))))).join('');
  sec('keys', hero('🔑','Đáp án tổng hợp (bản giáo viên)','Dùng để in / chữa nhanh trên lớp')+
  `<div class="card"><button class="linkbtn noprint" onclick="window.print()">🖨 In trang đáp án</button>
   <div class="grid2" style="margin-top:12px">
   ${block(X.syn.h, li(X.syn.items.map(x=>`${x[0]} → <b>${x[1]==='yes'?'synonyms':'not synonyms'}</b>`)))}
   ${block(X.box.h, li(X.box.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block('Exercise 4 · Countries → system', li(T.countries.map(c=>`${c[0].match(/<b>(.*?)<\/b>/)[1]} → <b>${c[1]}</b>`)))}
   ${block(X.scan.h, Object.keys(X.scan.cats).map(c=>`<p><b>${c}:</b> ${X.scan.cats[c].join(', ')}</p>`).join(''))}
   ${block('Exercise 3 · For / against individual responsibility', li(T.prevent.statements.map(s=>`${esc(s[0])} → <b>${s[1]}</b>`)))}
   ${block(X.med.h, li(X.med.left.map((l,i)=>`${l} → <b>${L2[X.med.key[i]]}</b>`)))}
   ${block(X.medf.h, li(X.medf.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.adj.h, li(X.adj.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.choose.h, li(X.choose.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.art1.h, li(X.art1.items.map(x=>`${esc(x[0])} → <b>${x[1]}</b>`)))}
   ${block(X.art2.h, li(X.art2.items.map(x=>`${esc(x[0])} → <b>${x[1].replace(/\|/g,' hoặc ')}</b>`)))}
   ${block(X.conc.h, li(X.conc.items.map(x=>`<i>${esc(x[1])}</i>`)))}
   </div><div class="note" style="margin-top:12px">Ghi chú: Exercise 2 (articles) câu 4 — “Royal Hospital” là tên riêng; chấp nhận cả <b>the</b> và <b>–</b> tuỳ cách gọi tên bệnh viện. Exercise 5 (scan) là danh sách gợi ý, chấp nhận các từ hợp lý khác trong bài.</div></div>
   <div class="card"><h3>Sentence Clinic</h3>${clinicKey}</div>`);
}

function renderMain(){
  mainEl.innerHTML='';
  if(MODE==='teacher') buildPlan(); else buildPath();
  buildTexts(); buildVocab(); buildLab(); buildSkills(); buildClinic(); buildBank(); buildCheck();
  if(MODE==='teacher') buildKeys();
  renderLog();
  const vw=document.getElementById('view-'+currentView); (vw||document.getElementById('view-'+ETABS[0].id)).classList.add('active');
}
function setLang(l){
  LANG=(MODE==='student')?'en':l; document.documentElement.lang=LANG;
  const bvi=document.getElementById('lang-vi'), ben=document.getElementById('lang-en');
  if(bvi) bvi.classList.toggle('on',LANG==='vi'); if(ben) ben.classList.toggle('on',LANG==='en');
  document.getElementById('headIntro').innerHTML = MODE==='student'
   ? 'Read the model essay and the statements first, collect ideas and phrases, master <b>articles</b> and <b>concession</b>, then write about <b>real IELTS exam questions from 2024–2026</b>.'
   : V('Bản giáo viên · Unit <b>Healthcare</b>: thiết kế bài giảng 4 buổi, toàn bộ bài đọc nguyên văn, bài tập có chấm, Reading Lab, Sentence Clinic (mạo từ & nhượng bộ), 19 đề thật 2024–2026, 6 bài thực hành có hướng dẫn và <b>đáp án tổng hợp</b>.','Teacher edition · <b>Healthcare</b> unit: a 4-session lesson design, all readings verbatim, auto-checked exercises, Reading Lab, Sentence Clinic (articles & concession), 19 real 2024–2026 prompts, 6 guided tasks and <b>consolidated answer keys</b>.');
  document.getElementById('foot').innerHTML = (MODE==='student'||LANG==='en')
   ? 'Writing Studio · IELTS Writing Task 2 · Unit 2 Healthcare — readings and exercises adapted from <b>Evolve Level 4</b> (Cambridge University Press); real exam prompts compiled from talkfirst.vn and ieltscity.vn (reported by candidates, so wording may differ slightly); band descriptors from the British Council / IDP / Cambridge Assessment English.'
   : 'Writing Studio · IELTS Writing Task 2 · Unit 2 Healthcare — bài đọc và bài tập chuyển thể từ <b>Evolve Level 4</b> (Cambridge University Press); đề thi thật tổng hợp từ talkfirst.vn, ieltscity.vn; band descriptors theo British Council / IDP / Cambridge.';
  renderTabs(); renderMain(); show(currentView);
}
currentView=ETABS[0].id;
setLang(MODE==='student'?'en':'vi');
