<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Studio · Unit 2 Healthcare · Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#d76b34; --orange-soft:#e7a173; --sage:#7f9a76; --sage-soft:#c3d0bd;
    --cream:#f1efe7; --paper:#ffffff; --ink:#232321; --muted:#6f6e66;
    --line:#e7e3d7; --yellow:#e9d9a6;
    --shadow:0 1px 2px rgba(30,28,22,.04),0 6px 20px rgba(30,28,22,.06);
    --shadow-lg:0 4px 30px rgba(30,28,22,.10);
    --font-head:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --rad:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);
    line-height:1.62;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:600}
  a{color:var(--orange)}
  /* Header */
  header.top{background:radial-gradient(120% 140% at 0% 0%,#33322d 0%,#1f1e1b 55%,#191814 100%);
    color:#fff;padding:20px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(215,107,52,.28),transparent 70%);pointer-events:none}
  header.top .paradigm{font-family:var(--font-head);font-size:15px;letter-spacing:6px;font-weight:600;
    color:#fff;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:11px;margin-bottom:13px;text-transform:uppercase}
  header.top .brand{font-size:12px;letter-spacing:4px;color:var(--orange-soft);font-weight:700}
  header.top h1{font-size:33px;margin:3px 0 6px;color:#fff;font-weight:600;letter-spacing:-.02em}
  header.top p{margin:0;color:#d3d0c6;font-size:13.5px;max-width:860px;line-height:1.55}
  header.top .langswitch{position:absolute;top:20px;right:26px;display:flex;gap:0;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;overflow:hidden;z-index:2}
  header.top .langswitch button{border:0;background:transparent;color:#d3d0c6;font:inherit;font-weight:700;
    font-size:12px;letter-spacing:.5px;padding:6px 13px;cursor:pointer;transition:.15s}
  header.top .langswitch button.on{background:var(--orange);color:#fff}
  /* Tabs */
  nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:9px 16px;
    box-shadow:0 2px 14px rgba(30,28,22,.05)}
  nav.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);
    padding:8px 15px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
  nav.tabs button:hover{background:var(--cream);color:var(--ink)}
  nav.tabs button.active{background:var(--ink);color:#fff}
  nav.tabs button .tno{font-size:10.5px;opacity:.65;margin-right:5px;font-weight:800}
  /* Layout */
  main{max-width:1090px;margin:0 auto;padding:28px 22px 90px}
  section.view{display:none;animation:fade .25s ease}
  section.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Sub nav */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
  .subnav button{border:1px solid var(--line);background:var(--paper);font:inherit;font-weight:600;
    font-size:13px;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
  .subnav button:hover{border-color:var(--sage)}
  .subnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .panel{display:none}
  .panel.on{display:block}
  /* Cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:22px 24px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .card h3{font-size:21px;margin-bottom:5px;color:var(--ink)}
  .card .lead{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:820px}
  .topichero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:4px 2px}
  .topichero .badge{width:60px;height:60px;border-radius:16px;
    background:linear-gradient(150deg,var(--orange),#c05a26);color:#fff;box-shadow:0 6px 16px rgba(199,90,40,.28);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:23px;font-weight:600;flex-shrink:0}
  .topichero h2{font-size:28px}
  .topichero p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  /* Vocab */
  .vgroup{margin-bottom:18px}
  .vgroup h4{font-size:15px;color:var(--orange);border-bottom:2px solid var(--sage-soft);
    padding-bottom:5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13.5px}
  .chip b{color:var(--ink)}
  .wtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .wtable td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
  .wtable td:first-child{font-weight:600;width:38%;background:var(--cream)}
  /* Rich vocabulary entries */
  .vsub{font-family:var(--font-head);font-size:13.5px;font-weight:600;color:#8a5a2c;display:flex;align-items:center;gap:9px;
    margin:20px 0 12px;letter-spacing:.01em}
  .vsub::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px;display:inline-block}
  .ventry{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:var(--paper);
    box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
  .ventry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .ventry .vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ventry .vw{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
  .ventry .pos{font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);padding:2px 9px;border-radius:12px;font-style:normal;letter-spacing:.3px}
  .ventry .ipa{font-family:var(--font-body);color:var(--orange);font-size:14px;font-weight:500}
  .ventry .vspeak{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:8px;
    cursor:pointer;font-size:13px;padding:3px 9px;color:var(--muted)}
  .ventry .vspeak:hover{border-color:var(--orange);color:var(--orange)}
  .ventry .vdef{font-size:13.6px;margin:2px 0}
  .ventry .vdef b{color:var(--sage);font-size:11px;letter-spacing:.5px;margin-right:4px}
  .ventry .vdef.vi b{color:var(--orange)}
  .ventry .vex{font-size:13.2px;font-style:italic;color:var(--muted);margin-top:6px;
    border-left:3px solid var(--sage-soft);padding-left:10px}
  .ventry .vex b{font-style:normal;color:var(--ink)}
  .ventry .vcol{font-size:12.4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;color:#5c5c54}
  .ventry .vcol b{display:block;color:var(--orange);font-size:9.5px;letter-spacing:.7px;margin-bottom:2px;font-weight:700}
  /* side-by-side vocabulary boxes */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;align-items:stretch}
  .vgrid .ventry{margin-bottom:0;display:flex;flex-direction:column}
  @media(max-width:640px){.vgrid{grid-template-columns:1fr}}
  /* Glossary */
  .gsearch{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font:inherit;
    font-size:14px;margin-bottom:16px;background:var(--paper)}
  .gsearch:focus{outline:none;border-color:var(--orange)}
  .gtopic{scroll-margin-top:70px}
  .gtopic h3{font-size:19px;color:var(--ink);border-bottom:2px solid var(--orange);padding-bottom:6px;margin:22px 0 4px}
  .gcount{font-size:12px;color:var(--muted);margin-bottom:6px}
  .gjump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .gjump a{font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);
    padding:4px 10px;border-radius:16px;background:var(--paper)}
  .gjump a:hover{border-color:var(--orange);color:var(--orange)}
  /* Idea development */
  .arg{border-left:4px solid var(--orange);background:var(--paper);border:1px solid var(--line);
    border-left-width:4px;border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:14px}
  .arg.against{border-left-color:var(--sage)}
  .arg .claim{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
  .arg .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;
    color:#fff;background:var(--orange);flex-shrink:0;margin-top:2px}
  .arg.against .tag{background:var(--sage)}
  .chain{list-style:none;margin:0;padding:0;counter-reset:step}
  .chain li{position:relative;padding:4px 0 4px 30px;font-size:13.8px;counter-increment:step}
  .chain li::before{content:counter(step);position:absolute;left:0;top:4px;width:20px;height:20px;
    background:var(--cream);border:1px solid var(--sage);border-radius:50%;font-size:11px;font-weight:700;
    color:var(--sage);display:flex;align-items:center;justify-content:center}
  .chain li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:24px;bottom:-2px;width:1px;background:var(--sage-soft)}
  .themetag{display:inline-block;background:var(--yellow);color:#6b5a1f;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:14px 0 8px}
  /* Practice bank */
  .prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .prompt .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px}
  .pill.new{background:var(--orange);color:#fff}
  .pill.file{background:var(--sage);color:#fff}
  .pill.common{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
  .pill.type{background:#efe7db;color:#8a6a3a}
  .prompt p{margin:0;font-size:14.5px}
  .prompt .date{font-size:11.5px;color:var(--muted);margin-left:auto}
  /* Checklist */
  .crit{margin-bottom:16px}
  .crit h4{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .crit h4 .k{background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-family:monospace}
  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .check input{margin-top:5px;width:16px;height:16px;accent-color:var(--sage);flex-shrink:0;cursor:pointer}
  .check label{cursor:pointer}
  /* Band table */
  .bandwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .bandsrc{font-size:11.6px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:var(--paper)}
  .bandgroup{margin-bottom:20px}
  .bghead{font-family:Georgia,serif;font-weight:700;font-size:15px;padding:9px 15px;border-radius:10px 10px 0 0;color:#fff}
  .bandgroup.bg-hi .bghead{background:#4f7a41}
  .bandgroup.bg-mid .bghead{background:#a5842f}
  .bandgroup.bg-lo .bghead{background:#b25a2e}
  .bandgroup .bandwrap{border-radius:0 0 12px 12px}
  .refcard ol{margin:8px 0 0;padding-left:20px}
  .refcard li{font-size:13.4px;margin-bottom:8px}
  .refcard .tag2{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);
    padding:2px 8px;border-radius:12px;margin-right:6px;letter-spacing:.4px}
  table.band{border-collapse:collapse;width:100%;min-width:760px;font-size:12.8px}
  table.band th,table.band td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
  table.band thead th{background:var(--ink);color:#fff;font-family:'Segoe UI',sans-serif;font-size:12.5px;position:sticky;top:0}
  table.band td.bn{font-weight:800;font-size:16px;text-align:center;font-family:Georgia,serif;width:46px}
  /* colour-coded by BAND: every criterion in one band shares the same tone (green→red) */
  table.band tr[data-b="9"] td{background:#dcebd4}
  table.band tr[data-b="8"] td{background:#e8f1de}
  table.band tr[data-b="7"] td{background:#f3f0d2}
  table.band tr[data-b="6"] td{background:#faedcc}
  table.band tr[data-b="5"] td{background:#f7e1d0}
  table.band tr[data-b="4"] td{background:#f3d7c7}
  table.band tr[data-b="9"] td.bn{background:#bcd9ae;color:#2f5626}
  table.band tr[data-b="8"] td.bn{background:#cfe3bf;color:#3a5f2b}
  table.band tr[data-b="7"] td.bn{background:#e7dfa6;color:#6f5f16}
  table.band tr[data-b="6"] td.bn{background:#f2dda6;color:#8a6716}
  table.band tr[data-b="5"] td.bn{background:#efc7ac;color:#9e5228}
  table.band tr[data-b="4"] td.bn{background:#e9b79c;color:#a8481f}
  table.band td b{color:#141414;font-weight:800}
  /* Sample essay */
  .essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 26px;font-size:14.5px}
  .essay h3{text-align:center;margin-bottom:16px;font-size:22px}
  .essay p{margin:0 0 13px;position:relative}
  .essay .num{position:absolute;left:-26px;color:var(--sage);font-weight:700;font-family:Georgia,serif}
  mark.hook{background:#f6ddc9;padding:1px 2px}
  mark.thesis{background:#d9e6d3;padding:1px 2px}
  mark.topic{background:#eee2c2;padding:1px 2px}
  mark.counter{background:#e3d4ea;padding:1px 2px}
  mark.refute{background:#cfe3e8;padding:1px 2px}
  mark.restate{background:#d9e6d3;padding:1px 2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
  /* Structure diagram */
  .flow{display:flex;flex-direction:column;gap:2px;max-width:640px;margin:8px 0}
  .flow div{color:var(--ink);padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px}
  .flow .f1{background:var(--orange);color:#fff;margin-right:0}
  .flow .f2{background:var(--orange-soft);margin-left:26px}
  .flow .f3{background:var(--yellow);margin-left:52px}
  .flow .f4{background:var(--sage-soft);margin-left:78px}
  .flow .f5{background:var(--ink);color:#fff;margin-left:104px}
  .flow small{display:block;font-weight:400;font-size:12px;opacity:.9}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.topichero h2{font-size:22px}}
  .typebox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .typebox h4{font-size:14.5px;color:var(--orange);margin-bottom:3px}
  .typebox .ex{font-size:12.8px;color:var(--muted);font-style:italic;margin-top:6px}
  .note{background:#fff7e8;border:1px solid var(--yellow);border-radius:10px;padding:12px 15px;font-size:13px;margin-bottom:16px}
  .qanalyze{background:#ecf3e9;border:1px solid var(--sage-soft);border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.4px}
  .qanalyze .row{display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;border-bottom:1px dashed #cdd8c5}
  .qanalyze .row:last-child{border-bottom:0}
  .qanalyze .lbl{font-weight:700;color:#4f6446;min-width:150px;flex-shrink:0}
  .qanalyze mark{background:#f6ddc9;padding:0 3px;border-radius:3px}
  .qanalyze mark.t{background:#e3d4ea}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .resetbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);margin-bottom:10px}
  .linkbtn{border:0;background:var(--sage);color:#fff;font:inherit;font-weight:700;font-size:12.5px;
    padding:3px 10px;border-radius:7px;cursor:pointer}
  .linkbtn:hover{background:#87997f}

  /* ===== Extension: Reading Lab / Clinic / Bank / Roadmap ===== */
  .rcard,details.gp,.bgroup,#guided,.card{scroll-margin-top:120px}
  .rsrc{margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  .rsrc-h{font-family:var(--font-head);font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rsrc-s{font-size:12.5px;color:var(--muted);font-style:italic}
  .rcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;transition:box-shadow .3s}
  .rcard.flash{box-shadow:0 0 0 3px var(--orange-soft)}
  .rhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .rref{font-family:monospace;font-weight:700;font-size:12px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:6px}
  .rpara{font-size:12px;color:var(--muted);font-weight:600}
  .rquote{margin:6px 0 10px;padding:10px 14px;border-left:4px solid var(--sage);background:#f7f5ee;border-radius:0 8px 8px 0;
    font-family:Georgia,'Times New Roman',serif;font-size:15.2px;line-height:1.7}
  .rquote mark{background:#f6ddc9;padding:0 2px;border-radius:3px}
  .rphr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{font-size:12px;background:#ecf3e9;border:1px solid var(--sage-soft);color:#4f6446;padding:3px 9px;border-radius:14px;cursor:pointer;font-weight:600}
  .chip:hover{background:var(--sage-soft)}
  .rqs{margin:0;padding-left:0;list-style:none}
  .rq{padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
  .rk{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:4px;background:var(--cream);color:var(--muted)}
  .rq-y .rk{background:#fbe9dc;color:#a4501f}
  .rq-cum .rk{background:#e3eedf;color:#4f6446}
  .xta{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;
    background:#fffdf8;resize:vertical;color:var(--ink)}
  .xta:focus{outline:2px solid var(--sage-soft);border-color:var(--sage)}
  details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--orange);margin-top:6px;user-select:none}
  .ans{background:#ecf3e9;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.8px}
  .errnote{background:#fff1ec;border:1px solid #f1c7b0;border-radius:8px;padding:7px 12px;margin-top:6px;font-size:13px}
  .rule{background:#f7f5ee;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.2px}
  .code{font-family:monospace;font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .cgroup{margin-top:26px}
  .cgroup h4{font-size:18px;margin-bottom:4px}
  .citem{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 15px;margin:10px 0}
  .citem.ok{border-left-color:var(--sage)}
  .citem.bad{border-left-color:var(--orange)}
  .cq{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:14.2px}
  .ctype{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-top:2px}
  .wrong{color:#a4501f;text-decoration:line-through;text-decoration-color:rgba(164,80,31,.35);flex:1 1 300px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  @media(max-width:720px){.opts{grid-template-columns:1fr}}
  .opt{text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .opt:hover:not([disabled]){border-color:var(--sage)}

    Q("cum","Viết 1 câu với <b>While in some …, in others …</b> về chi phí khám chữa bệnh.","Write a sentence with <b>While in some …, in others …</b> about medical costs.",
      "<b>While in some</b> countries patients pay nothing for a hospital stay, <b>in others</b> a single operation can cost more than a year’s salary.","<b>While in some</b> countries patients pay nothing for a hospital stay, <b>in others</b> a single operation can cost more than a year’s salary.",
      "✗ <u>While</u> in some countries…, <u>but</u> in others… → chỉ dùng <b>While</b>, không thêm <i>but</i>.","✗ <u>While</u> in some countries…, <u>but</u> in others… → use <b>While</b> only; do not add <i>but</i>.")]},
  {ref:"HC-2", para:"1 · Free or public healthcare",
   quote:"There are several systems within this model, but they all <mark>aim to provide free basic healthcare</mark>. In some countries, <mark>consultations, treatment and medicines</mark> are free to all citizens. This may be <mark>paid for directly by the government</mark>, perhaps <mark>funded by</mark> the country’s valuable natural resources which the government owns.",
   phrases:["aim to provide free basic healthcare","consultations, treatment and medicines","be paid for by","be funded by"],
   qs:[Q("hieu","Hai cách nhà nước chi trả cho y tế miễn phí là gì (đoạn này + câu tiếp theo trong bài)?","What two ways of paying for free healthcare does the essay mention (this extract + the next sentence)?",
      "(1) Chính phủ trả trực tiếp, có thể từ tài nguyên thiên nhiên nhà nước sở hữu; (2) thu thuế theo thu nhập của công dân.","(1) The government pays directly, perhaps from natural resources it owns; (2) it collects taxes based on citizens’ income."),
    Q("y","Đề <i>“Healthcare should be free for everyone. To what extent do you agree?”</i>: cụm <b>free basic healthcare</b> gợi ra hướng “partly agree” nào?","Prompt: <i>“Healthcare should be free for everyone. To what extent do you agree?”</i> What ‘partly agree’ line does the phrase <b>free basic healthcare</b> suggest?",
      "Miễn phí cho dịch vụ CƠ BẢN (khám, điều trị thiết yếu, thuốc thiết yếu) nhưng không miễn phí cho dịch vụ không thiết yếu (phẫu thuật thẩm mỹ, phòng VIP).","Make BASIC care free (consultations, essential treatment and medicines) but not non-essential services (cosmetic surgery, private rooms)."),
    Q("cum","Viết câu bị động với <b>be paid for by</b> hoặc <b>be funded by</b>.","Write a passive sentence with <b>be paid for by</b> or <b>be funded by</b>.",
      "In many European countries, essential treatment <b>is funded by</b> general taxation, so patients rarely <b>pay for</b> a consultation themselves.","In many European countries, essential treatment <b>is funded by</b> general taxation, so patients rarely <b>pay for</b> a consultation themselves.",
      "✗ The treatment <u>is paid by</u> the government → <b>is paid for by</b> (pay for something).","✗ The treatment <u>is paid by</u> the government → <b>is paid for by</b> (you pay for something).")]},
  {ref:"HC-3", para:"1 · Free or public healthcare",
   quote:"Other countries <mark>collect money from citizens through taxes based on their income</mark>. Workers pay <mark>according to how much they earn</mark> and employers also <mark>make a contribution</mark>. Hospitals and other medical services are then <mark>provided and run by the government</mark>.",
   phrases:["collect money through taxes based on income","according to how much they earn","make a contribution","be provided and run by"],
   qs:[Q("y","Đề <i>“Doctors and nurses should be paid more than celebrities.”</i> hoặc đề về thuế: ý “đóng góp theo thu nhập” giúp lập luận về CÔNG BẰNG thế nào?","Prompt about fairness/taxes: how does ‘paying according to income’ support an argument about FAIRNESS?",
      "Người thu nhập cao đóng nhiều hơn, người nghèo đóng ít nhưng vẫn được hưởng như nhau → hệ thống y tế công là công cụ phân phối lại, giảm bất bình đẳng.","Higher earners pay more, the poor pay less but receive the same care → public healthcare redistributes wealth and reduces inequality."),
    Q("cum","Viết câu dùng <b>according to how much they earn</b> và <b>make a contribution</b>.","Write a sentence using <b>according to how much they earn</b> and <b>make a contribution</b>.",
      "Under a tax-funded system, citizens pay <b>according to how much they earn</b>, and employers <b>make a contribution</b> for every member of staff.","Under a tax-funded system, citizens pay <b>according to how much they earn</b>, and employers <b>make a contribution</b> for every member of staff.",
      "✗ make <u>contribute</u> / contribute <u>for</u> → <b>make a contribution to</b> / <b>contribute to</b>.","✗ make <u>contribute</u> / contribute <u>for</u> → <b>make a contribution to</b> / <b>contribute to</b>.")]},
  {ref:"HC-4", para:"1 · Free or public healthcare",
   quote:"The advantage of systems such as these is clear: <mark>free basic healthcare for all, regardless of income</mark>. However, it is a very expensive system and, as <mark>life expectancy and costs rise</mark>, many countries are facing either <mark>an unsustainable financial burden</mark>, or <mark>a drop in the quality of services and facilities</mark> provided.",
   phrases:["The advantage of … is clear:","regardless of income","as life expectancy and costs rise","an unsustainable financial burden","a drop in the quality of services"],
   qs:[Q("hieu","Đoạn trích là một chuỗi lập luận “ưu điểm → nhược điểm → hệ quả”. Chỉ ra từng mắt xích.","This extract is an ‘advantage → disadvantage → consequence’ chain. Identify each link.",
      "Ưu: y tế cơ bản miễn phí cho mọi người. Nhược: rất tốn kém. Hệ quả: khi tuổi thọ và chi phí tăng → gánh nặng tài chính không bền vững HOẶC chất lượng dịch vụ giảm.","Advantage: free basic care for all. Disadvantage: very expensive. Consequence: as life expectancy and costs rise → an unsustainable financial burden OR falling quality."),
    Q("y","Đề <i>“Governments should spend more on preventing illness than on treating it.”</i> — dùng câu này làm lý do ủng hộ thế nào?","Prompt: <i>“Governments should spend more on preventing illness than on treating it.”</i> How can this sentence support the statement?",
      "Vì điều trị ngày càng đắt và dân số già đi, chi cho phòng bệnh là cách duy nhất để tránh “gánh nặng tài chính không bền vững”.","Because treatment keeps getting more expensive and populations are ageing, investing in prevention is the only way to avoid ‘an unsustainable financial burden’."),
    Q("cum","Viết câu với <b>as … rise, …</b> và <b>an unsustainable financial burden</b>.","Write a sentence with <b>as … rise, …</b> and <b>an unsustainable financial burden</b>.",
      "<b>As</b> life expectancy and treatment costs <b>rise</b>, free hospital care for every citizen could become <b>an unsustainable financial burden</b> on taxpayers.","<b>As</b> life expectancy and treatment costs <b>rise</b>, free hospital care for every citizen could become <b>an unsustainable financial burden</b> on taxpayers.",
      "✗ a burden <u>for</u> taxpayers (chấp nhận được) → tự nhiên hơn: <b>a burden on</b> taxpayers.","✗ a burden <u>for</u> taxpayers (possible) → more natural: <b>a burden on</b> taxpayers.")]},
  {ref:"HC-5", para:"2 · Private healthcare",
   quote:"In wealthier countries, most citizens <mark>take out health insurance</mark> to cover their <mark>potential medical costs</mark>. However, not everyone can afford this, and some governments have a scheme which <mark>gives financial assistance to those who need urgent medical care</mark> but are unable to afford it. In other nations, there is <mark>no such safety net</mark>, and those who cannot pay simply do not get the healthcare they need.",
   phrases:["take out health insurance","cover potential medical costs","give financial assistance to those who …","no such safety net"],
   qs:[Q("y","Đề <i>“Medical services should not be run by profit-making companies. Do the advantages of private healthcare outweigh the disadvantages?”</i> — ý nào là nhược điểm lớn nhất?","Prompt: <i>“Medical services should not be run by profit-making companies. Do the advantages of private healthcare outweigh the disadvantages?”</i> Which idea is the biggest disadvantage?",
      "Người không mua nổi bảo hiểm sẽ không được chữa bệnh khi không có “lưới an sinh” → y tế trở thành đặc quyền của người giàu.","People who cannot afford insurance go without treatment when there is ‘no such safety net’ → healthcare becomes a privilege of the rich."),
    Q("cum","Viết câu giải pháp dùng <b>give financial assistance to those who …</b>.","Write a solution sentence using <b>give financial assistance to those who …</b>.",
      "Even in a private system, the state should <b>give financial assistance to those who</b> need urgent treatment but cannot afford insurance.","Even in a private system, the state should <b>give financial assistance to those who</b> need urgent treatment but cannot afford insurance.",
      "✗ <u>buy</u> health insurance (được) → học thuật hơn: <b>take out</b> health insurance; ✗ <u>those people who</u> → <b>those who</b>.","✗ <u>buy</u> health insurance (possible) → more formal: <b>take out</b> health insurance; ✗ <u>those people who</u> → <b>those who</b>.")]},
  {ref:"HC-6", para:"2 · Private healthcare",
   quote:"The disadvantages of this system are obvious: <mark>not only are individuals deprived of the medical attention they need</mark>, but also <mark>the lack of preventative medicine</mark> means that <mark>infectious diseases can quickly spread</mark>.",
   phrases:["Not only are … , but also …","be deprived of","the lack of preventative medicine","infectious diseases can quickly spread"],
   qs:[Q("hieu","Vì sao sau <b>Not only</b> lại là <i>are individuals</i> chứ không phải <i>individuals are</i>?","Why does <b>Not only</b> take <i>are individuals</i> and not <i>individuals are</i>?",
      "Khi <b>Not only</b> đứng đầu mệnh đề → ĐẢO NGỮ (trợ động từ đứng trước chủ ngữ). Đây là cấu trúc câu phức “ăn điểm” GRA.","When <b>Not only</b> begins a clause, we use INVERSION (auxiliary before subject) — a high-value complex structure for GRA."),
    Q("y","Lập luận này cho thấy y tế là vấn đề của CỘNG ĐỒNG, không chỉ của cá nhân. Dùng cho đề nào?","This argument shows that health is a COMMUNITY issue, not just a personal one. Which prompt can use it?",
      "Đề unit: <i>“Avoiding preventable illnesses is the responsibility of individuals… not governments”</i> → phản bác: dịch bệnh lây lan ảnh hưởng mọi người, nên chính phủ phải chịu trách nhiệm phòng bệnh (tiêm chủng, vệ sinh).","Unit prompt: <i>“Avoiding preventable illnesses is the responsibility of individuals… not governments”</i> → counter-argument: infectious diseases affect everyone, so governments must take responsibility for prevention (vaccination, sanitation)."),
    Q("cum","Viết câu ĐẢO NGỮ với <b>Not only …, but … also …</b> về hậu quả của lối sống ít vận động.","Write an INVERTED sentence with <b>Not only …, but … also …</b> about the effects of a sedentary lifestyle.",
      "<b>Not only does</b> a sedentary lifestyle increase the risk of diabetes, <b>but it also</b> places a heavy burden on public hospitals.","<b>Not only does</b> a sedentary lifestyle increase the risk of diabetes, <b>but it also</b> places a heavy burden on public hospitals.",
      "✗ Not only <u>it increases</u> … → <b>Not only does it increase</b> …","✗ Not only <u>it increases</u> … → <b>Not only does it increase</b> …")]},
  {ref:"HC-7", para:"2 · Private healthcare",
   quote:"One advantage, however, is that <mark>a higher quality of care provision</mark> can sometimes be <mark>maintained by commercial organizations</mark> than by <mark>struggling government-funded ones</mark>.",
   phrases:["One advantage, however, is that …","a higher quality of care provision","struggling government-funded ones"],
   qs:[Q("y","Đây là câu NHƯỢNG BỘ trong một đoạn nói về nhược điểm. Dùng nó cho đoạn nào của đề “private healthcare: advantages outweigh disadvantages?”","This is a CONCESSION inside a paragraph about disadvantages. Where does it belong in the essay ‘private healthcare: do the advantages outweigh the disadvantages?’",
      "Đoạn thân bài 1 (phía yếu hơn, nếu bạn kết luận nhược điểm lớn hơn): thừa nhận bệnh viện tư thường có chất lượng phục vụ, thời gian chờ ngắn hơn.","Body paragraph 1 (the weaker side, if you conclude the disadvantages are greater): admit that private hospitals often offer better service and shorter waiting times."),
    Q("cum","Viết câu nhượng bộ bắt đầu bằng <b>Admittedly,</b> và dùng <b>ones</b> để tránh lặp danh từ.","Write a concession starting with <b>Admittedly,</b> and use <b>ones</b> to avoid repeating a noun.",
      "<b>Admittedly</b>, private clinics often provide shorter waiting times than <b>struggling government-funded ones</b>.","<b>Admittedly</b>, private clinics often provide shorter waiting times than <b>struggling government-funded ones</b>.",
      "✗ <u>more higher</u> quality → <b>a higher quality</b>; dùng <b>ones</b> thay cho danh từ số nhiều đã nhắc.","✗ <u>more higher</u> quality → <b>a higher quality</b>; use <b>ones</b> for a plural noun already mentioned.")]},
  {ref:"HC-8", para:"3 · A mixed system",
   quote:"This model <mark>provides more flexibility than</mark> either the public or private models, and <mark>ensures access to healthcare for all</mark>. However, it <mark>has been criticized for driving up labour costs</mark>, which <mark>can lead to unemployment</mark>.",
   phrases:["provide more flexibility than","ensure access to healthcare for all","be criticized for + V-ing","which can lead to + noun"],
   qs:[Q("y","Đề <i>“Healthcare should be free vs patients should pay”</i> (Discussion): mô hình hỗn hợp giúp bạn viết quan điểm cá nhân thế nào?","Discussion prompt <i>“healthcare should be free vs patients should pay”</i>: how does the mixed model help you state your own opinion?",
      "Quan điểm trung gian có cơ sở: bảo hiểm bắt buộc theo thu nhập + được chọn cơ sở công/tư → vừa đảm bảo tiếp cận cho mọi người vừa linh hoạt.","A well-grounded middle position: compulsory income-based insurance + free choice of public/private providers → access for all plus flexibility."),
    Q("cum","Viết câu với <b>be criticized for + V-ing</b> và <b>, which can lead to</b>.","Write a sentence with <b>be criticized for + V-ing</b> and <b>, which can lead to</b>.",
      "Fast-food chains <b>have been criticized for targeting</b> children with advertising<b>, which can lead to</b> unhealthy eating habits later in life.","Fast-food chains <b>have been criticized for targeting</b> children with advertising<b>, which can lead to</b> unhealthy eating habits later in life.",
      "✗ lead to <u>people get sick</u> → <b>lead to + danh từ / V-ing</b>: lead to illness, lead to people getting sick.","✗ lead to <u>people get sick</u> → <b>lead to + noun / -ing</b>: lead to illness, lead to people getting sick.")]},
  {ref:"HC-9", para:"Conclusion",
   quote:"<mark>As no system is perfect</mark>, several countries are now considering <mark>a combination of the models</mark> for their national health system. <mark>The challenge is to find a system which</mark> provides a good level of healthcare to all citizens, but which is also <mark>affordable and practical</mark>.",
   phrases:["As no system is perfect, …","a combination of …","The challenge is to find …","affordable and practical"],
   qs:[Q("hieu","Kết luận này phù hợp với bài báo/ bài luận giải thích. Vì sao nó CHƯA ĐỦ cho đề IELTS “Do the advantages outweigh the disadvantages?”","This conclusion suits an explanatory essay. Why is it NOT enough for the IELTS prompt ‘Do the advantages outweigh the disadvantages?’",
      "Nó không đưa ra phán đoán “outweigh hay không” → thiếu quan điểm rõ ràng (O-POS).","It never judges whether the advantages outweigh the disadvantages → no clear position (O-POS)."),
    Q("cum","Viết lại kết luận cho đề private healthcare, giữ <b>As no system is perfect</b> nhưng PHẢI có phán đoán rõ.","Rewrite the conclusion for the private-healthcare prompt: keep <b>As no system is perfect</b> but give a CLEAR verdict.",
      "In conclusion, <b>as no system is perfect</b>, private providers will always have a role; however, I believe the disadvantages of profit-driven healthcare clearly outweigh its advantages, because access to basic treatment should never depend on income.","In conclusion, <b>as no system is perfect</b>, private providers will always have a role; however, I believe the disadvantages of profit-driven healthcare clearly outweigh its advantages, because access to basic treatment should never depend on income.",
      "Lỗi hay gặp: “Both systems have pros and cons.” → không trả lời câu hỏi.","Common error: “Both systems have pros and cons.” → does not answer the question.")]}
 ]},
 {id:"stm", title:bi("Reading 2 · Ý kiến về trách nhiệm phòng bệnh (Exercise 3)","Reading 2 · Views on responsibility for preventative healthcare (Exercise 3)"), sub:bi("9 nhận định trong tài liệu — kho lập luận cho đề unit","Nine statements from the course — an argument bank for the unit task"), cards:[
  {ref:"PR-1", para:bi("Ủng hộ trách nhiệm cá nhân","For individual responsibility"),
   quote:"Healthcare is extremely expensive for governments, and <mark>medical evidence strongly suggests that lifestyle is a major indicator of health</mark>. […] People should be able to <mark>choose their own lifestyle</mark>. […] If people do not <mark>take personal responsibility</mark>, they will <mark>lose the ability to make good choices</mark>.",
   phrases:["medical evidence strongly suggests that …","lifestyle is a major indicator of health","take personal responsibility","make good choices"],
   qs:[Q("y","Ghép 3 nhận định thành MỘT chuỗi lập luận ủng hộ cá nhân (claim → evidence → consequence).","Combine the three statements into ONE argument chain for individual responsibility (claim → evidence → consequence).",
      "Claim: cá nhân nên chịu trách nhiệm chính. Evidence: lối sống là chỉ báo quan trọng của sức khoẻ. Consequence: nếu nhà nước làm thay, người dân mất khả năng tự lựa chọn đúng.","Claim: individuals should bear the main responsibility. Evidence: lifestyle is a major indicator of health. Consequence: if the state does everything, people lose the ability to make good choices."),
    Q("cum","Viết topic sentence + 1 câu bằng chứng dùng <b>medical evidence strongly suggests that</b>.","Write a topic sentence + one evidence sentence using <b>medical evidence strongly suggests that</b>.",
      "There are strong reasons why individuals should <b>take personal responsibility</b> for their health. <b>Medical evidence strongly suggests that</b> lifestyle choices such as diet, exercise and smoking are <b>a major indicator of health</b>.","There are strong reasons why individuals should <b>take personal responsibility</b> for their health. <b>Medical evidence strongly suggests that</b> lifestyle choices such as diet, exercise and smoking are <b>a major indicator of health</b>.",
      "✗ take responsibility <u>of</u> → <b>take responsibility for</b>.","✗ take responsibility <u>of</u> → <b>take responsibility for</b>.")]},
  {ref:"PR-2", para:bi("Phản đối (vai trò chính phủ)","Against (the government’s role)"),
   quote:"Many people want to eat healthily, but <mark>get tempted by advertising for junk food</mark>. Some people <mark>cannot afford to use gyms and other sports facilities</mark>. <mark>Health advice changes so frequently that</mark> people get confused about what they should and should not do. […] <mark>Health education, not only in schools, is needed</mark>.",
   phrases:["get tempted by advertising for junk food","cannot afford to use …","so frequently that …","Health education is needed"],
   qs:[Q("y","Mỗi nhận định chỉ ra một RÀO CẢN khiến cá nhân khó tự phòng bệnh. Với mỗi rào cản, đề xuất 1 hành động của chính phủ.","Each statement shows a BARRIER to individual prevention. For each barrier, suggest one government action.",
      "Quảng cáo đồ ăn vặt → hạn chế quảng cáo nhắm vào trẻ em; không đủ tiền tập gym → công viên, sân tập công cộng miễn phí; thông tin rối → chiến dịch giáo dục sức khoẻ thống nhất.","Junk-food advertising → restrict adverts aimed at children; cannot afford gyms → free public parks and sports grounds; confusing advice → clear national health-education campaigns."),
    Q("cum","Viết câu dùng cấu trúc <b>so + adj/adv + that</b> về thông tin sức khoẻ trên mạng.","Write a sentence with <b>so + adjective/adverb + that</b> about online health information.",
      "Health advice on social media changes <b>so frequently that</b> many people no longer know which information to trust.","Health advice on social media changes <b>so frequently that</b> many people no longer know which information to trust.",
      "✗ <u>so much frequently</u> → <b>so frequently</b>; ✗ eat <u>healthy food</u> (được) / eat <b>healthily</b> (trạng từ).","✗ <u>so much frequently</u> → <b>so frequently</b>; eat <b>healthily</b> (adverb) or eat healthy food.")]}
 ]},
 {id:"con", title:bi("Kỹ năng · Language of concession (văn bản mẫu)","Skills text · Language of concession"), sub:bi("Mẫu câu nhượng bộ trong tài liệu","Model concession sentences from the course"), cards:[
  {ref:"CON-1", para:"Concession",
   quote:"Homeopathy seems to be ineffective. <mark>Nevertheless</mark>, people still use it. <mark>Even though / Despite the fact that / In spite of the fact that</mark> homeopathy seems to be ineffective, people still use it. <mark>Despite / In spite of the ineffectiveness of</mark> homeopathy, people still use it.",
   phrases:["Nevertheless, …","Despite the fact that + clause","Despite + noun","In spite of the fact that + clause"],
   qs:[Q("hieu","Sau <b>Despite / In spite of</b> dùng gì? Sau <b>Despite the fact that</b> dùng gì?","What follows <b>Despite / In spite of</b>? What follows <b>Despite the fact that</b>?",
      "Despite / In spite of + DANH TỪ / V-ing (the ineffectiveness of…). Despite the fact that + MỆNH ĐỀ (homeopathy seems…).","Despite / In spite of + NOUN / -ing (the ineffectiveness of…). Despite the fact that + CLAUSE (homeopathy seems…)."),
    Q("cum","Viết 2 câu về lời khuyên tập thể dục của bác sĩ cho người cao tuổi: 1 câu với <b>Despite + noun</b>, 1 câu với <b>Even though + clause</b>.","Write two sentences about doctors advising elderly people to exercise: one with <b>Despite + noun</b>, one with <b>Even though + clause</b>.",
      "<b>Despite</b> repeated advice from their doctors, many elderly patients rarely exercise. <b>Even though</b> they know that walking is beneficial, many older people stay at home because they fear injury.","<b>Despite</b> repeated advice from their doctors, many elderly patients rarely exercise. <b>Even though</b> they know that walking is beneficial, many older people stay at home because they fear injury.",
      "✗ <u>Despite of</u> → <b>Despite</b> / <b>In spite of</b>; ✗ Despite <u>they know</u> → <b>Despite knowing</b> / <b>Even though they know</b>.","✗ <u>Despite of</u> → <b>Despite</b> / <b>In spite of</b>; ✗ Despite <u>they know</u> → <b>Despite knowing</b> / <b>Even though they know</b>.")]}
 ]}
 ]
}};

ERRCODES["G-CONC"]={vi:"Nhượng bộ (Despite / Although / However)",en:"Concession (Despite / Although / However)"};
const fx=(c,w,a,vi,en)=>({t:"fix",c,w,a,r:bi(vi,en)});

  {t:"order", c:"O-ORD", q:bi("Sắp xếp thành đoạn: Concession → Rebuttal → Explanation → Example → Result","Put the sentences in order: Concession → Rebuttal → Explanation → Example → Result"),

  mc("O-ORD","Prompt (Problem–Solution): Problems = (1) junk-food advertising, (2) lack of free sports facilities. Which solution paragraph MATCHES?",["Solutions: build more hospitals; train more doctors.","Solutions: ban junk-food adverts aimed at children; open free public sports grounds.","Solutions: people should try harder; schools should give more homework.","Solutions: raise taxes on cars; plant more trees."],1,"Giải pháp phải <b>khớp 1–1</b> với vấn đề đã nêu ở thân bài 1.","Solutions must <b>match the problems one-to-one</b> from body paragraph 1.","Đề (Problem–Solution): Vấn đề = (1) quảng cáo đồ ăn vặt, (2) thiếu cơ sở thể thao miễn phí. Đoạn giải pháp nào KHỚP?"),

  fx("O-POS","In conclusion, both individuals and governments have responsibility, so it depends on the situation.","In conclusion, <b>although</b> individuals must make sensible lifestyle choices, I <b>disagree</b> that preventing illness is their responsibility alone, since governments control many of the conditions that make healthy living possible.","Đề “Do you agree?” → kết luận phải nhắc lại RÕ mức độ đồng ý, nhất quán với mở bài. “It depends” = không có quan điểm.","A “Do you agree?” prompt needs a conclusion that restates your level of agreement CLEARLY and consistently. “It depends” = no position."),

 {id:"gp0", ty:"op", date:"Writing Studio · Unit task",

   "Do you agree? → nêu rõ đồng ý / không đồng ý / đồng ý một phần ngay ở mở bài.","Do you agree? → state agree / disagree / partly agree clearly in the introduction.",
   "Chỉ liệt kê cách giữ sức khoẻ (ăn uống, tập thể dục) mà không bàn AI chịu trách nhiệm; quên phần “not governments”.","Listing ways to stay healthy (diet, exercise) without discussing WHO is responsible; ignoring the words “not governments”."),

   {h:bi("Body 2 · Phản bác: vai trò chính phủ","Body 2 · Rebuttal: the government’s role"), t:"However… barriers beyond individual control: junk-food advertising, cost of gyms, confusing advice (PR-2) → infectious diseases spread without preventative medicine (HC-6) → prevention cheaper than an unsustainable financial burden (HC-4)."},
   {h:"Conclusion", t:"Restate: largely disagree — shared responsibility."}
  ],
  build:[bq("Viết thesis “largely disagree” dùng cấu trúc nhượng bộ <b>Although …</b>.","Write a ‘largely disagree’ thesis using a concession with <b>Although …</b>.","Although individuals must make sensible lifestyle choices, I largely disagree that preventing illness is their responsibility alone."),
   bq("Viết câu chuyển ý từ nhượng bộ sang phản bác dùng <b>Nevertheless,</b>","Write the turning sentence from concession to rebuttal using <b>Nevertheless,</b>","Nevertheless, many of the factors that shape people’s health lie beyond their personal control."),
   bq("Viết câu ví dụ dùng <b>get tempted by advertising for junk food</b>.","Write an example sentence using <b>get tempted by advertising for junk food</b>.","For instance, even parents who want their children to eat healthily often find that their children get tempted by advertising for junk food on television and social media.")],
  model:"Nevertheless, many of the factors that determine whether people stay healthy lie beyond their personal control. Families who want to eat healthily are constantly tempted by advertising for cheap junk food, and those on low incomes often cannot afford gym memberships or fresh produce. Moreover, some illnesses cannot be prevented by individuals alone: without a national vaccination programme and clean public water, infectious diseases can spread quickly regardless of how carefully one family behaves. Governments therefore have a crucial role to play, whether by restricting junk-food advertising aimed at children, funding free public sports facilities or running clear health-education campaigns. Such measures are also in the state’s own interest, since preventing illness is far cheaper than treating it once it has developed.",

 {id:"gp1", ty:"ad", date:"07/07/2024 · 16/03/2025 · 17/10/2025",

  pos:bi("<b>Nhược điểm lớn hơn</b> — y tế tư có chất lượng phục vụ tốt, nhưng khiến người nghèo bị bỏ lại và đẩy chi phí lên.","<b>The disadvantages outweigh the advantages</b> — private care can offer high-quality service, but it leaves the poor behind and drives up costs."),
  outline:[

   {h:bi("Body 2 · Nhược điểm (phía mạnh hơn)","Body 2 · Disadvantages (the stronger side)"), t:"Not only are individuals deprived of the medical attention they need… (HC-6) → no such safety net (HC-5) → profit motive: unnecessary tests, high prices → lack of preventative medicine → infectious diseases spread."},

  build:[bq("Viết thesis có phán đoán rõ, dùng <b>outweighed by</b>.","Write a thesis with a clear verdict using <b>outweighed by</b>.","Although private hospitals often provide faster and more comfortable treatment, I believe these benefits are outweighed by the risk that poorer patients will be denied essential care."),
   bq("Viết câu ĐẢO NGỮ <b>Not only …, but … also …</b> cho Body 2.","Write an INVERTED <b>Not only …, but … also …</b> sentence for Body 2.","Not only are low-income patients deprived of the treatment they need, but the lack of preventative care also allows infectious diseases to spread."),
   bq("Viết câu nhượng bộ cho Body 1 dùng <b>struggling government-funded ones</b>.","Write a concession for Body 1 using <b>struggling government-funded ones</b>.","Admittedly, commercial hospitals can often maintain higher standards of care than struggling government-funded ones.")],
  model:"The disadvantages of leaving healthcare to profit-making companies, however, are far more serious. Not only are low-income patients deprived of the medical attention they need, but the lack of preventative care also allows infectious diseases to spread through whole communities. Where there is no public safety net, a single serious illness can push a family into debt, as hospitals charge whatever the market will bear. In addition, the pursuit of profit can encourage unnecessary tests and treatments, which drive up costs for everyone. Since good health is a basic need rather than a luxury, I believe a system in which access to treatment depends on income cannot be justified.",

 {id:"gp3", ty:"two", date:"02/11/2024 · 22/03/2025",
  p:"Nowadays, many people use the Internet to get medical advice instead of going to see a doctor. Why is this? Is this a positive or negative development?",
  an:an("use the Internet · medical advice · instead of · see a doctor · why · positive or negative",
   "<b>instead of</b> going to see a doctor (thay thế, không phải “tham khảo thêm”)","<b>instead of</b> going to see a doctor (replacing, not ‘as well as’)",
   "Hai câu hỏi → hai đoạn: (1) lý do, (2) tích cực hay tiêu cực — phải chọn rõ.","Two questions → two paragraphs: (1) reasons, (2) positive or negative — you must choose.",
   "Chỉ trả lời câu 2; đoạn 1 viết thành ưu điểm thay vì lý do; câu 2 trả lời “both”.","Answering only question 2; writing advantages instead of reasons in paragraph 1; answering “both” to question 2."),
  pos:bi("Lý do: tiện, miễn phí, tránh chờ đợi và chi phí khám. Đánh giá: <b>chủ yếu tiêu cực</b> khi dùng THAY THẾ bác sĩ.","Reasons: convenience, no cost, avoiding waiting times and consultation fees. Verdict: <b>largely negative</b> when it REPLACES a doctor."),
  outline:[
   {h:"Introduction", t:"Paraphrase + short answers to both questions."},
   {h:bi("Body 1 · Lý do","Body 1 · Reasons"), t:"Consultations and long waiting times; cost where there is no safety net (HC-5); instant, free, private information; embarrassment about some symptoms."},
   {h:bi("Body 2 · Đánh giá: tiêu cực","Body 2 · Verdict: negative"), t:"Admittedly, useful for minor problems… However, health advice changes so frequently that people get confused (PR-2) → wrong self-diagnosis, delayed treatment → misinformation."},
   {h:"Conclusion", t:"Restate reasons + verdict."}
  ],
  build:[bq("Viết câu lý do dùng <b>due to / because of + noun</b>.","Write a reason sentence using <b>due to / because of + noun</b>.","Many people turn to the internet because of the long waiting times and high consultation fees at clinics."),
   bq("Viết câu nhượng bộ – phản bác dùng <b>While … , …</b>.","Write a concession–rebuttal sentence with <b>While … , …</b>.","While online information can help people deal with minor problems such as a cold, it cannot replace a proper examination by a qualified doctor."),
   bq("Viết câu hệ quả dùng <b>, which can lead to + noun</b>.","Write a consequence sentence with <b>, which can lead to + noun</b>.","Patients may misread their symptoms and delay seeing a doctor, which can lead to serious complications.")],
  model:"There are several reasons why people increasingly look for medical advice online. The most obvious is convenience: instead of taking time off work and waiting for hours at a clinic, they can find information about their symptoms within seconds. Cost is another factor, particularly in countries where patients must pay for each consultation and there is no public safety net. In addition, some people feel embarrassed about discussing certain health problems face to face and prefer the privacy of an online search.",

 {id:"gp4", ty:"ps", date:"28/09/2024",
  p:"Scientists have shown that some activities are good for our health and others are bad for it. However, many people continue to do things that are harmful to their health. Why do they do this? What can be done to encourage them to live more healthily?",
  an:an("continue · harmful · why · encourage · live more healthily",
   "<b>continue</b> (dù đã biết là có hại) · <b>encourage</b> (khuyến khích — không phải bắt buộc)","<b>continue</b> (even though they know it is harmful) · <b>encourage</b> (persuade — not force)",
   "Hai phần: nguyên nhân + giải pháp; giải pháp phải khớp 1–1 với nguyên nhân.","Two parts: causes + solutions; the solutions must match the causes one-to-one.",
   "Liệt kê thói quen xấu thay vì giải thích VÌ SAO; giải pháp chung chung “people should be more careful”.","Listing bad habits instead of explaining WHY; vague solutions such as “people should be more careful”."),
  pos:bi("Không cần agree/disagree. Mở bài nêu: nguyên nhân chính là tiện lợi/giá rẻ và đánh giá thấp rủi ro; giải pháp là thay đổi môi trường + giáo dục.","No agree/disagree needed. The introduction previews: the main causes are convenience/low cost and underestimating risks; the solutions are changing the environment + education."),
  outline:[
   {h:"Introduction", t:"Paraphrase + preview causes and solutions."},
   {h:bi("Body 1 · Nguyên nhân","Body 1 · Causes"), t:"(1) Unhealthy options are cheaper and more convenient; tempted by advertising (PR-2). (2) People underestimate long-term risks; the easiest thing is to do nothing (PR-2)."},
   {h:bi("Body 2 · Giải pháp (khớp 1–1)","Body 2 · Solutions (matching 1–1)"), t:"(1) Make healthy options cheaper: subsidise fruit and vegetables, tax sugary drinks, restrict junk-food adverts. (2) Make risks visible: health education, not only in schools; regular check-ups."},
   {h:"Conclusion", t:"Summary."}
  ],
  build:[bq("Viết câu nguyên nhân dùng <b>Even though + clause</b>.","Write a cause sentence using <b>Even though + clause</b>.","Even though most people know that fast food is unhealthy, they choose it because it is cheap, quick and widely available."),
   bq("Viết câu giải pháp dùng cấu trúc <b>It is essential to …</b>.","Write a solution sentence using <b>It is essential to …</b>.","It is essential to make healthy options cheaper than unhealthy ones, for example by subsidising fresh fruit and vegetables."),
   bq("Viết câu kết quả dùng <b>This would …</b>.","Write a result sentence using <b>This would …</b>.","This would allow even low-income families to eat well without spending more on food.")],
  model:"The main reason why people continue harmful habits is that unhealthy choices are usually easier and cheaper. Even though most people know that fast food and sugary drinks damage their health, these products are inexpensive, ready in minutes and promoted by constant advertising, while healthy meals require time and money that many busy workers do not have. Another reason is that the consequences of an unhealthy lifestyle appear slowly. A young smoker or a person who never exercises may feel perfectly well for years, so they tend to underestimate the long-term risks and postpone making any changes.",

/* --- band table + checklist (shared) --- */
function bandGroupHTML(title, bands, cls){
  const rows = bandDescriptors.filter(d=>bands.includes(d.b)).map(d=>
    `<tr data-b="${d.b}"><td class="bn">${d.b}</td>
     <td>${d.tr}</td><td>${d.cc}</td><td>${d.lr}</td><td>${d.gra}</td></tr>`).join('');
  return `<div class="bandgroup ${cls}"><div class="bghead">${title}</div>
    <div class="bandwrap"><table class="band"><thead><tr>
      <th>Band</th><th>Task Response</th><th>Coherence &amp; Cohesion</th>
      <th>Lexical Resource</th><th>Grammatical Range &amp; Accuracy</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function bandTableHTML(){
  return bandGroupHTML("Band 8–9 · Very good – Expert user", ["8","9"], "bg-hi")
       + bandGroupHTML("Band 6–7 · Competent – Good user", ["6","7"], "bg-mid")
       + bandGroupHTML("Band 4–5 · Limited – Modest user", ["4","5"], "bg-lo")
       + `<div class="bandsrc" style="border:1px solid var(--line);border-radius:8px">${tr('bandsrc')}</div>`;
}
function checklistHTML(topicId){
  let out = `<button class="resetbtn" onclick="resetChecks('${topicId}')">${tr('chk.reset')}</button>`;
  for(const k in checklist){
    const c=checklist[k];
    out += `<div class="crit"><h4><span class="k">${k}</span> ${c.name}</h4>`;
    c.items.forEach((it,idx)=>{
      const id=`chk-${topicId}-${k}-${idx}`;
      const label = (it&&typeof it==='object') ? (it[LANG]||it.vi) : it;
      out+=`<div class="check"><input type="checkbox" id="${id}"><label for="${id}">${label}</label></div>`;
    });
    out+=`</div>`;
  }
  out += `<div class="themetag" style="margin-top:18px">${tr('chk.bands')}</div>`;
  out += bandTableHTML();
  return out;
}
function resetChecks(topicId){
  document.querySelectorAll(`[id^="chk-${topicId}-"]`).forEach(c=>c.checked=false);
}

function richVocabHTML(id){
  const t=VOCAB[id]; if(!t) return '';
  return t.groups.map(g=>`<div class="vsub">${esc(g.sub)}</div>`+
    `<div class="vgrid">`+g.words.map(entryHTML).join('')+`</div>`).join('');

let _gbVoice=null;
function pickGBVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  // prefer named British voices, then any en-GB voice
  const pref=["Google UK English Female","Google UK English Male","Daniel","Kate","Serena","Arthur","Sonia","Libby","George"];
  for(const name of pref){const v=vs.find(x=>x.name===name);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/English \(United Kingdom\)/i.test(v.name)) || null;
}
if('speechSynthesis' in window){
  _gbVoice=pickGBVoice();
  speechSynthesis.onvoiceschanged=()=>{_gbVoice=pickGBVoice();};
}
function speak(w){
  try{ if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(w);
    u.lang='en-GB'; u.rate=.9;
    if(!_gbVoice)_gbVoice=pickGBVoice();
    if(_gbVoice)u.voice=_gbVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* --- idea block --- */
function ideaHTML(node){
  if(node.theme){return `<div class="themetag">◆ ${esc(node.theme)}</div>`;}
  const cls = node.side==='against'?'arg against':'arg';
  const tag = node.side==='against'?tr('idea.tag.counter'):tr('idea.tag.arg');
  return `<div class="${cls}"><div class="claim"><span class="tag">${tag}</span><span>${esc(node.claim)}</span></div>
    <ul class="chain">${node.chain.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
}

/* ---------- Sentence Clinic ---------- */
function errLog(){
  const cnt={};
  const add=c=>{cnt[c]=(cnt[c]||0)+1;};
  const all={}; CLINIC.t1.groups.forEach(g=>g.items.forEach((it,i)=>all[g.id+'-'+i]=it));
  for(const k in ST.mcq){const it=all[k]; if(it && ST.mcq[k]!==it.k) add(it.c);}
  for(const k in ST.self){if(ST.self[k]==='miss' && all[k]) add(all[k].c);}
  for(const k in ST.order){if(ST.order[k]===false && all[k]) add(all[k].c);}
  return cnt;
}
function renderLog(){
  const el=document.getElementById('errlog'); if(!el) return;
  const cnt=errLog(); const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  el.innerHTML = keys.length ? keys.map(k=>`<div class="logrow ${cnt[k]>=3?'hot':''}"><span class="code">${k}</span><span class="lname">${L(ERRCODES[k])}</span><span class="lbar"><i style="width:${Math.min(100,cnt[k]*25)}%"></i></span><span class="lnum">${cnt[k]}</span></div>`).join('')+`<div class="lognote">${xt('log.note')}</div>`
    : `<div class="lognote">${xt('log.empty')}</div>`;
}
var resetClinic=function(){ST.mcq={};ST.self={};ST.order={};renderMain();show('t1');const b=document.querySelector('#sub-t1 button[data-p="clinic"]');if(b)b.click();}
function pickMcq(key,i){ST.mcq[key]=i; const box=document.getElementById('it-'+key); if(box) box.outerHTML=itemHTML(key, findItem(key)); renderLog();}
function selfMark(key,v){ST.self[key]=v; const box=document.getElementById('it-'+key); if(box) box.outerHTML=itemHTML(key, findItem(key)); renderLog();}
function checkOrder(key){const it=findItem(key); const inp=document.getElementById('ord-'+key); const v=(inp.value||'').toLowerCase().replace(/[^a-z]/g,''); ST.drafts['ord-'+key]=inp.value; ST.order[key]=(v===it.k); const box=document.getElementById('it-'+key); box.outerHTML=itemHTML(key,it); renderLog();}
function findItem(key){const [g,i]=[key.slice(0,key.lastIndexOf('-')),+key.slice(key.lastIndexOf('-')+1)]; return CLINIC.t1.groups.find(x=>x.id===g).items[i];}
function itemHTML(key,it){
  const code=`<span class="code" title="${esc(L(ERRCODES[it.c]))}">${it.c}</span>`;
  if(it.t==='fix'){
    const s=ST.self[key];
    return `<div class="citem ${s==='got'?'ok':s==='miss'?'bad':''}" id="it-${key}"><div class="cq">${code}<span class="ctype">✍️ Fix</span><span class="wrong">✗ ${esc(it.w)}</span></div>
      ${ta('cl-'+key,2)}
      <details ${s?'open':''}><summary>${xt('model')}</summary><div class="ans">✓ ${it.a}</div><div class="rule">${it.r}</div>
      <div class="selfbtn"><button class="${s==='got'?'on':''}" onclick="selfMark('${key}','got')">${xt('got')}</button><button class="miss ${s==='miss'?'on':''}" onclick="selfMark('${key}','miss')">${xt('miss')}</button></div></details></div>`;
  }
  if(it.t==='mcq'){
    const pick=ST.mcq[key];
    const done=pick!==undefined;
    return `<div class="citem ${done?(pick===it.k?'ok':'bad'):''}" id="it-${key}"><div class="cq">${code}<span class="ctype">☑ Choose</span><span>${it.q}</span></div>
      <div class="opts">${it.o.map((o,i)=>`<button class="opt ${done&&i===it.k?'right':''} ${done&&i===pick&&pick!==it.k?'wrongpick':''}" ${done?'disabled':''} onclick="pickMcq('${key}',${i})"><b>${String.fromCharCode(97+i)}</b> ${esc(o)}</button>`).join('')}</div>
      ${done?`<div class="rule">${it.r}</div>`:''}</div>`;
  }
  if(it.t==='order'){
    const r=ST.order[key];
    return `<div class="citem ${r===true?'ok':r===false?'bad':''}" id="it-${key}"><div class="cq">${code}<span class="ctype">↕ Order</span><span>${it.q}</span></div>
      <ol type="a" class="osents">${it.s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      <div class="orow"><input id="ord-${key}" class="oin" placeholder="e.g. d a c b" value="${esc(ST.drafts['ord-'+key]||'')}"><button class="linkbtn" onclick="checkOrder('${key}')">${xt('check')}</button></div>
      ${r!==undefined?`<div class="rule">${r?'✓':'✗ → <b>'+it.k.split('').join(' ')+'</b>'} · ${it.r}</div>`:''}</div>`;
  }
  return '';
}
function clinicHTML(id){
  const C=CLINIC[id]; if(!C) return '';
  let out=`<div class="note">${L(C.intro)}</div>
    <div class="logbox"><div class="loghead"><b>${xt('log.h')}</b><button class="resetbtn" style="margin:0" onclick="resetClinic()">${xt('log.reset')}</button></div><div id="errlog"></div></div>`;
  C.groups.forEach(g=>{
    out+=`<div class="cgroup"><h4>${g.icon} ${L(g.title)}</h4><div class="lead">${L(g.lead)}</div>`;
    g.items.forEach((it,i)=>{out+=itemHTML(g.id+'-'+i,it);});
    out+=`</div>`;
  });
  return out;
}

  let s=40*60; const tick=()=>{const m=Math.floor(s/60),ss=('0'+s%60).slice(-2); btn.textContent='⏸ '+m+':'+ss; if(s--<=0){clearInterval(_timer);_timer=null;btn.textContent='⏰ 0:00';}};

const norm=s=>(s||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.]/g,'').trim();
function gapEx(id,ex){
  return `<div class="ex" id="${id}"><h4>${ex.h}</h4>${ex.box?`<div class="exbox">${ex.box}</div>`:''}<ol>${ex.items.map((it,i)=>{
     const parts=it[0].split('___');
     return `<li data-ans="${esc(it[1])}">${parts.map((p,j)=>esc(p)+(j<parts.length-1?`<input class="gap" data-k="${id}-${i}-${j}" value="${esc(ST.drafts[id+'-'+i+'-'+j]||'')}" oninput="ST.drafts[this.dataset.k]=this.value">`:'')).join('')}<span class="mk"></span></li>`;}).join('')}</ol>
   <div class="exbtn"><button class="linkbtn" onclick="checkGap('${id}')">${xt('check')}</button><button class="resetbtn" onclick="showKey('${id}')">${V('Xem đáp án','Show key')}</button></div></div>`;
}
function checkGap(id){
  let ok=0,n=0;
  document.querySelectorAll('#'+id+' li').forEach(li=>{
    const ans=li.dataset.ans.split(' / ').map(norm); const got=[...li.querySelectorAll('input')].map(x=>norm(x.value));
    const good = got.length===ans.length && got.every(g=>ans.includes(g)) && new Set(got).size===got.length;
    li.querySelector('.mk').innerHTML=good?'<b class="okk">✓</b>':'<b class="nok">✗</b>'; n++; if(good) ok++;
  });
  scoreBadge(id,ok,n);
}
function showKey(id){document.querySelectorAll('#'+id+' li').forEach(li=>{li.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(li.dataset.ans)}</span>`;});}
function scoreBadge(id,ok,n){let b=document.querySelector('#'+id+' .score'); if(!b){b=document.createElement('span');b.className='score';document.querySelector('#'+id+' .exbtn').appendChild(b);} b.textContent=ok+'/'+n; b.classList.toggle('full',ok===n);}
function selEx(id,h,rows,opts,note){ // rows: [label, keyValue, explain?]
  return `<div class="ex" id="${id}"><h4>${h}</h4>${note?`<div class="exnote">${note}</div>`:''}<table class="extbl"><tbody>${rows.map((r,i)=>`<tr data-ans="${esc(r[1])}" data-why="${esc(r[2]||'')}"><td class="n">${i+1}</td><td>${esc(r[0])}</td><td><select data-k="${id}-${i}" onchange="ST.drafts[this.dataset.k]=this.value"><option value="">—</option>${opts.map(o=>`<option value="${esc(o[0])}" ${ST.drafts[id+'-'+i]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></td><td class="mk"></td></tr>`).join('')}</tbody></table>
   <div class="exbtn"><button class="linkbtn" onclick="checkSel('${id}')">${xt('check')}</button><button class="resetbtn" onclick="keySel('${id}')">${V('Xem đáp án','Show key')}</button></div></div>`;
}
function checkSel(id){let ok=0,n=0; document.querySelectorAll('#'+id+' tr').forEach(tr=>{const v=tr.querySelector('select').value; const g=v===tr.dataset.ans; n++; if(g)ok++; tr.querySelector('.mk').innerHTML=(g?'<b class="okk">✓</b>':'<b class="nok">✗</b>')+(tr.dataset.why&&v?` <span class="why">${esc(tr.dataset.why)}</span>`:'');}); scoreBadge(id,ok,n);}
function keySel(id){document.querySelectorAll('#'+id+' tr').forEach(tr=>{const o=[...tr.querySelector('select').options].find(o=>o.value===tr.dataset.ans); tr.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(o?o.text:tr.dataset.ans)}</span>${tr.dataset.why?` <span class="why">${esc(tr.dataset.why)}</span>`:''}`;});}
function matchEx(id,m){const letters='abcdefghijk'; return `<div class="matchwrap"><ol type="a" class="mright">${m.right.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>`+selEx(id,m.h,m.left.map((l,i)=>[l,letters[m.key[i]]]),m.right.map((r,i)=>[letters[i],letters[i]+' · '+r]));}
function oddEx(id,ex){
  return `<div class="ex" id="${id}"><h4>${ex.h}</h4><div class="odd">${ex.items.map((it,i)=>`<div class="oddrow"><span class="n">${i+1}</span>${it.slice(0,3).map(w=>`<button class="oddw" onclick="pickOdd(this,'${it[3]}')">${w}</button>`).join('')}</div>`).join('')}</div></div>`;
}
