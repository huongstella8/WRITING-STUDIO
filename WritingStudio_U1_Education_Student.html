<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Studio · Unit 1 Education · Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#d76b34; --orange-soft:#e7a173; --sage:#7f9a76; --sage-soft:#c3d0bd;
    --cream:#f1efe7; --paper:#ffffff; --ink:#232321; --muted:#6f6e66;
    --line:#e7e3d7; --yellow:#e9d9a6;
    --shadow:0 1px 2px rgba(30,28,22,.04),0 6px 20px rgba(30,28,22,.06);
    --shadow-lg:0 4px 30px rgba(30,28,22,.10);
    --font-head:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --rad:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);
    line-height:1.62;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:600}
  a{color:var(--orange)}
  /* Header */
  header.top{background:radial-gradient(120% 140% at 0% 0%,#33322d 0%,#1f1e1b 55%,#191814 100%);
    color:#fff;padding:20px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(215,107,52,.28),transparent 70%);pointer-events:none}
  header.top .paradigm{font-family:var(--font-head);font-size:15px;letter-spacing:6px;font-weight:600;
    color:#fff;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:11px;margin-bottom:13px;text-transform:uppercase}
  header.top .brand{font-size:12px;letter-spacing:4px;color:var(--orange-soft);font-weight:700}
  header.top h1{font-size:33px;margin:3px 0 6px;color:#fff;font-weight:600;letter-spacing:-.02em}
  header.top p{margin:0;color:#d3d0c6;font-size:13.5px;max-width:860px;line-height:1.55}
  header.top .langswitch{position:absolute;top:20px;right:26px;display:flex;gap:0;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;overflow:hidden;z-index:2}
  header.top .langswitch button{border:0;background:transparent;color:#d3d0c6;font:inherit;font-weight:700;
    font-size:12px;letter-spacing:.5px;padding:6px 13px;cursor:pointer;transition:.15s}
  header.top .langswitch button.on{background:var(--orange);color:#fff}
  /* Tabs */
  nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:9px 16px;
    box-shadow:0 2px 14px rgba(30,28,22,.05)}
  nav.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);
    padding:8px 15px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
  nav.tabs button:hover{background:var(--cream);color:var(--ink)}
  nav.tabs button.active{background:var(--ink);color:#fff}
  nav.tabs button .tno{font-size:10.5px;opacity:.65;margin-right:5px;font-weight:800}
  /* Layout */
  main{max-width:1090px;margin:0 auto;padding:28px 22px 90px}
  section.view{display:none;animation:fade .25s ease}
  section.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Sub nav */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
  .subnav button{border:1px solid var(--line);background:var(--paper);font:inherit;font-weight:600;
    font-size:13px;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
  .subnav button:hover{border-color:var(--sage)}
  .subnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .panel{display:none}
  .panel.on{display:block}
  /* Cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:22px 24px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .card h3{font-size:21px;margin-bottom:5px;color:var(--ink)}
  .card .lead{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:820px}
  .topichero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:4px 2px}
  .topichero .badge{width:60px;height:60px;border-radius:16px;
    background:linear-gradient(150deg,var(--orange),#c05a26);color:#fff;box-shadow:0 6px 16px rgba(199,90,40,.28);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:23px;font-weight:600;flex-shrink:0}
  .topichero h2{font-size:28px}
  .topichero p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  /* Vocab */
  .vgroup{margin-bottom:18px}
  .vgroup h4{font-size:15px;color:var(--orange);border-bottom:2px solid var(--sage-soft);
    padding-bottom:5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13.5px}
  .chip b{color:var(--ink)}
  .wtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .wtable td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
  .wtable td:first-child{font-weight:600;width:38%;background:var(--cream)}
  /* Rich vocabulary entries */
  .vsub{font-family:var(--font-head);font-size:13.5px;font-weight:600;color:#8a5a2c;display:flex;align-items:center;gap:9px;
    margin:20px 0 12px;letter-spacing:.01em}
  .vsub::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px;display:inline-block}
  .ventry{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:var(--paper);
    box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
  .ventry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .ventry .vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ventry .vw{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
  .ventry .pos{font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);padding:2px 9px;border-radius:12px;font-style:normal;letter-spacing:.3px}
  .ventry .ipa{font-family:var(--font-body);color:var(--orange);font-size:14px;font-weight:500}
  .ventry .vspeak{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:8px;
    cursor:pointer;font-size:13px;padding:3px 9px;color:var(--muted)}
  .ventry .vspeak:hover{border-color:var(--orange);color:var(--orange)}
  .ventry .vdef{font-size:13.6px;margin:2px 0}
  .ventry .vdef b{color:var(--sage);font-size:11px;letter-spacing:.5px;margin-right:4px}
  .ventry .vdef.vi b{color:var(--orange)}
  .ventry .vex{font-size:13.2px;font-style:italic;color:var(--muted);margin-top:6px;
    border-left:3px solid var(--sage-soft);padding-left:10px}
  .ventry .vex b{font-style:normal;color:var(--ink)}
  .ventry .vcol{font-size:12.4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;color:#5c5c54}
  .ventry .vcol b{display:block;color:var(--orange);font-size:9.5px;letter-spacing:.7px;margin-bottom:2px;font-weight:700}
  /* side-by-side vocabulary boxes */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;align-items:stretch}
  .vgrid .ventry{margin-bottom:0;display:flex;flex-direction:column}
  @media(max-width:640px){.vgrid{grid-template-columns:1fr}}
  /* Glossary */
  .gsearch{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font:inherit;
    font-size:14px;margin-bottom:16px;background:var(--paper)}
  .gsearch:focus{outline:none;border-color:var(--orange)}
  .gtopic{scroll-margin-top:70px}
  .gtopic h3{font-size:19px;color:var(--ink);border-bottom:2px solid var(--orange);padding-bottom:6px;margin:22px 0 4px}
  .gcount{font-size:12px;color:var(--muted);margin-bottom:6px}
  .gjump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .gjump a{font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);
    padding:4px 10px;border-radius:16px;background:var(--paper)}
  .gjump a:hover{border-color:var(--orange);color:var(--orange)}
  /* Idea development */
  .arg{border-left:4px solid var(--orange);background:var(--paper);border:1px solid var(--line);
    border-left-width:4px;border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:14px}
  .arg.against{border-left-color:var(--sage)}
  .arg .claim{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
  .arg .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;
    color:#fff;background:var(--orange);flex-shrink:0;margin-top:2px}
  .arg.against .tag{background:var(--sage)}
  .chain{list-style:none;margin:0;padding:0;counter-reset:step}
  .chain li{position:relative;padding:4px 0 4px 30px;font-size:13.8px;counter-increment:step}
  .chain li::before{content:counter(step);position:absolute;left:0;top:4px;width:20px;height:20px;
    background:var(--cream);border:1px solid var(--sage);border-radius:50%;font-size:11px;font-weight:700;
    color:var(--sage);display:flex;align-items:center;justify-content:center}
  .chain li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:24px;bottom:-2px;width:1px;background:var(--sage-soft)}
  .themetag{display:inline-block;background:var(--yellow);color:#6b5a1f;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:14px 0 8px}
  /* Practice bank */
  .prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .prompt .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px}
  .pill.new{background:var(--orange);color:#fff}
  .pill.file{background:var(--sage);color:#fff}
  .pill.common{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
  .pill.type{background:#efe7db;color:#8a6a3a}
  .prompt p{margin:0;font-size:14.5px}
  .prompt .date{font-size:11.5px;color:var(--muted);margin-left:auto}
  /* Checklist */
  .crit{margin-bottom:16px}
  .crit h4{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .crit h4 .k{background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-family:monospace}
  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .check input{margin-top:5px;width:16px;height:16px;accent-color:var(--sage);flex-shrink:0;cursor:pointer}
  .check label{cursor:pointer}
  /* Band table */
  .bandwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .bandsrc{font-size:11.6px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:var(--paper)}
  .bandgroup{margin-bottom:20px}
  .bghead{font-family:Georgia,serif;font-weight:700;font-size:15px;padding:9px 15px;border-radius:10px 10px 0 0;color:#fff}
  .bandgroup.bg-hi .bghead{background:#4f7a41}
  .bandgroup.bg-mid .bghead{background:#a5842f}
  .bandgroup.bg-lo .bghead{background:#b25a2e}
  .bandgroup .bandwrap{border-radius:0 0 12px 12px}
  .refcard ol{margin:8px 0 0;padding-left:20px}
  .refcard li{font-size:13.4px;margin-bottom:8px}
  .refcard .tag2{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);
    padding:2px 8px;border-radius:12px;margin-right:6px;letter-spacing:.4px}
  table.band{border-collapse:collapse;width:100%;min-width:760px;font-size:12.8px}
  table.band th,table.band td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
  table.band thead th{background:var(--ink);color:#fff;font-family:'Segoe UI',sans-serif;font-size:12.5px;position:sticky;top:0}
  table.band td.bn{font-weight:800;font-size:16px;text-align:center;font-family:Georgia,serif;width:46px}
  /* colour-coded by BAND: every criterion in one band shares the same tone (green→red) */
  table.band tr[data-b="9"] td{background:#dcebd4}
  table.band tr[data-b="8"] td{background:#e8f1de}
  table.band tr[data-b="7"] td{background:#f3f0d2}
  table.band tr[data-b="6"] td{background:#faedcc}
  table.band tr[data-b="5"] td{background:#f7e1d0}
  table.band tr[data-b="4"] td{background:#f3d7c7}
  table.band tr[data-b="9"] td.bn{background:#bcd9ae;color:#2f5626}
  table.band tr[data-b="8"] td.bn{background:#cfe3bf;color:#3a5f2b}
  table.band tr[data-b="7"] td.bn{background:#e7dfa6;color:#6f5f16}
  table.band tr[data-b="6"] td.bn{background:#f2dda6;color:#8a6716}
  table.band tr[data-b="5"] td.bn{background:#efc7ac;color:#9e5228}
  table.band tr[data-b="4"] td.bn{background:#e9b79c;color:#a8481f}
  table.band td b{color:#141414;font-weight:800}
  /* Sample essay */
  .essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 26px;font-size:14.5px}
  .essay h3{text-align:center;margin-bottom:16px;font-size:22px}
  .essay p{margin:0 0 13px;position:relative}
  .essay .num{position:absolute;left:-26px;color:var(--sage);font-weight:700;font-family:Georgia,serif}
  mark.hook{background:#f6ddc9;padding:1px 2px}
  mark.thesis{background:#d9e6d3;padding:1px 2px}
  mark.topic{background:#eee2c2;padding:1px 2px}
  mark.counter{background:#e3d4ea;padding:1px 2px}
  mark.refute{background:#cfe3e8;padding:1px 2px}
  mark.restate{background:#d9e6d3;padding:1px 2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
  /* Structure diagram */
  .flow{display:flex;flex-direction:column;gap:2px;max-width:640px;margin:8px 0}
  .flow div{color:var(--ink);padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px}
  .flow .f1{background:var(--orange);color:#fff;margin-right:0}
  .flow .f2{background:var(--orange-soft);margin-left:26px}
  .flow .f3{background:var(--yellow);margin-left:52px}
  .flow .f4{background:var(--sage-soft);margin-left:78px}
  .flow .f5{background:var(--ink);color:#fff;margin-left:104px}
  .flow small{display:block;font-weight:400;font-size:12px;opacity:.9}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.topichero h2{font-size:22px}}
  .typebox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .typebox h4{font-size:14.5px;color:var(--orange);margin-bottom:3px}
  .typebox .ex{font-size:12.8px;color:var(--muted);font-style:italic;margin-top:6px}
  .note{background:#fff7e8;border:1px solid var(--yellow);border-radius:10px;padding:12px 15px;font-size:13px;margin-bottom:16px}
  .qanalyze{background:#ecf3e9;border:1px solid var(--sage-soft);border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.4px}
  .qanalyze .row{display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;border-bottom:1px dashed #cdd8c5}
  .qanalyze .row:last-child{border-bottom:0}
  .qanalyze .lbl{font-weight:700;color:#4f6446;min-width:150px;flex-shrink:0}
  .qanalyze mark{background:#f6ddc9;padding:0 3px;border-radius:3px}
  .qanalyze mark.t{background:#e3d4ea}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .resetbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);margin-bottom:10px}
  .linkbtn{border:0;background:var(--sage);color:#fff;font:inherit;font-weight:700;font-size:12.5px;
    padding:3px 10px;border-radius:7px;cursor:pointer}
  .linkbtn:hover{background:#87997f}

  /* ===== Extension: Reading Lab / Clinic / Bank / Roadmap ===== */
  .rcard,details.gp,.bgroup,#guided,.card{scroll-margin-top:120px}
  .rsrc{margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  .rsrc-h{font-family:var(--font-head);font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rsrc-s{font-size:12.5px;color:var(--muted);font-style:italic}
  .rcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;transition:box-shadow .3s}
  .rcard.flash{box-shadow:0 0 0 3px var(--orange-soft)}
  .rhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .rref{font-family:monospace;font-weight:700;font-size:12px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:6px}
  .rpara{font-size:12px;color:var(--muted);font-weight:600}
  .rquote{margin:6px 0 10px;padding:10px 14px;border-left:4px solid var(--sage);background:#f7f5ee;border-radius:0 8px 8px 0;
    font-family:Georgia,'Times New Roman',serif;font-size:15.2px;line-height:1.7}
  .rquote mark{background:#f6ddc9;padding:0 2px;border-radius:3px}
  .rphr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{font-size:12px;background:#ecf3e9;border:1px solid var(--sage-soft);color:#4f6446;padding:3px 9px;border-radius:14px;cursor:pointer;font-weight:600}
  .chip:hover{background:var(--sage-soft)}
  .rqs{margin:0;padding-left:0;list-style:none}
  .rq{padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
  .rk{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:4px;background:var(--cream);color:var(--muted)}
  .rq-y .rk{background:#fbe9dc;color:#a4501f}
  .rq-cum .rk{background:#e3eedf;color:#4f6446}
  .xta{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;
    background:#fffdf8;resize:vertical;color:var(--ink)}
  .xta:focus{outline:2px solid var(--sage-soft);border-color:var(--sage)}
  details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--orange);margin-top:6px;user-select:none}
  .ans{background:#ecf3e9;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.8px}
  .errnote{background:#fff1ec;border:1px solid #f1c7b0;border-radius:8px;padding:7px 12px;margin-top:6px;font-size:13px}
  .rule{background:#f7f5ee;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.2px}
  .code{font-family:monospace;font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .cgroup{margin-top:26px}
  .cgroup h4{font-size:18px;margin-bottom:4px}
  .citem{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 15px;margin:10px 0}
  .citem.ok{border-left-color:var(--sage)}
  .citem.bad{border-left-color:var(--orange)}
  .cq{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:14.2px}
  .ctype{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-top:2px}
  .wrong{color:#a4501f;text-decoration:line-through;text-decoration-color:rgba(164,80,31,.35);flex:1 1 300px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  @media(max-width:720px){.opts{grid-template-columns:1fr}}
  .opt{text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .opt:hover:not([disabled]){border-color:var(--sage)}

    {k:"hieu", q:"Khoá học chuyển từ lý thuyết sang thực hành như thế nào qua 3 học kỳ?", a:"Kỳ 1: lý thuyết → Kỳ 2: vừa học vừa bắt đầu dạy thật → Kỳ 3: hoàn toàn thực hành."},
    {k:"y", q:"Đây là một VÍ DỤ CỤ THỂ rất tốt. Hãy dùng nó để chứng minh cho luận điểm nào trong đề <i>“Universities should provide graduates with the knowledge and skills needed in the workplace”</i>?", a:"Luận điểm: kết hợp lý thuyết + thực hành tạo ra người lao động sẵn sàng làm việc. Ví dụ minh hoạ: chương trình đào tạo giáo viên đi từ lý thuyết đến dạy thực tế tại trường."},
    {k:"cum", q:"Viết câu ví dụ (For instance, …) mô tả một chương trình kết hợp lý thuyết và thực hành.", a:"<b>For instance</b>, many teacher-training programmes begin with <b>the theory of teaching</b> but require trainees to <b>begin teaching in a school</b> within a few months, so that the final stage of the course is <b>completely practical</b>.", err:"Lỗi hay gặp: ví dụ chung chung “For example, many students learn theory and practice.” → phải có <b>ai – làm gì – kết quả gì</b>."}
   ]},
  {ref:"MU-5", para:"Notice",
   quote:"<mark>Apprenticeship opportunities</mark> now available <mark>with local businesses</mark> including carpenters, electricians and plumbers.",
   phrases:["apprenticeship opportunities","with local businesses","carpenters, electricians and plumbers"],
   qs:[
    {k:"y", q:"Đề trong tài liệu: <i>“…more people should be encouraged to do vocational training because there is a lack of qualified workers such as electricians and plumbers.”</i> Đoạn trích gợi ý GIẢI PHÁP nào cho sự thiếu hụt thợ lành nghề?", a:"Liên kết trường học với doanh nghiệp địa phương để tạo chỗ học việc (apprenticeships) → người học vừa học vừa làm, ra trường là có việc."},
    {k:"cum", q:"Viết 1 câu giải pháp dùng <b>apprenticeship opportunities with local businesses</b>.", a:"Colleges should work more closely with employers to create <b>apprenticeship opportunities with local businesses</b>, allowing trainees to gain real-world experience while they study.", err:"✗ do an <u>apprentice</u> → <b>do an apprenticeship</b> (apprentice = người học việc; apprenticeship = chương trình học việc)."}
   ]}
 ]},
 {id:"art", title:"Reading 2 · Distance or face-to-face learning — what’s the difference?", sub:"Article · paragraphs A–E", cards:[
  {ref:"A-1", para:"A · History",
   quote:"<mark>Although many people think it is a modern phenomenon</mark>, distance learning <mark>has been around for</mark> at least 200 years <mark>in one form or another</mark>.",
   phrases:["a modern phenomenon","has been around for …","in one form or another","Although + clause, main clause"],
   qs:[
    {k:"hieu", q:"Tác giả bác bỏ quan niệm phổ biến nào?", a:"Quan niệm cho rằng học từ xa là hiện tượng mới. Thực ra nó đã tồn tại ít nhất 200 năm (ví dụ: gửi bài học hàng tuần qua bưu điện)."},
    {k:"y", q:"Đề <i>“Some people believe online learning will replace classrooms”</i>: bạn dùng ý này để mở bài (background) như thế nào?", a:"Mở bài: học từ xa không mới, nhưng công nghệ gần đây làm nó trở nên phổ biến chưa từng có → vì vậy câu hỏi về việc nó có thay thế lớp học hay không trở nên cấp thiết."},
    {k:"cum", q:"Viết câu mở bài với <b>Although … , …</b> (KHÔNG dùng <i>but</i>) + <b>has been around</b>.", a:"<b>Although</b> online education is often regarded as <b>a modern phenomenon</b>, learning at a distance <b>has been around for</b> centuries <b>in one form or another</b>.", err:"✗ <u>Although</u> …, <u>but</u> … → tiếng Việt “Mặc dù… nhưng…”, tiếng Anh chỉ dùng MỘT liên từ."}
   ]},
  {ref:"A-2", para:"A · History",
   quote:"<mark>The technological advances of the past 20 or so years</mark>, however, <mark>have meant that</mark> this form of education is now able to <mark>rival face-to-face learning as a credible alternative</mark>.",
   phrases:["technological advances","have meant that …","rival X as a credible alternative","…, however, …"],
   qs:[
    {k:"hieu", q:"Chủ ngữ của động từ <i>have meant</i> là gì? Vì sao động từ chia số nhiều?", a:"Chủ ngữ là <b>The technological advances</b> (số nhiều) → <b>have</b> meant. Cụm “of the past 20 or so years” chỉ bổ nghĩa, không quyết định chia động từ."},
    {k:"y", q:"Đề <i>“More and more universities are replacing face-to-face teaching with online courses. Positive or negative?”</i>: câu này ủng hộ phía nào? Viết lại thành TOPIC SENTENCE.", a:"Ủng hộ phía tích cực. Topic sentence: <i>The most obvious benefit of this shift is that online courses can now <b>rival face-to-face learning as a credible alternative</b>, thanks to recent <b>technological advances</b>.</i>"},
    {k:"cum", q:"Viết 1 câu cho đề về thư viện/Internet dùng <b>… have meant that …</b>.", a:"Recent <b>technological advances have meant that</b> students can access millions of academic articles from home, which has reduced their reliance on physical libraries.", err:"✗ The advances of technology <u>has</u> meant… → động từ hoà hợp với danh từ chính (advances)."}
   ]},
  {ref:"A-3", para:"A · History",
   quote:"Indeed, <mark>1996 saw the establishment of</mark> the world’s first ‘virtual university’ in the United States, <mark>showing how far distance learning has come</mark> in <mark>a relatively short space of time</mark>.",
   phrases:["[time] saw the establishment of …","showing how far … has come","in a relatively short space of time"],
   qs:[
    {k:"hieu", q:"Cụm <i>showing how far…</i> bổ nghĩa cho cả mệnh đề trước. Đây là loại cấu trúc gì?", a:"Mệnh đề phân từ (participle clause) rút gọn = <i>which shows how far…</i>. Dùng để nêu Ý NGHĨA/HỆ QUẢ của một sự kiện."},
    {k:"cum", q:"Dùng cấu trúc <b>[thời gian] + saw + noun</b> để viết 1 câu ví dụ về giáo dục trực tuyến.", a:"The school closures of 2020 <b>saw</b> millions of pupils move to online classes almost overnight, <b>showing how far</b> digital learning <b>has come in a relatively short space of time</b>.", err:"Tránh: “In 2020 year, have many students study online.” → lỗi <b>there have</b> + thiếu chủ ngữ + thừa “year”."}
   ]},
  {ref:"B-1", para:"B · Knowledge transfer",
   quote:"Distance learning is <mark>heavily dependent on technology</mark>, particularly the internet. […] In comparison, when learning remotely, technology is <mark>the principal means of communication</mark>.",
   phrases:["heavily dependent on","the principal means of communication","In comparison, …","learn remotely"],
   qs:[
    {k:"y", q:"Đề <i>“Schools are no longer necessary because children can study just as well at home using the internet”</i>: câu này giúp bạn phản bác thế nào?", a:"Học tại nhà phụ thuộc nặng vào công nghệ → trẻ em ở gia đình thiếu thiết bị/Internet ổn định sẽ bị bỏ lại phía sau (digital divide). → Trường học vẫn cần thiết để đảm bảo công bằng."},
    {k:"cum", q:"Viết câu phản bác dùng <b>heavily dependent on</b>.", a:"Learning at home is <b>heavily dependent on</b> a reliable internet connection, which many low-income families simply cannot afford.", err:"✗ dependent <u>in/to</u> → <b>dependent on</b>; ✗ <u>depend</u> heavily <u>to</u> → <b>depend heavily on</b>."}
   ]},
  {ref:"B-2", para:"B · Knowledge transfer",
   quote:"<mark>The flexibility this provides means that</mark> students may be better able to <mark>learn at their own pace</mark>, <mark>following their own timetable</mark>, but it may also mean that learners have to be <mark>well-organized and self-disciplined</mark>. They must therefore be <mark>highly motivated</mark> in order to do well on the distance-learning courses.",
   phrases:["the flexibility this provides means that …","learn at their own pace","follow their own timetable","well-organized and self-disciplined","highly motivated"],
   qs:[
    {k:"hieu", q:"Đoạn trích nêu 1 ưu điểm và 1 điều kiện đi kèm. Đó là gì?", a:"Ưu điểm: linh hoạt, học theo tốc độ và lịch riêng. Điều kiện: người học phải có tổ chức, tự giác và có động lực cao."},
    {k:"y", q:"Đây là mẫu <b>chuỗi lập luận 3 mắt xích</b> (lợi ích → mặt trái → hệ quả). Áp dụng cho đề <i>“online courses replacing face-to-face teaching”</i>: ý này thuộc đoạn tích cực hay tiêu cực?", a:"Có thể dùng cho CẢ HAI: đoạn tích cực (linh hoạt cho người đi làm) và đoạn tiêu cực (sinh viên thiếu tự giác dễ bỏ học). → Chính vì vậy mà câu này rất “đáng giá” khi viết dạng Advantages/Disadvantages."},
    {k:"cum", q:"Viết 2 câu liên kết: câu 1 nêu lợi ích (dùng <b>learn at their own pace</b>), câu 2 bắt đầu bằng <b>This flexibility, however, …</b>", a:"Online courses allow working adults to <b>learn at their own pace</b>, <b>following their own timetable</b>. <b>This flexibility, however,</b> requires learners to be <b>highly motivated</b> and <b>self-disciplined</b>, as there is no teacher to check their progress every day.", err:"✗ students can learn <u>by</u> their own pace / <u>with</u> their own speed → <b>at their own pace</b>."}
   ]},
  {ref:"C-1", para:"C · Instructor–pupil interaction",
   quote:"<mark>In terms of</mark> the teacher–student relationship, <mark>the core principles remain the same</mark>. Namely, the teacher is the ‘knower’, and <mark>is responsible for helping students understand</mark> the <mark>key components</mark> of the course.",
   phrases:["In terms of …","the core principles remain the same","be responsible for helping sb (to) do","key components"],
   qs:[
    {k:"y", q:"Đề <i>“The typical teaching situation between students and teachers in the classroom will be gone by 2050”</i>: câu này giúp bạn phản bác ra sao?", a:"Dù công nghệ thay đổi cách truyền tải, vai trò cốt lõi của giáo viên (giúp học sinh hiểu các phần quan trọng) vẫn không đổi → lớp học có thể thay đổi hình thức nhưng không biến mất."},
    {k:"cum", q:"Viết 1 câu với <b>be responsible for + V-ing</b> và <b>help + O + V(bare)</b>.", a:"Even in a digital classroom, teachers <b>are</b> still <b>responsible for helping</b> learners <b>understand</b> the <b>key components</b> of each subject.", err:"✗ responsible <u>to help</u> / help students <u>understanding</u> → <b>responsible for helping</b>, <b>help students (to) understand</b>."}
   ]},
  {ref:"C-2", para:"C · Instructor–pupil interaction",
   quote:"With face-to-face learning, the teacher and student <mark>have the opportunity to develop a personal relationship</mark> through lectures, seminars and tutorials. <mark>This is different from</mark> a distance-learning course, <mark>where</mark> the teacher may seldom or indeed never actually meet the student. <mark>This may make it hard for teachers to understand</mark> their learners’ <mark>specific learning needs</mark>.",
   phrases:["have the opportunity to develop a personal relationship","This is different from …","…, where …","make it hard for sb to do sth","specific learning needs"],
   qs:[
    {k:"hieu", q:"Tác giả dùng <b>This</b> hai lần. Mỗi lần <b>This</b> thay cho điều gì?", a:"This (1) = việc thầy trò xây dựng mối quan hệ cá nhân qua bài giảng, seminar, tutorial. This (2) = việc giáo viên hiếm khi/không bao giờ gặp học viên. → Đây là kỹ thuật <b>tham chiếu</b> giúp mạch văn liền (Coherence)."},
    {k:"y", q:"Đề <i>“Once children start school, teachers have more influence on their intellectual and social development”</i>: rút ra luận điểm gì?", a:"Tiếp xúc trực tiếp hằng ngày giúp giáo viên hiểu nhu cầu riêng của từng học sinh → có ảnh hưởng lớn đến sự phát triển trí tuệ và xã hội của trẻ."},
    {k:"cum", q:"Sửa câu: <i>“Online learning makes teachers difficult to understand students’ needs.”</i> rồi viết 1 câu mới với <b>make it hard for … to …</b>", a:"Online learning <b>makes it difficult for teachers to understand</b> students’ needs. — Large classes <b>make it hard for teachers to</b> identify each pupil’s <b>specific learning needs</b>.", err:"✗ make <u>teachers difficult</u> to… (dịch “khiến giáo viên khó…”) → <b>make it difficult for teachers to…</b>"}
   ]},
  {ref:"D-1", para:"D · Peer-to-peer contact",
   quote:"For many students, <mark>interaction with their peers</mark> is <mark>one of the best aspects of</mark> university education. Generally, students like to meet regularly and talk to people on the same course.",
   phrases:["interaction with their peers","one of the best aspects of …"],
   qs:[
    {k:"y", q:"Đề <i>“Full-time university students should also be involved in other activities”</i>: ý này ủng hộ lập luận nào?", a:"Tương tác với bạn bè là một phần giá trị của đại học → hoạt động ngoại khoá, câu lạc bộ giúp phát triển kỹ năng xã hội, không chỉ học kiến thức."},
    {k:"cum", q:"Viết 1 câu với <b>one of the + adj-est + plural noun</b>.", a:"<b>One of the most valuable aspects of</b> university life is the chance to <b>interact with peers</b> from different backgrounds.", err:"✗ one of the best <u>aspect</u> → <b>one of the best aspects</b> (danh từ số nhiều); động từ chia theo <b>one</b> → <b>is</b>."}
   ]},
  {ref:"D-2", para:"D · Peer-to-peer contact",
   quote:"<mark>Although people can increasingly interact through</mark> online conversations and messageboards, <mark>there is a significant difference between</mark> virtual and real interaction.",
   phrases:["increasingly + V","there is a significant difference between X and Y","virtual and real interaction"],
   qs:[
    {k:"y", q:"Đề <i>“It is more effective for students to study in a group / alone”</i>: dùng ý này cho phía nào?", a:"Phía học nhóm TRỰC TIẾP: tương tác thật (thảo luận, phản hồi tức thì, ngôn ngữ cơ thể) khác xa tương tác ảo → hiệu quả hơn."},
    {k:"cum", q:"Viết 1 câu nhượng bộ – phản bác với <b>Although … increasingly …, there is a significant difference between …</b>", a:"<b>Although</b> students <b>can increasingly</b> collaborate through video calls, <b>there is a significant difference between</b> discussing an idea on screen and debating it face to face.", err:"✗ There is a significant difference <u>among</u> X and Y → với 2 đối tượng dùng <b>between … and …</b>."}
   ]},
  {ref:"D-3", para:"D · Time & geography",
   quote:"Face-to-face learning <mark>must take place in real-time and in one location</mark>. <mark>Conversely</mark>, distance learning can happen at any time and in any location, since the learning is <mark>not restricted by geography</mark>.",
   phrases:["take place","Conversely, …","not restricted by geography"],
   qs:[
    {k:"y", q:"Đề <i>“Many young people are leaving rural areas to study in cities…”</i> hoặc <i>“adults who cannot read or write”</i>: ý nào dùng được như GIẢI PHÁP?", a:"Học từ xa không bị giới hạn địa lý → người ở vùng nông thôn/người lớn đi làm vẫn có thể học mà không phải rời quê hay nghỉ việc."},
    {k:"cum", q:"Viết 2 câu đối lập bằng <b>Conversely,</b> + dùng <b>take place</b> đúng (KHÔNG bị động).", a:"Traditional literacy classes <b>take place</b> at fixed times in a community centre. <b>Conversely</b>, mobile-based courses allow adult learners to study whenever they finish work, as they are <b>not restricted by geography</b>.", err:"✗ The class <u>was taken place</u> online → <b>took place</b> (take place là nội động từ, không có bị động)."}
   ]},
  {ref:"E", para:"E · Conclusion",
   quote:"In conclusion, <mark>it is difficult to state whether</mark> one form of learning is better than another, as they <mark>cater for different audiences</mark>. <mark>What is important to understand is</mark> the different <mark>ways in which</mark> they operate, and that there are strong similarities between the two systems, which can both <mark>produce positive results</mark>.",
   phrases:["cater for different audiences","What is important to understand is …","the ways in which …","produce positive results"],
   qs:[
    {k:"hieu", q:"Kết luận này CÓ nêu rõ quan điểm không? Vì sao kiểu kết luận này ổn với một bài báo nhưng NGUY HIỂM trong IELTS Task 2 dạng Opinion?", a:"Không — tác giả “đứng giữa” (it is difficult to state whether…). Trong IELTS dạng Opinion/Discussion + opinion, thiếu quan điểm rõ ràng → Task Response bị giới hạn ở band 5–6 (“position unclear”)."},
    {k:"cum", q:"Viết lại kết luận cho đề <i>“universities replacing face-to-face teaching with online courses: positive or negative?”</i> — giữ cụm <b>cater for different audiences</b> nhưng PHẢI có quan điểm rõ.", a:"In conclusion, although online and face-to-face courses <b>cater for different audiences</b>, I believe the complete replacement of classroom teaching is a largely negative development, because <b>what is important</b> in higher education is not only knowledge transfer but also the <b>personal relationships</b> it builds.", err:"Lỗi tổ chức ý hay gặp: kết luận “Both have pros and cons, it depends on each person.” → không trả lời câu hỏi."}
   ]}
 ]},
 {id:"intro", title:"Model · Writing an introduction (ex. 3, intro 4)", sub:"A model introduction from the material", cards:[
  {ref:"INT-4", para:"Model intro",
   quote:"<mark>On the face of it</mark>, vocational education and academic study <mark>have little in common</mark>. Academic study <mark>promotes the discussion of ideas</mark> while vocational education <mark>provides a useful way into a career</mark>. However this essay will describe how both educational sectors have a number of similarities as well as their obvious differences. <mark>I will conclude by suggesting that</mark> a mixture of practice and theory often produces the best courses for students.",
   phrases:["On the face of it, …","have little in common","promote the discussion of ideas","provide a useful way into a career","I will conclude by suggesting that …"],
   qs:[
    {k:"hieu", q:"Chỉ ra 3 phần của mở bài này: (1) background, (2) mục đích/hướng bài, (3) quan điểm/kết luận dự kiến.", a:"(1) On the face of it… + Academic study promotes… (2) However this essay will describe… (3) I will conclude by suggesting that a mixture of practice and theory…"},
    {k:"y", q:"Mở bài này hợp với dạng <b>Discussion</b> hơn hay <b>Opinion (agree/disagree)</b>? Cần sửa gì nếu dùng cho đề <i>“Nations should spend more on vocational training rather than university education. To what extent do you agree?”</i>", a:"Hợp với Discussion/compare. Với đề Opinion cần thêm câu trả lời trực tiếp: <i>“I partly agree: while vocational training deserves more funding, universities should not lose financial support.”</i>"},
    {k:"cum", q:"Viết mở bài 2–3 câu cho đề <i>“Nations should spend more money on vocational training rather than on university education”</i> dùng <b>provide a useful way into a career</b> và <b>promote the discussion of ideas</b>.", a:"Vocational training <b>provides a useful way into a career</b>, whereas university education <b>promotes the discussion of ideas</b> and theoretical knowledge. Although I agree that practical skills deserve greater investment, I do not believe this should come at the expense of higher education.", err:"Tránh chép nguyên đề + “This essay will discuss…” mà KHÔNG nêu quan điểm."}
   ]}
 ]}
 ]
}

const CLINIC = {
t1:{
 intro:{
  vi:"Mỗi nhóm lỗi gồm các câu <b>lấy từ lỗi thật của học sinh Việt Nam</b> khi viết chủ đề Education. Với câu <b>✍️ Sửa câu</b>: tự viết lại vào ô → mở đáp án → bấm <b>“Mình đúng”</b> hoặc <b>“Mình sai”</b>. Mọi lỗi bạn bấm sai sẽ tự động vào <b>Error Log</b> bên dưới — đó là danh sách lỗi <b>của riêng bạn</b> cần xử lý dứt điểm trước khi viết cả bài.",
  en:"Each error group uses <b>sentences based on real Vietnamese learners’ errors</b> on Education essays. For <b>✍️ Fix</b> items: rewrite in the box → open the answer → click <b>“I got it”</b> or <b>“I missed it”</b>. Every miss goes into the <b>Error Log</b> below — <b>your personal</b> list of errors to eliminate before writing a full essay."},
 groups:[
 {id:"gra", icon:"🧩", title:{vi:"A · Lỗi ngữ pháp câu (GRA)",en:"A · Sentence grammar (GRA)"},
  lead:{vi:"12 lỗi làm tụt band GRA nhiều nhất ở chủ đề giáo dục. Mục tiêu: 0 lỗi trong bài viết tiếp theo.",en:"The 12 errors that cost the most GRA marks on education essays. Target: zero in your next essay."},
  items:[
  {t:"fix", c:"G-CU", w:"Students can learn many knowledges and informations from the internet.", a:"Students can <b>gain a great deal of knowledge and information</b> from the internet.", r:"<b>knowledge, information, advice, research, homework, equipment</b> là danh từ không đếm được → không thêm -s, không dùng <i>many</i>; dùng <i>much / a great deal of / a wide range of</i>."},
  {t:"fix", c:"G-SVA", w:"Education play an important role in the development of every countries.", a:"Education <b>plays</b> an important role in the development of <b>every country</b>.", r:"<i>Education</i> (không đếm được) → động từ số ít. <i>every / each</i> + danh từ <b>số ít</b>."},
  {t:"fix", c:"G-SVA", w:"The number of students who study abroad are increasing rapidly.", a:"The number of students who study abroad <b>is</b> increasing rapidly.", r:"<b>The number of</b> + N(số nhiều) + V <b>số ít</b>. (So sánh: <b>A number of</b> students <b>are</b>…)"},
  {t:"fix", c:"G-ART", w:"The education is the key to the success. Government should invest in the education of the children in rural areas.", a:"<b>Education</b> is the key to <b>success</b>. <b>The government / Governments</b> should invest in the education of <b>children</b> in rural areas.", r:"Danh từ trừu tượng nói chung (education, success) → <b>không dùng the</b>. <i>Government</i> là danh từ đếm được số ít → cần <b>the</b> hoặc chuyển số nhiều. <i>children in rural areas</i> nói chung → Ø."},
  {t:"fix", c:"G-THERE", w:"There have many students who cannot afford tuition fees.", a:"<b>There are</b> many students who cannot afford tuition fees. / <b>Many students</b> cannot afford tuition fees.", r:"“Có” (tồn tại) = <b>There is / There are</b>, không bao giờ là <i>there have</i>. Cách gọn hơn: đưa danh từ lên làm chủ ngữ."},
  {t:"fix", c:"G-CONJ", w:"Although online courses are flexible, but they require a high level of motivation.", a:"<b>Although</b> online courses are flexible, they require a high level of motivation. / Online courses are flexible, <b>but</b> they require…", r:"Chỉ dùng MỘT liên từ: <i>Although… ,</i> HOẶC <i>…, but …</i>. Tương tự: ✗ <i>Because… so…</i>"},
  {t:"fix", c:"G-CONJ", w:"Because university fees are too high. Many students cannot afford them.", a:"<b>Because university fees are too high, many students</b> cannot afford them.", r:"Mệnh đề <i>Because…</i> đứng một mình là <b>câu cụt (fragment)</b> → phải nối với mệnh đề chính bằng dấu phẩy."},
  {t:"fix", c:"G-RUN", w:"Vocational training is practical, it helps students find jobs quickly.", a:"Vocational training is practical, <b>so</b> it helps students find jobs quickly. / Vocational training is practical<b>;</b> <b>therefore,</b> it… / Vocational training is practical, <b>which</b> helps…", r:"Hai mệnh đề độc lập KHÔNG nối bằng dấu phẩy (comma splice). Dùng liên từ (so, and, as), dấu chấm phẩy + trạng từ nối, hoặc mệnh đề quan hệ."},
  {t:"fix", c:"G-RUN", w:"Many students drop out of university, this is a waste of money and time.", a:"Many students drop out of university, <b>which</b> is a waste of both money and time.", r:"Dùng <b>, which</b> để chỉ cả mệnh đề phía trước — vừa sửa comma splice vừa tăng điểm câu phức."},
  {t:"fix", c:"G-STR", w:"Online learning makes teachers difficult to understand students’ needs.", a:"Online learning <b>makes it difficult for teachers to understand</b> students’ needs.", r:"Cấu trúc chuẩn: <b>make it + adj + for sb + to V</b> (xem bài đọc C-2: “This may make it hard for teachers to understand…”)."},
  {t:"fix", c:"G-VF", w:"Teachers are responsible to help students understanding the key components of the course.", a:"Teachers are <b>responsible for helping</b> students <b>(to) understand</b> the key components of the course.", r:"<b>be responsible for + V-ing</b>; <b>help + O + (to) V</b>. Nguyên văn bài đọc C-1."},
  {t:"fix", c:"G-VF", w:"More young people should be encourage to do vocational training instead of go to university.", a:"More young people should be <b>encouraged</b> to do vocational training instead of <b>going</b> to university.", r:"Bị động: <b>be + V3</b>. Sau giới từ (instead of, by, without, before) → <b>V-ing</b>."},
  {t:"fix", c:"G-VF", w:"Governments should to provide free education, it can helping poor students.", a:"Governments <b>should provide</b> free education, <b>as this can help</b> poor students.", r:"Modal (should, can, must) + <b>V nguyên mẫu</b>, không có <i>to</i>, không V-ing. Đồng thời sửa comma splice."},
  {t:"fix", c:"G-PAR", w:"Distance learning allows students to study at their own pace, following their own timetable and they can save travel costs.", a:"Distance learning allows students to <b>study</b> at their own pace, <b>follow</b> their own timetable and <b>save</b> travel costs.", r:"Liệt kê phải <b>cùng dạng</b> (to study – follow – save). Lỗi song song làm câu dài trở nên rối."},
  {t:"fix", c:"G-TNS", w:"In recent years, the number of online courses increases dramatically.", a:"In recent years, the number of online courses <b>has increased</b> dramatically.", r:"<i>In recent years / over the past decade / since…</i> → <b>hiện tại hoàn thành</b>."},
  {t:"fix", c:"G-VF", w:"The lesson was taken place online because of the pandemic.", a:"The lesson <b>took place</b> online because of the pandemic.", r:"<b>take place, happen, occur</b> là nội động từ → không có dạng bị động."},
  {t:"mcq", c:"G-SVA", q:"One of the best ___ of university education ___ interaction with peers.", o:["aspect / are","aspects / is","aspects / are","aspect / is"], k:1, r:"<b>one of the + N số nhiều</b> + V chia theo <i>one</i> (số ít). Nguyên văn bài đọc D-1."},
  {t:"mcq", c:"G-CU", q:"Chọn câu ĐÚNG:", o:["Students need more practical equipments and researches.","Students need more practical equipment and research.","Students need many practical equipment and research.","Students need a practical equipment and a research."], k:1, r:"<i>equipment, research</i> không đếm được → không -s, không <i>many</i>, không <i>a</i>."}
 ]},
 {id:"lex", icon:"🎯", title:{vi:"B · Lỗi chọn từ (LR)",en:"B · Word choice (LR)"},
  lead:{vi:"Collocation, từ loại, giới từ và văn phong — những lỗi khiến giám khảo đánh giá “inaccuracy in less common words”.",en:"Collocation, word form, prepositions and register — the errors examiners mark as ‘inaccuracy in less common words’."},
  items:[
  {t:"mcq", c:"W-COL", q:"University helps young people ___ knowledge in their chosen field.", o:["learn","study","acquire","take"], k:2, r:"<b>acquire / gain / broaden / deepen knowledge</b>. ✗ learn knowledge, ✗ study knowledge (dịch từ “học kiến thức”)."},
  {t:"mcq", c:"W-COL", q:"Many students cannot afford university because tuition fees are too ___.", o:["expensive","high","costly","dear"], k:1, r:"<b>fees / prices / costs are high</b>. <i>Expensive</i> dùng cho sản phẩm/dịch vụ: <i>an expensive course</i>."},
  {t:"mcq", c:"W-PREP", q:"Only a small percentage of young people ___ in my country.", o:["attend to university","graduate university","attend university","go to the university"], k:2, r:"<b>attend university / go to university</b> (không the khi nói về việc học); <b>graduate from</b> university."},
  {t:"mcq", c:"W-FORM", q:"Many rural students ___ access to good teachers.", o:["are lack of","lack of","lack","are lacking of"], k:2, r:"<b>lack + N</b> (động từ) hoặc <b>a lack of + N</b> (danh từ) hoặc <b>be lacking in</b>. ✗ <i>be lack of</i> là lỗi kinh điển của người Việt."},
  {t:"mcq", c:"W-COL", q:"There is a shortage of ___ workers such as electricians and plumbers.", o:["quality","qualified","qualify","qualification"], k:1, r:"<b>qualified / skilled workers</b> (lấy từ đề trong tài liệu). <i>quality</i> là danh từ; <i>high-quality education</i> mới đúng."},
  {t:"mcq", c:"W-FORM", q:"Online courses are often more ___ than campus-based programmes.", o:["economic","economical","economy","economics"], k:1, r:"<b>economical</b> = tiết kiệm, rẻ; <b>economic</b> = thuộc về kinh tế (economic growth)."},
  {t:"mcq", c:"W-PREP", q:"Excessive screen time can ___ children’s ability to concentrate.", o:["affect to","effect","affect","have an affect on"], k:2, r:"<b>affect + O</b> (không giới từ) = <b>have an effect on</b>. ✗ affect to / effect on (động từ)."},
  {t:"mcq", c:"W-PREP", q:"This essay will ___ both views before giving my opinion.", o:["discuss about","discuss","mention about","emphasise on"], k:1, r:"<b>discuss / mention / emphasise + O</b> trực tiếp (không <i>about/on</i>). Nhưng: <i>a discussion about</i>, <i>place emphasis on</i>."},
  {t:"mcq", c:"W-FORM", q:"Graduates with practical skills are more likely to be ___ in their careers.", o:["success","succeed","successful","successfully"], k:2, r:"Sau <b>be</b> cần tính từ: <b>successful</b>. Họ từ: success (n) – succeed (v) – successful (adj) – successfully (adv)."},
  {t:"mcq", c:"W-COL", q:"A university degree no longer guarantees a ___ job.", o:["high salary","well-paid","salary-high","highly salary"], k:1, r:"“Công việc lương cao” = <b>a well-paid / highly paid job</b>. ✗ <i>a high salary job</i> (dịch từng chữ). Nhưng: <i>a job with a high salary</i> ✓."},
  {t:"mcq", c:"W-COL", q:"Schools should not ___ students to learn a foreign language if they lack natural ability.", o:["force","make","let","push for"], k:0, r:"<b>force sb to V</b>; <b>make sb V</b> (không to). Đề thật 20/03/2026: “schools should not force them to learn new languages”."},
  {t:"fix", c:"W-REG", w:"Kids nowadays get lots of stuff from the internet, so they don’t really need teachers anymore.", a:"<b>Children today obtain a great deal of information online</b>; however, this does not mean that teachers are <b>no longer necessary</b>.", r:"Tránh <i>kids, lots of, stuff, get, don’t, really, anymore</i> trong văn học thuật. Dùng <i>children, a great deal of, information, obtain, do not, no longer</i>."},
  {t:"fix", c:"W-REG", w:"I think going to uni is basically really important and totally worth it.", a:"Higher education is <b>fundamentally</b> important, and its high cost <b>can be justified</b> in the long term.", r:"Kỹ năng Register trong tài liệu: <i>basically → fundamentally; really important → critical; worth it → can be justified</i>."},
  {t:"fix", c:"W-GEN", w:"All students hate studying online and everybody prefers face-to-face classes.", a:"<b>Many</b> students find online study <b>less engaging</b>, and <b>a large proportion</b> appear to prefer face-to-face classes.", r:"Band 7 descriptor: “may over-generalise”. Dùng từ rào đón: <i>many, most, a large proportion, tend to, appear to, can</i>."},
  {t:"fix", c:"W-COL", w:"Many young people choose to do an apprentice with a local business to have experiences.", a:"Many young people choose to do an <b>apprenticeship</b> with a local business to <b>gain (hands-on) experience</b>.", r:"<b>apprentice</b> (người) ≠ <b>apprenticeship</b> (chương trình). <b>experience</b> (kinh nghiệm) không đếm được; <i>experiences</i> = trải nghiệm."}
 ]},
 {id:"org", icon:"🧭", title:{vi:"C · Lỗi sắp xếp ý (CC + TR)",en:"C · Organising ideas (CC + TR)"},
  lead:{vi:"Dựa trên các kỹ năng trong tài liệu: topic sentence, ordering information, coherence, introductions, comparison/contrast.",en:"Built on the skills in the material: topic sentences, ordering information, coherence, introductions, comparison/contrast."},
  items:[
  {t:"mcq", c:"O-TS", q:"Đề: “More people should be encouraged to do vocational training.” Chọn TOPIC SENTENCE tốt nhất cho đoạn thân bài 1:", o:["My uncle is an electrician and he earns a lot of money.","The most compelling reason to promote vocational training is the growing shortage of qualified tradespeople.","There are many reasons.","51% of employers cannot find plumbers."], k:1, r:"Topic sentence nêu <b>ý chính</b>, mang tính <b>khái quát</b>, <b>không chứa ví dụ/số liệu</b> (tài liệu: “A topic sentence should identify the main idea… general… provides no examples”)."},
  {t:"order", c:"O-ORD", q:"Sắp xếp thành đoạn văn hoàn chỉnh (Topic sentence → Explanation → Example → Result):",
   s:["For example, a nurse who works night shifts can watch recorded lectures in the morning and submit assignments at weekends.",
      "One major advantage of online university courses is their flexibility.",
      "Because learning is not restricted by geography, students can study at their own pace and follow their own timetable.",
      "As a result, many people who could never attend a traditional campus are now able to earn a degree."], k:"bcad", r:"b = topic sentence (ý chính) → c = giải thích (vì sao linh hoạt) → a = ví dụ cụ thể → d = kết quả/ý nghĩa. Đây là khung <b>TS – Explain – Example – Result</b> trong tài liệu."},
  {t:"mcq", c:"O-LINK", q:"“Many adults still cannot read or write.” — Câu tiếp theo nào mạch lạc hơn (given → new)?", o:["Governments should open more evening classes.","This lack of basic literacy prevents them from completing job applications or understanding medical instructions."], k:1, r:"Kỹ thuật <b>Ordering information</b>: câu sau bắt đầu bằng thông tin cũ (<i>This lack of basic literacy</i> = paraphrase câu trước) rồi mới thêm thông tin mới."},
  {t:"mcq", c:"O-LINK", q:"“Academic subjects like Law lead to high-flying careers. ___, practical courses such as plumbing offer quicker entry into the job market.”", o:["Similarly","Likewise","In contrast","In the same way"], k:2, r:"Hai ý <b>trái ngược</b> → <b>In contrast / Conversely</b>. <i>Similarly, Likewise, In the same way</i> dùng cho hai ý <b>tương đồng</b> (Writing Skills T1)."},
  {t:"mcq", c:"O-LINK", q:"“Medicine involves both academic and vocational aspects. ___, teacher training combines theory with classroom practice.”", o:["Conversely","In contrast","Similarly","However"], k:2, r:"Hai ví dụ cùng kết hợp lý thuyết + thực hành → so sánh tương đồng: <b>Similarly / Likewise</b>."},
  {t:"mcq", c:"O-REL", q:"Câu nào LẠC ĐỀ trong đoạn về “governments paying university fees”? (a) Free tuition would allow talented students from poor families to study. (b) This would create a more skilled workforce. (c) Many universities in my country have beautiful campuses. (d) However, it would place a heavy burden on taxpayers.", o:["(a)","(b)","(c)","(d)"], k:2, r:"(c) không liên quan đến học phí → xoá. Lỗi “thêm ý cho đủ chữ” làm giảm điểm TR và CC."},
  {t:"mcq", c:"O-INT", q:"Mở bài nào dưới đây đạt yêu cầu (theo tài liệu: own words, general, refers to all parts, focused)?", o:["“Have you always wondered about the differences between theoretical study and vocational training? I think it’s really important to try both to get a fantastic job after uni, actually.”","“I used to go to college when I was 18 and I had a great time learning graphic design…”","“Universities are important to the economy of the country but many other things are also important… every coin has two sides…”","“On the face of it, vocational education and academic study have little in common. Academic study promotes the discussion of ideas while vocational education provides a useful way into a career…”"], k:3, r:"Intro 3: câu hỏi tu từ + văn nói (uni, actually). Intro 6: kể chuyện cá nhân. Intro 5: thông tin thừa (trade, natural resources) + sáo rỗng “every coin has two sides”. Intro 4: đạt."},
  {t:"mcq", c:"O-POS", q:"Đề DISCUSSION: “Some say the purpose of education is to make individuals useful to society; others say it is to help them achieve personal ambitions. Discuss both views and give your opinion.” — Thesis nào đúng?", o:["“This essay will discuss both views.”","“Education is very important for everyone.”","“While both views have merit, I believe education should primarily equip people to contribute to society, as personal ambitions are often fulfilled through that contribution.”","“I totally agree that education is useful for society.”"], k:2, r:"Discussion + opinion cần: (1) nhắc CẢ HAI quan điểm, (2) nêu RÕ quan điểm của mình. (a) thiếu opinion; (b) lạc đề; (d) chỉ một phía, sai dạng."},
  {t:"mcq", c:"O-POS", q:"Đề TWO-PART: “In what ways are illiterate adults disadvantaged? What can governments do to help them?” — Dàn ý nào đúng?", o:["BP1: causes of illiteracy · BP2: solutions","BP1: disadvantages · BP2: government solutions","BP1: advantages of education · BP2: disadvantages","BP1 + BP2: government solutions only"], k:1, r:"Mỗi câu hỏi → 1 đoạn thân bài. Lỗi phổ biến: viết “causes” trong khi đề hỏi “disadvantages”, hoặc bỏ sót một câu hỏi → TR ≤ 5."},
  {t:"fix", c:"O-LINK", w:"Online courses are cheap. Online courses are flexible. Because online courses are cheap and flexible, online courses attract many working adults.", a:"Online courses are <b>both</b> cheap <b>and</b> flexible. <b>These two advantages</b> explain why <b>they</b> attract so many working adults.", r:"Dùng <b>tham chiếu</b> (this/these + noun, they, such) để tránh lặp danh từ — tiêu chí CC “uses a range of cohesive devices including reference”."},
  {t:"fix", c:"O-POS", w:"In conclusion, online learning and face-to-face learning both have advantages and disadvantages, so it depends on each person.", a:"In conclusion, although both forms of learning <b>cater for different audiences</b>, I believe that replacing classroom teaching entirely would be <b>a negative development</b>, because the <b>personal relationships</b> built on campus cannot be reproduced online.", r:"Kết luận phải <b>trả lời đúng câu hỏi</b> (positive or negative?) và <b>nhất quán</b> với mở bài. “It depends” = không có quan điểm."}
 ]}
 ]
}

  {n:"TEC IELTS · Real Exam IELTS Writing Task 2 – 2025",u:"https://www.tec-ielts.com/blog/recent-exam-questions-4/2025-18"}
 ],
 groups:[

  ideas:[
   "<b>Kinh tế – thị trường lao động:</b> thiếu thợ lành nghề (electricians, plumbers) ↔ thừa cử nhân thất nghiệp → đầu tư học nghề giúp cân bằng cung–cầu.",
   "<b>Giá trị riêng của đại học:</b> “promotes the discussion of ideas”, tư duy phản biện, nghiên cứu, ngành cần bằng cấp (Law, Medicine).",
   "<b>Hướng “partly agree” an toàn:</b> hai hệ thống bổ trợ — “a mixture of practice and theory often produces the best courses” (mô hình Diploma in teaching, apprenticeships).",
   "<b>Cá nhân vs xã hội:</b> giáo dục vừa giúp cá nhân theo đuổi hoài bão, vừa tạo công dân/lao động có ích — hai mục đích thường trùng nhau."],
  links:["MU-1","MU-2","MU-4","MU-5","INT-4"],
  qs:[

   {ty:"dis", d:["09/09/2026"], s:"Tram Nguyen IELTS", p:"Some people say that the purpose of education is to prepare individuals to be useful to society. Others say its purpose is to prepare individuals to achieve personal ambitions. Discuss both views and give your opinion.", star:true, gp:"gp3"},
   {ty:"op", d:["24/08/2024"], s:"IELTS CITY", p:"Some people think that the main purpose of schools is to turn children into good citizens and workers, rather than to benefit them as individuals. To what extent do you agree or disagree?"},

    if(EN_CARD_PARA[c.ref]) c.para=EN_CARD_PARA[c.ref];
  }));
  READING.t1.sources.forEach(s=>{ if(s.id==='intro'){ s.title="Model · Writing an introduction (Exercise 3, introduction 4)"; s.sub="A model introduction from the course material"; }});
  const g=CLINIC.t1.groups;
  g[0].items.forEach((it,i)=>{ it.r=EN_CLINIC.gra[i]; if(EN_CLINIC.graQ[i]) it.q=EN_CLINIC.graQ[i]; });
  g[1].items.forEach((it,i)=>{ it.r=EN_CLINIC.lex[i]; });
  g[2].items.forEach((it,i)=>{ const o=EN_CLINIC.org[i]; if(o.q) it.q=o.q; it.r=o.r; });
  BANK.t1.groups.forEach(gr=>{ gr.title=gr.id+' · '+gr.en; gr.ideas=EN_BANK[gr.id]; });
  GUIDED.t1.forEach(gp=>{ const e=EN_GUIDED[gp.id]; if(!e) return;
    gp.an.limit=e.limit; gp.an.task=e.task; gp.an.trap=e.trap; if(e.pos) gp.pos=e.pos;

    gp.build.forEach((b,i)=>{ b.q=e.build[i]; }); });
  ROADMAP.types.forEach(t=>{ const e=EN_TYPES[t.ty]; t.plan=e.plan; t.errs=e.errs; if(e.sig) t.sig=e.sig; });

/* --- band table + checklist (shared) --- */
function bandGroupHTML(title, bands, cls){
  const rows = bandDescriptors.filter(d=>bands.includes(d.b)).map(d=>
    `<tr data-b="${d.b}"><td class="bn">${d.b}</td>
     <td>${d.tr}</td><td>${d.cc}</td><td>${d.lr}</td><td>${d.gra}</td></tr>`).join('');
  return `<div class="bandgroup ${cls}"><div class="bghead">${title}</div>
    <div class="bandwrap"><table class="band"><thead><tr>
      <th>Band</th><th>Task Response</th><th>Coherence &amp; Cohesion</th>
      <th>Lexical Resource</th><th>Grammatical Range &amp; Accuracy</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function bandTableHTML(){
  return bandGroupHTML("Band 8–9 · Very good – Expert user", ["8","9"], "bg-hi")
       + bandGroupHTML("Band 6–7 · Competent – Good user", ["6","7"], "bg-mid")
       + bandGroupHTML("Band 4–5 · Limited – Modest user", ["4","5"], "bg-lo")
       + `<div class="bandsrc" style="border:1px solid var(--line);border-radius:8px">${tr('bandsrc')}</div>`;
}
function checklistHTML(topicId){
  let out = `<button class="resetbtn" onclick="resetChecks('${topicId}')">${tr('chk.reset')}</button>`;
  for(const k in checklist){
    const c=checklist[k];
    out += `<div class="crit"><h4><span class="k">${k}</span> ${c.name}</h4>`;
    c.items.forEach((it,idx)=>{
      const id=`chk-${topicId}-${k}-${idx}`;
      const label = (it&&typeof it==='object') ? (it[LANG]||it.vi) : it;
      out+=`<div class="check"><input type="checkbox" id="${id}"><label for="${id}">${label}</label></div>`;
    });
    out+=`</div>`;
  }
  out += `<div class="themetag" style="margin-top:18px">${tr('chk.bands')}</div>`;
  out += bandTableHTML();
  return out;
}
function resetChecks(topicId){
  document.querySelectorAll(`[id^="chk-${topicId}-"]`).forEach(c=>c.checked=false);
}

/* --- rich vocabulary entry --- */
function entryHTML(e){
  const wsafe = e.w.replace(/'/g,"\\'");
  const col = COLLOC[e.w];
  return `<div class="ventry">
    <div class="vhead"><span class="vw">${esc(e.w)}</span>
      <span class="pos">${esc(e.pos)}</span>
      <span class="ipa">${esc(e.ipa)}</span>
      <button class="vspeak" title="${tr('speak.title')}" onclick="speak('${wsafe}')">🔊</button></div>
    <div class="vdef"><b>EN</b>${esc(e.en)}</div>
    ${LANG==='vi'?`<div class="vdef vi"><b>VN</b>${esc(e.vi)}</div>`:''}
    <div class="vex">e.g. ${EX7[e.w]||e.ex}</div>
    ${col?`<div class="vcol"><b>COLLOCATIONS</b>${esc(col)}</div>`:''}</div>`;
}
function richVocabHTML(id){
  const t=VOCAB[id]; if(!t) return '';
  return t.groups.map(g=>`<div class="vsub">${esc(g.sub)}</div>`+
    `<div class="vgrid">`+g.words.map(entryHTML).join('')+`</div>`).join('');
}
let _gbVoice=null;
function pickGBVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  // prefer named British voices, then any en-GB voice
  const pref=["Google UK English Female","Google UK English Male","Daniel","Kate","Serena","Arthur","Sonia","Libby","George"];
  for(const name of pref){const v=vs.find(x=>x.name===name);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/English \(United Kingdom\)/i.test(v.name)) || null;
}
if('speechSynthesis' in window){
  _gbVoice=pickGBVoice();
  speechSynthesis.onvoiceschanged=()=>{_gbVoice=pickGBVoice();};
}
function speak(w){
  try{ if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(w);
    u.lang='en-GB'; u.rate=.9;
    if(!_gbVoice)_gbVoice=pickGBVoice();
    if(_gbVoice)u.voice=_gbVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* --- idea block --- */
function ideaHTML(node){
  if(node.theme){return `<div class="themetag">◆ ${esc(node.theme)}</div>`;}
  const cls = node.side==='against'?'arg against':'arg';
  const tag = node.side==='against'?tr('idea.tag.counter'):tr('idea.tag.arg');
  return `<div class="${cls}"><div class="claim"><span class="tag">${tag}</span><span>${esc(node.claim)}</span></div>
    <ul class="chain">${node.chain.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
}

function errLog(){
  const cnt={};
  const add=c=>{cnt[c]=(cnt[c]||0)+1;};
  const all={}; CLINIC.t1.groups.forEach(g=>g.items.forEach((it,i)=>all[g.id+'-'+i]=it));
  for(const k in ST.mcq){const it=all[k]; if(it && ST.mcq[k]!==it.k) add(it.c);}
  for(const k in ST.self){if(ST.self[k]==='miss' && all[k]) add(all[k].c);}
  for(const k in ST.order){if(ST.order[k]===false && all[k]) add(all[k].c);}
  return cnt;
}
function renderLog(){
  const el=document.getElementById('errlog'); if(!el) return;
  const cnt=errLog(); const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  el.innerHTML = keys.length ? keys.map(k=>`<div class="logrow ${cnt[k]>=3?'hot':''}"><span class="code">${k}</span><span class="lname">${L(ERRCODES[k])}</span><span class="lbar"><i style="width:${Math.min(100,cnt[k]*25)}%"></i></span><span class="lnum">${cnt[k]}</span></div>`).join('')+`<div class="lognote">${xt('log.note')}</div>`
    : `<div class="lognote">${xt('log.empty')}</div>`;
}
var resetClinic=function(){ST.mcq={};ST.self={};ST.order={};renderMain();show('t1');const b=document.querySelector('#sub-t1 button[data-p="clinic"]');if(b)b.click();}
function pickMcq(key,i){ST.mcq[key]=i; const box=document.getElementById('it-'+key); if(box) box.outerHTML=itemHTML(key, findItem(key)); renderLog();}
function selfMark(key,v){ST.self[key]=v; const box=document.getElementById('it-'+key); if(box) box.outerHTML=itemHTML(key, findItem(key)); renderLog();}
function checkOrder(key){const it=findItem(key); const inp=document.getElementById('ord-'+key); const v=(inp.value||'').toLowerCase().replace(/[^a-z]/g,''); ST.drafts['ord-'+key]=inp.value; ST.order[key]=(v===it.k); const box=document.getElementById('it-'+key); box.outerHTML=itemHTML(key,it); renderLog();}
function findItem(key){const [g,i]=[key.slice(0,key.lastIndexOf('-')),+key.slice(key.lastIndexOf('-')+1)]; return CLINIC.t1.groups.find(x=>x.id===g).items[i];}
function itemHTML(key,it){
  const code=`<span class="code" title="${esc(L(ERRCODES[it.c]))}">${it.c}</span>`;
  if(it.t==='fix'){
    const s=ST.self[key];
    return `<div class="citem ${s==='got'?'ok':s==='miss'?'bad':''}" id="it-${key}"><div class="cq">${code}<span class="ctype">✍️ Fix</span><span class="wrong">✗ ${esc(it.w)}</span></div>
      ${ta('cl-'+key,2)}
      <details ${s?'open':''}><summary>${xt('model')}</summary><div class="ans">✓ ${it.a}</div><div class="rule">${it.r}</div>
      <div class="selfbtn"><button class="${s==='got'?'on':''}" onclick="selfMark('${key}','got')">${xt('got')}</button><button class="miss ${s==='miss'?'on':''}" onclick="selfMark('${key}','miss')">${xt('miss')}</button></div></details></div>`;
  }
  if(it.t==='mcq'){
    const pick=ST.mcq[key];
    const done=pick!==undefined;
    return `<div class="citem ${done?(pick===it.k?'ok':'bad'):''}" id="it-${key}"><div class="cq">${code}<span class="ctype">☑ Choose</span><span>${it.q}</span></div>
      <div class="opts">${it.o.map((o,i)=>`<button class="opt ${done&&i===it.k?'right':''} ${done&&i===pick&&pick!==it.k?'wrongpick':''}" ${done?'disabled':''} onclick="pickMcq('${key}',${i})"><b>${String.fromCharCode(97+i)}</b> ${esc(o)}</button>`).join('')}</div>
      ${done?`<div class="rule">${it.r}</div>`:''}</div>`;
  }
  if(it.t==='order'){
    const r=ST.order[key];
    return `<div class="citem ${r===true?'ok':r===false?'bad':''}" id="it-${key}"><div class="cq">${code}<span class="ctype">↕ Order</span><span>${it.q}</span></div>
      <ol type="a" class="osents">${it.s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      <div class="orow"><input id="ord-${key}" class="oin" placeholder="e.g. d a c b" value="${esc(ST.drafts['ord-'+key]||'')}"><button class="linkbtn" onclick="checkOrder('${key}')">${xt('check')}</button></div>
      ${r!==undefined?`<div class="rule">${r?'✓':'✗ → <b>'+it.k.split('').join(' ')+'</b>'} · ${it.r}</div>`:''}</div>`;
  }
  return '';
}

function checkSel(id){let ok=0,n=0; document.querySelectorAll('#'+id+' tr').forEach(tr=>{const v=tr.querySelector('select').value; const g=v===tr.dataset.ans; n++; if(g)ok++; tr.querySelector('.mk').innerHTML=(g?'<b class="okk">✓</b>':'<b class="nok">✗</b>')+(tr.dataset.why&&v?` <span class="why">${esc(tr.dataset.why)}</span>`:'');}); scoreBadge(id,ok,n);}
function keySel(id){document.querySelectorAll('#'+id+' tr').forEach(tr=>{const o=[...tr.querySelector('select').options].find(o=>o.value===tr.dataset.ans); tr.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(o?o.text:tr.dataset.ans)}</span>${tr.dataset.why?` <span class="why">${esc(tr.dataset.why)}</span>`:''}`;});}
function matchEx(id,m){const letters='abcdefghijk'; return `<div class="matchwrap"><ol type="a" class="mright">${m.right.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>`+selEx(id,m.h,m.left.map((l,i)=>[l,letters[m.key[i]]]),m.right.map((r,i)=>[letters[i],letters[i]+' · '+r]));}
function oddEx(id,ex){
  return `<div class="ex" id="${id}"><h4>${ex.h}</h4><div class="odd">${ex.items.map((it,i)=>`<div class="oddrow"><span class="n">${i+1}</span>${it.slice(0,3).map(w=>`<button class="oddw" onclick="pickOdd(this,'${it[3]}')">${w}</button>`).join('')}</div>`).join('')}</div></div>`;
}
function pickOdd(b,ans){const row=b.parentNode; row.querySelectorAll('button').forEach(x=>{x.disabled=true; if(x.textContent===ans)x.classList.add('right');}); if(b.textContent!==ans)b.classList.add('wrongpick');}

   ${block(X.tf.h, li(X.tf.items.map(x=>`${esc(x[0])} → <b>${x[1]}</b> (${esc(x[2])})`)))}
   ${block(X.pm.h, li(X.pm.items.map(x=>`${esc(x[0])} → <b>${x[1]}</b>`)))}
   ${block(X.tbl.h, li(X.tbl.items.map(x=>`${esc(x[0])} → <b>${dmap[x[1]]}</b>`)))}
   ${block('Exercise 3 · Introductions', li(TEXTS.intros.map(t=>`<b>${t.ok?'✓':'✗'}</b> ${t.why}`)))}
   ${block(X.odd.h, li(X.odd.items.map(x=>`<b>${x[3]}</b>`)))}
   ${block(X.def.h, li(X.def.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.cls.h, Object.keys(X.cls.cats).map(c=>`<p><b>${c}:</b> ${X.cls.cats[c].join(', ')}</p>`).join(''))}
   ${block(X.fill.h, li(X.fill.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.col.h, li(X.col.left.map((l,i)=>`${l} → <b>${L2[X.col.key[i]]}</b> (${X.col.right[X.col.key[i]]})`)))}
   ${block(X.ev.h, li(X.ev.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.aw.h, li(X.aw.left.map((l,i)=>`${l} → <b>${L2[X.aw.key[i]]}</b> (${X.aw.right[X.aw.key[i]]})`)))}
   ${block(X.awf.h, li(X.awf.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.cmp.h, li(X.cmp.items.map(x=>`${x[0]} → <b>${x[1]}</b>`))+li(X.cmp.complete.map(x=>`<i>${esc(x[1])}</i>`)))}
   </div></div>
   <div class="card"><h3>Sentence Clinic</h3>${clinicKey}</div>`);
}

function renderMain(){
  mainEl.innerHTML='';
  if(MODE==='teacher') buildPlan(); else buildPath();
  buildTexts(); buildVocab(); buildLab(); buildSkills(); buildClinic(); buildBank(); buildCheck();
  if(MODE==='teacher') buildKeys();
  renderLog();
  const vw=document.getElementById('view-'+currentView); (vw||document.getElementById('view-'+ETABS[0].id)).classList.add('active');
}
function setLang(l){
  LANG=(MODE==='student')?'en':l; document.documentElement.lang=LANG;
  const bvi=document.getElementById('lang-vi'), ben=document.getElementById('lang-en');
  if(bvi) bvi.classList.toggle('on',LANG==='vi'); if(ben) ben.classList.toggle('on',LANG==='en');
  document.getElementById('headIntro').innerHTML = MODE==='student'
   ? 'Read the two texts first, collect ideas and phrases, fix the sentence errors that cost the most marks, then write about <b>real IELTS exam questions from 2024–2026</b>.'
   : V('Bản giáo viên · Unit <b>Education</b>: thiết kế bài giảng 4 buổi, toàn bộ bài đọc nguyên văn, bài tập có chấm, Reading Lab, Sentence Clinic, 47 đề thật 2024–2026, 6 bài thực hành có hướng dẫn và <b>đáp án tổng hợp</b>.','Teacher edition · <b>Education</b> unit: a 4-session lesson design, all readings verbatim, auto-checked exercises, Reading Lab, Sentence Clinic, 47 real 2024–2026 prompts, 6 guided tasks and <b>consolidated answer keys</b>.');
  document.getElementById('foot').innerHTML = (MODE==='student'||LANG==='en')
   ? 'Writing Studio · IELTS Writing Task 2 · Unit 1 Education — readings and exercises adapted from <b>Evolve Level 4</b> (Cambridge University Press); real exam prompts compiled from talkfirst.vn, ieltscity.vn, tramnguyenielts.com, tec-ielts.com and vietop.edu.vn (reported by candidates, so wording may differ slightly); band descriptors from the British Council / IDP / Cambridge Assessment English.'
   : 'Writing Studio · IELTS Writing Task 2 · Unit 1 Education — bài đọc và bài tập chuyển thể từ <b>Evolve Level 4</b> (Cambridge University Press); đề thi thật tổng hợp từ talkfirst.vn, ieltscity.vn, tramnguyenielts.com, tec-ielts.com, vietop.edu.vn; band descriptors theo British Council / IDP / Cambridge.';
  renderTabs(); renderMain(); show(currentView);
}
currentView=ETABS[0].id;
setLang(MODE==='student'?'en':'vi');


</script>
