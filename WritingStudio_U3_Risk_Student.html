<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Studio · Unit 3 Risk · Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#d76b34; --orange-soft:#e7a173; --sage:#7f9a76; --sage-soft:#c3d0bd;
    --cream:#f1efe7; --paper:#ffffff; --ink:#232321; --muted:#6f6e66;
    --line:#e7e3d7; --yellow:#e9d9a6;
    --shadow:0 1px 2px rgba(30,28,22,.04),0 6px 20px rgba(30,28,22,.06);
    --shadow-lg:0 4px 30px rgba(30,28,22,.10);
    --font-head:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --rad:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);
    line-height:1.62;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:600}
  a{color:var(--orange)}
  /* Header */
  header.top{background:radial-gradient(120% 140% at 0% 0%,#33322d 0%,#1f1e1b 55%,#191814 100%);
    color:#fff;padding:20px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(215,107,52,.28),transparent 70%);pointer-events:none}
  header.top .paradigm{font-family:var(--font-head);font-size:15px;letter-spacing:6px;font-weight:600;
    color:#fff;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:11px;margin-bottom:13px;text-transform:uppercase}
  header.top .brand{font-size:12px;letter-spacing:4px;color:var(--orange-soft);font-weight:700}
  header.top h1{font-size:33px;margin:3px 0 6px;color:#fff;font-weight:600;letter-spacing:-.02em}
  header.top p{margin:0;color:#d3d0c6;font-size:13.5px;max-width:860px;line-height:1.55}
  header.top .langswitch{position:absolute;top:20px;right:26px;display:flex;gap:0;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;overflow:hidden;z-index:2}
  header.top .langswitch button{border:0;background:transparent;color:#d3d0c6;font:inherit;font-weight:700;
    font-size:12px;letter-spacing:.5px;padding:6px 13px;cursor:pointer;transition:.15s}
  header.top .langswitch button.on{background:var(--orange);color:#fff}
  /* Tabs */
  nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:9px 16px;
    box-shadow:0 2px 14px rgba(30,28,22,.05)}
  nav.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);
    padding:8px 15px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
  nav.tabs button:hover{background:var(--cream);color:var(--ink)}
  nav.tabs button.active{background:var(--ink);color:#fff}
  nav.tabs button .tno{font-size:10.5px;opacity:.65;margin-right:5px;font-weight:800}
  /* Layout */
  main{max-width:1090px;margin:0 auto;padding:28px 22px 90px}
  section.view{display:none;animation:fade .25s ease}
  section.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Sub nav */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
  .subnav button{border:1px solid var(--line);background:var(--paper);font:inherit;font-weight:600;
    font-size:13px;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
  .subnav button:hover{border-color:var(--sage)}
  .subnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .panel{display:none}
  .panel.on{display:block}
  /* Cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:22px 24px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .card h3{font-size:21px;margin-bottom:5px;color:var(--ink)}
  .card .lead{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:820px}
  .topichero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:4px 2px}
  .topichero .badge{width:60px;height:60px;border-radius:16px;
    background:linear-gradient(150deg,var(--orange),#c05a26);color:#fff;box-shadow:0 6px 16px rgba(199,90,40,.28);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:23px;font-weight:600;flex-shrink:0}
  .topichero h2{font-size:28px}
  .topichero p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  /* Vocab */
  .vgroup{margin-bottom:18px}
  .vgroup h4{font-size:15px;color:var(--orange);border-bottom:2px solid var(--sage-soft);
    padding-bottom:5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13.5px}
  .chip b{color:var(--ink)}
  .wtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .wtable td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
  .wtable td:first-child{font-weight:600;width:38%;background:var(--cream)}
  /* Rich vocabulary entries */
  .vsub{font-family:var(--font-head);font-size:13.5px;font-weight:600;color:#8a5a2c;display:flex;align-items:center;gap:9px;
    margin:20px 0 12px;letter-spacing:.01em}
  .vsub::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px;display:inline-block}
  .ventry{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:var(--paper);
    box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
  .ventry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .ventry .vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ventry .vw{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
  .ventry .pos{font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);padding:2px 9px;border-radius:12px;font-style:normal;letter-spacing:.3px}
  .ventry .ipa{font-family:var(--font-body);color:var(--orange);font-size:14px;font-weight:500}
  .ventry .vspeak{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:8px;
    cursor:pointer;font-size:13px;padding:3px 9px;color:var(--muted)}
  .ventry .vspeak:hover{border-color:var(--orange);color:var(--orange)}
  .ventry .vdef{font-size:13.6px;margin:2px 0}
  .ventry .vdef b{color:var(--sage);font-size:11px;letter-spacing:.5px;margin-right:4px}
  .ventry .vdef.vi b{color:var(--orange)}
  .ventry .vex{font-size:13.2px;font-style:italic;color:var(--muted);margin-top:6px;
    border-left:3px solid var(--sage-soft);padding-left:10px}
  .ventry .vex b{font-style:normal;color:var(--ink)}
  .ventry .vcol{font-size:12.4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;color:#5c5c54}
  .ventry .vcol b{display:block;color:var(--orange);font-size:9.5px;letter-spacing:.7px;margin-bottom:2px;font-weight:700}
  /* side-by-side vocabulary boxes */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;align-items:stretch}
  .vgrid .ventry{margin-bottom:0;display:flex;flex-direction:column}
  @media(max-width:640px){.vgrid{grid-template-columns:1fr}}
  /* Glossary */
  .gsearch{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font:inherit;
    font-size:14px;margin-bottom:16px;background:var(--paper)}
  .gsearch:focus{outline:none;border-color:var(--orange)}
  .gtopic{scroll-margin-top:70px}
  .gtopic h3{font-size:19px;color:var(--ink);border-bottom:2px solid var(--orange);padding-bottom:6px;margin:22px 0 4px}
  .gcount{font-size:12px;color:var(--muted);margin-bottom:6px}
  .gjump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .gjump a{font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);
    padding:4px 10px;border-radius:16px;background:var(--paper)}
  .gjump a:hover{border-color:var(--orange);color:var(--orange)}
  /* Idea development */
  .arg{border-left:4px solid var(--orange);background:var(--paper);border:1px solid var(--line);
    border-left-width:4px;border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:14px}
  .arg.against{border-left-color:var(--sage)}
  .arg .claim{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
  .arg .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;
    color:#fff;background:var(--orange);flex-shrink:0;margin-top:2px}
  .arg.against .tag{background:var(--sage)}
  .chain{list-style:none;margin:0;padding:0;counter-reset:step}
  .chain li{position:relative;padding:4px 0 4px 30px;font-size:13.8px;counter-increment:step}
  .chain li::before{content:counter(step);position:absolute;left:0;top:4px;width:20px;height:20px;
    background:var(--cream);border:1px solid var(--sage);border-radius:50%;font-size:11px;font-weight:700;
    color:var(--sage);display:flex;align-items:center;justify-content:center}
  .chain li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:24px;bottom:-2px;width:1px;background:var(--sage-soft)}
  .themetag{display:inline-block;background:var(--yellow);color:#6b5a1f;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:14px 0 8px}
  /* Practice bank */
  .prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .prompt .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px}
  .pill.new{background:var(--orange);color:#fff}
  .pill.file{background:var(--sage);color:#fff}
  .pill.common{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
  .pill.type{background:#efe7db;color:#8a6a3a}
  .prompt p{margin:0;font-size:14.5px}
  .prompt .date{font-size:11.5px;color:var(--muted);margin-left:auto}
  /* Checklist */
  .crit{margin-bottom:16px}
  .crit h4{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .crit h4 .k{background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-family:monospace}
  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .check input{margin-top:5px;width:16px;height:16px;accent-color:var(--sage);flex-shrink:0;cursor:pointer}
  .check label{cursor:pointer}
  /* Band table */
  .bandwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .bandsrc{font-size:11.6px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:var(--paper)}
  .bandgroup{margin-bottom:20px}
  .bghead{font-family:Georgia,serif;font-weight:700;font-size:15px;padding:9px 15px;border-radius:10px 10px 0 0;color:#fff}
  .bandgroup.bg-hi .bghead{background:#4f7a41}
  .bandgroup.bg-mid .bghead{background:#a5842f}
  .bandgroup.bg-lo .bghead{background:#b25a2e}
  .bandgroup .bandwrap{border-radius:0 0 12px 12px}
  .refcard ol{margin:8px 0 0;padding-left:20px}
  .refcard li{font-size:13.4px;margin-bottom:8px}
  .refcard .tag2{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);
    padding:2px 8px;border-radius:12px;margin-right:6px;letter-spacing:.4px}
  table.band{border-collapse:collapse;width:100%;min-width:760px;font-size:12.8px}
  table.band th,table.band td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
  table.band thead th{background:var(--ink);color:#fff;font-family:'Segoe UI',sans-serif;font-size:12.5px;position:sticky;top:0}
  table.band td.bn{font-weight:800;font-size:16px;text-align:center;font-family:Georgia,serif;width:46px}
  /* colour-coded by BAND: every criterion in one band shares the same tone (green→red) */
  table.band tr[data-b="9"] td{background:#dcebd4}
  table.band tr[data-b="8"] td{background:#e8f1de}
  table.band tr[data-b="7"] td{background:#f3f0d2}
  table.band tr[data-b="6"] td{background:#faedcc}
  table.band tr[data-b="5"] td{background:#f7e1d0}
  table.band tr[data-b="4"] td{background:#f3d7c7}
  table.band tr[data-b="9"] td.bn{background:#bcd9ae;color:#2f5626}
  table.band tr[data-b="8"] td.bn{background:#cfe3bf;color:#3a5f2b}
  table.band tr[data-b="7"] td.bn{background:#e7dfa6;color:#6f5f16}
  table.band tr[data-b="6"] td.bn{background:#f2dda6;color:#8a6716}
  table.band tr[data-b="5"] td.bn{background:#efc7ac;color:#9e5228}
  table.band tr[data-b="4"] td.bn{background:#e9b79c;color:#a8481f}
  table.band td b{color:#141414;font-weight:800}
  /* Sample essay */
  .essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 26px;font-size:14.5px}
  .essay h3{text-align:center;margin-bottom:16px;font-size:22px}
  .essay p{margin:0 0 13px;position:relative}
  .essay .num{position:absolute;left:-26px;color:var(--sage);font-weight:700;font-family:Georgia,serif}
  mark.hook{background:#f6ddc9;padding:1px 2px}
  mark.thesis{background:#d9e6d3;padding:1px 2px}
  mark.topic{background:#eee2c2;padding:1px 2px}
  mark.counter{background:#e3d4ea;padding:1px 2px}
  mark.refute{background:#cfe3e8;padding:1px 2px}
  mark.restate{background:#d9e6d3;padding:1px 2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
  /* Structure diagram */
  .flow{display:flex;flex-direction:column;gap:2px;max-width:640px;margin:8px 0}
  .flow div{color:var(--ink);padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px}
  .flow .f1{background:var(--orange);color:#fff;margin-right:0}
  .flow .f2{background:var(--orange-soft);margin-left:26px}
  .flow .f3{background:var(--yellow);margin-left:52px}
  .flow .f4{background:var(--sage-soft);margin-left:78px}
  .flow .f5{background:var(--ink);color:#fff;margin-left:104px}
  .flow small{display:block;font-weight:400;font-size:12px;opacity:.9}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.topichero h2{font-size:22px}}
  .typebox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .typebox h4{font-size:14.5px;color:var(--orange);margin-bottom:3px}
  .typebox .ex{font-size:12.8px;color:var(--muted);font-style:italic;margin-top:6px}
  .note{background:#fff7e8;border:1px solid var(--yellow);border-radius:10px;padding:12px 15px;font-size:13px;margin-bottom:16px}
  .qanalyze{background:#ecf3e9;border:1px solid var(--sage-soft);border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.4px}
  .qanalyze .row{display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;border-bottom:1px dashed #cdd8c5}
  .qanalyze .row:last-child{border-bottom:0}
  .qanalyze .lbl{font-weight:700;color:#4f6446;min-width:150px;flex-shrink:0}
  .qanalyze mark{background:#f6ddc9;padding:0 3px;border-radius:3px}
  .qanalyze mark.t{background:#e3d4ea}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .resetbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);margin-bottom:10px}
  .linkbtn{border:0;background:var(--sage);color:#fff;font:inherit;font-weight:700;font-size:12.5px;
    padding:3px 10px;border-radius:7px;cursor:pointer}
  .linkbtn:hover{background:#87997f}

  /* ===== Extension: Reading Lab / Clinic / Bank / Roadmap ===== */
  .rcard,details.gp,.bgroup,#guided,.card{scroll-margin-top:120px}
  .rsrc{margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  .rsrc-h{font-family:var(--font-head);font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rsrc-s{font-size:12.5px;color:var(--muted);font-style:italic}
  .rcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;transition:box-shadow .3s}
  .rcard.flash{box-shadow:0 0 0 3px var(--orange-soft)}
  .rhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .rref{font-family:monospace;font-weight:700;font-size:12px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:6px}
  .rpara{font-size:12px;color:var(--muted);font-weight:600}
  .rquote{margin:6px 0 10px;padding:10px 14px;border-left:4px solid var(--sage);background:#f7f5ee;border-radius:0 8px 8px 0;
    font-family:Georgia,'Times New Roman',serif;font-size:15.2px;line-height:1.7}
  .rquote mark{background:#f6ddc9;padding:0 2px;border-radius:3px}
  .rphr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{font-size:12px;background:#ecf3e9;border:1px solid var(--sage-soft);color:#4f6446;padding:3px 9px;border-radius:14px;cursor:pointer;font-weight:600}
  .chip:hover{background:var(--sage-soft)}
  .rqs{margin:0;padding-left:0;list-style:none}
  .rq{padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
  .rk{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:4px;background:var(--cream);color:var(--muted)}
  .rq-y .rk{background:#fbe9dc;color:#a4501f}
  .rq-cum .rk{background:#e3eedf;color:#4f6446}
  .xta{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;
    background:#fffdf8;resize:vertical;color:var(--ink)}
  .xta:focus{outline:2px solid var(--sage-soft);border-color:var(--sage)}
  details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--orange);margin-top:6px;user-select:none}
  .ans{background:#ecf3e9;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.8px}
  .errnote{background:#fff1ec;border:1px solid #f1c7b0;border-radius:8px;padding:7px 12px;margin-top:6px;font-size:13px}
  .rule{background:#f7f5ee;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.2px}
  .code{font-family:monospace;font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .cgroup{margin-top:26px}
  .cgroup h4{font-size:18px;margin-bottom:4px}
  .citem{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 15px;margin:10px 0}
  .citem.ok{border-left-color:var(--sage)}
  .citem.bad{border-left-color:var(--orange)}
  .cq{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:14.2px}
  .ctype{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-top:2px}
  .wrong{color:#a4501f;text-decoration:line-through;text-decoration-color:rgba(164,80,31,.35);flex:1 1 300px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  @media(max-width:720px){.opts{grid-template-columns:1fr}}
  .opt{text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .opt:hover:not([disabled]){border-color:var(--sage)}

   {w:"academic",pos:"adj",ipa:"/ˌækəˈdemɪk/",en:"relating to education, study and ideas rather than practical skills",vi:"thuộc học thuật, hàn lâm",ex:"She chose an <b>academic</b> course rather than vocational training."},
   {w:"vocational",pos:"adj",ipa:"/vəʊˈkeɪʃənl/",en:"providing skills needed for a particular job",vi:"hướng nghiệp, dạy nghề",ex:"<b>Vocational</b> courses prepare students directly for a trade."},
   {w:"module",pos:"n",ipa:"/ˈmɒdjuːl/",en:"a unit that forms one part of a course",vi:"học phần",ex:"Students must pass twelve <b>modules</b> to graduate."},
   {w:"qualified",pos:"adj",ipa:"/ˈkwɒlɪfaɪd/",en:"having the training or skills that are needed",vi:"có trình độ, đủ tiêu chuẩn",ex:"There is a shortage of <b>qualified</b> electricians and plumbers."}]},
  {sub:"Ways to deliver & pay", words:[
   {w:"lecture",pos:"n",ipa:"/ˈlektʃə/",en:"a formal talk given to a large group of students",vi:"bài giảng",ex:"The professor gave a <b>lecture</b> on climate policy."},
   {w:"seminar",pos:"n",ipa:"/ˈsemɪnɑː/",en:"a small class for discussion with a teacher",vi:"buổi hội thảo / thảo luận",ex:"In the <b>seminar</b>, students debated the assigned reading."},
   {w:"tutorial",pos:"n",ipa:"/tjuːˈtɔːriəl/",en:"a small-group or one-to-one teaching session",vi:"buổi phụ đạo, dạy kèm",ex:"She booked a <b>tutorial</b> to discuss her essay plan."},
   {w:"distance learning",pos:"n phr",ipa:"/ˈdɪstəns ˌlɜːnɪŋ/",en:"study that is done remotely, away from a college",vi:"học từ xa",ex:"<b>Distance learning</b> allows people to study from home."},
   {w:"face-to-face",pos:"adj",ipa:"/ˌfeɪs tə ˈfeɪs/",en:"happening in person, with people physically present",vi:"trực tiếp, mặt đối mặt",ex:"Many students prefer <b>face-to-face</b> lessons to online ones."},
   {w:"tuition fees",pos:"n phr",ipa:"/tjuˈɪʃn fiːz/",en:"money paid for being taught",vi:"học phí",ex:"University <b>tuition fees</b> have risen sharply in recent years."},
   {w:"scholarship",pos:"n",ipa:"/ˈskɒləʃɪp/",en:"an award of money to help pay for study",vi:"học bổng",ex:"He won a <b>scholarship</b> to a top university."},
   {w:"bursary",pos:"n",ipa:"/ˈbɜːsəri/",en:"a grant given to a student who needs financial help",vi:"trợ cấp học tập",ex:"The <b>bursary</b> covers most of her living costs."},
   {w:"apprenticeship",pos:"n",ipa:"/əˈprentɪʃɪp/",en:"a period of training on the job under a skilled worker",vi:"quá trình học việc",ex:"She did an <b>apprenticeship</b> with a local carpenter."}]},
  {sub:"Assessment & academic life", words:[
   {w:"assignment",pos:"n",ipa:"/əˈsaɪnmənt/",en:"a task or piece of work given to a student",vi:"bài tập được giao",ex:"The <b>assignment</b> must be submitted by Friday."},
   {w:"examination",pos:"n",ipa:"/ɪɡˌzæmɪˈneɪʃn/",en:"a formal test of knowledge under timed conditions",vi:"kỳ thi",ex:"The final <b>examination</b> lasts three hours."},
   {w:"dissertation",pos:"n",ipa:"/ˌdɪsəˈteɪʃn/",en:"a long piece of writing on a subject for a degree",vi:"luận văn",ex:"His <b>dissertation</b> was over ten thousand words."},
   {w:"plagiarism",pos:"n",ipa:"/ˈpleɪdʒərɪzəm/",en:"copying someone's work and presenting it as your own",vi:"đạo văn",ex:"<b>Plagiarism</b> can lead to a student being expelled."},
   {w:"term",pos:"n",ipa:"/tɜːm/",en:"one of the three periods a school year is divided into",vi:"học kỳ (trong 3 kỳ)",ex:"The autumn <b>term</b> ends just before Christmas."},
   {w:"semester",pos:"n",ipa:"/sɪˈmestə/",en:"one of the two periods a school year is divided into",vi:"học kỳ (trong 2 kỳ)",ex:"The course runs across two <b>semesters</b>."},
   {w:"journal",pos:"n",ipa:"/ˈdʒɜːnl/",en:"an academic magazine publishing research papers",vi:"tạp chí học thuật",ex:"Her study appeared in a peer-reviewed <b>journal</b>."},
   {w:"lecturer",pos:"n",ipa:"/ˈlektʃərə/",en:"a person who teaches at a university",vi:"giảng viên",ex:"The <b>lecturer</b> is also an active researcher."},
   {w:"tutor",pos:"n",ipa:"/ˈtjuːtə/",en:"a teacher responsible for a student's academic welfare",vi:"cố vấn học tập, gia sư",ex:"His <b>tutor</b> helped him choose his modules."}]},
  {sub:"Reading collocations & academic words", words:[
   {w:"virtual university",pos:"n phr",ipa:"/ˈvɜːtʃuəl/",en:"a university that operates entirely online",vi:"đại học ảo (trực tuyến)",ex:"The world's first <b>virtual university</b> opened in 1996."},
   {w:"credible alternative",pos:"n phr",ipa:"/ˈkredəbl/",en:"a believable and reliable other option",vi:"lựa chọn thay thế đáng tin cậy",ex:"Distance learning is now a <b>credible alternative</b> to campus study."},
   {w:"motivation",pos:"n",ipa:"/ˌməʊtɪˈveɪʃn/",en:"the willingness and drive to do something",vi:"động lực",ex:"Distance learning demands a high level of <b>motivation</b>."},
   {w:"interaction",pos:"n",ipa:"/ˌɪntərˈækʃn/",en:"communication or contact between people",vi:"sự tương tác",ex:"Face-to-face <b>interaction</b> helps learners feel supported."}]}
 ]},

 t2:{title:"Healthcare", groups:[
  {sub:"Funding & access", words:[
   {w:"premium",pos:"n",ipa:"/ˈpriːmiəm/",en:"a regular payment made for an insurance policy",vi:"phí bảo hiểm",ex:"You have to pay an insurance <b>premium</b> every month."},
   {w:"burden",pos:"n",ipa:"/ˈbɜːdn/",en:"a heavy or difficult responsibility",vi:"gánh nặng",ex:"An ageing population creates a huge financial <b>burden</b>."},
   {w:"deduct",pos:"v",ipa:"/dɪˈdʌkt/",en:"to take away an amount from a total",vi:"khấu trừ",ex:"Insurance is <b>deducted</b> directly from workers' salaries."},
   {w:"consultation",pos:"n",ipa:"/ˌkɒnslˈteɪʃn/",en:"a meeting with a doctor to get advice or treatment",vi:"buổi khám / tư vấn",ex:"The first <b>consultation</b> is free of charge."},
   {w:"safety net",pos:"n phr",ipa:"/ˈseɪfti net/",en:"a system that protects people in difficulty",vi:"mạng lưới an sinh",ex:"Savings act as a <b>safety net</b> if you lose your job."},
   {w:"labour costs",pos:"n phr",ipa:"/ˈleɪbə kɒsts/",en:"the money spent on employing people",vi:"chi phí nhân công",ex:"The scheme has been criticised for driving up <b>labour costs</b>."},
   {w:"regardless",pos:"adv",ipa:"/rɪˈɡɑːdləs/",en:"despite something; without being affected by it",vi:"bất kể",ex:"Basic care is provided <b>regardless</b> of a person's income."}]},
  {sub:"Medical vocabulary", words:[
   {w:"treatment",pos:"n",ipa:"/ˈtriːtmənt/",en:"medical care given to a patient for an illness",vi:"sự điều trị",ex:"After months of <b>treatment</b>, she could walk again."},
   {w:"disease epidemic",pos:"n phr",ipa:"/ˌepɪˈdemɪk/",en:"an illness that spreads to many people at the same time",vi:"dịch bệnh",ex:"Clean water helps prevent a <b>disease epidemic</b>."},
   {w:"sedentary lifestyle",pos:"n phr",ipa:"/ˈsedntri/",en:"a way of living that involves little physical activity",vi:"lối sống ít vận động",ex:"A <b>sedentary lifestyle</b> is a major cause of obesity."},
   {w:"patent",pos:"n",ipa:"/ˈpeɪtnt/",en:"the legal right to be the only maker of an invention",vi:"bằng sáng chế",ex:"Drug companies take out <b>patents</b> on new medicines."},
   {w:"underfunding",pos:"n",ipa:"/ˌʌndəˈfʌndɪŋ/",en:"a lack of the money that is needed for something",vi:"tình trạng thiếu kinh phí",ex:"Many hospitals suffer from serious <b>underfunding</b>."},
   {w:"preventable illness",pos:"n phr",ipa:"/prɪˈventəbl/",en:"a disease that could be avoided, often through lifestyle",vi:"bệnh có thể phòng ngừa",ex:"Diet is linked to many <b>preventable illnesses</b>."},
   {w:"cosmetic surgery",pos:"n phr",ipa:"/kɒzˈmetɪk/",en:"a medical operation to improve someone's appearance",vi:"phẫu thuật thẩm mỹ",ex:"Some people travel abroad for cheaper <b>cosmetic surgery</b>."},
   {w:"drug dependency",pos:"n phr",ipa:"/dɪˈpendənsi/",en:"the state of being unable to function without a drug",vi:"sự lệ thuộc thuốc",ex:"Long prescriptions can lead to <b>drug dependency</b>."},
   {w:"life expectancy",pos:"n phr",ipa:"/ɪkˈspektənsi/",en:"the number of years a person is expected to live",vi:"tuổi thọ trung bình",ex:"<b>Life expectancy</b> has risen to 67 worldwide."}]},
  {sub:"Academic adjectives", words:[
   {w:"adverse",pos:"adj",ipa:"/ˈædvɜːs/",en:"having a harmful or unfavourable effect",vi:"bất lợi, có hại",ex:"Underfunding creates <b>adverse</b> conditions in hospitals."},
   {w:"adequate",pos:"adj",ipa:"/ˈædɪkwət/",en:"enough or good enough for a purpose",vi:"đầy đủ, thoả đáng",ex:"Patients have the right to an <b>adequate</b> level of care."},
   {w:"conventional",pos:"adj",ipa:"/kənˈvenʃənl/",en:"traditional and ordinary; widely accepted",vi:"thông thường, truyền thống",ex:"<b>Conventional</b> medicine relies on the use of drugs."},
   {w:"precise",pos:"adj",ipa:"/prɪˈsaɪs/",en:"exact, accurate and clearly stated",vi:"chính xác",ex:"The dose of a drug must be <b>precise</b>."},
   {w:"professional",pos:"adj",ipa:"/prəˈfeʃənl/",en:"having the qualities of trained, skilled people",vi:"chuyên nghiệp",ex:"Doctors and nurses are <b>professional</b> practitioners."}]},
  {sub:"Language of concession", words:[
   {w:"however",pos:"adv",ipa:"/haʊˈevə/",en:"used to introduce a contrasting idea",vi:"tuy nhiên",ex:"Homeopathy seems ineffective; <b>however</b>, many still use it."},
   {w:"nevertheless",pos:"adv",ipa:"/ˌnevəðəˈles/",en:"in spite of what has just been said",vi:"tuy vậy, dù thế",ex:"The evidence is weak; <b>nevertheless</b>, demand remains strong."},
   {w:"despite",pos:"prep",ipa:"/dɪˈspaɪt/",en:"without being affected by something",vi:"mặc dù",ex:"<b>Despite</b> the high cost, the treatment continued."}]}
 ]},

 t3:{title:"Risk", groups:[
  {sub:"Risk & the body", words:[
   {w:"risk-taker",pos:"n",ipa:"/ˈrɪsk ˌteɪkə/",en:"a person who is willing to take chances",vi:"người ưa mạo hiểm",ex:"A <b>risk-taker</b> enjoys living on the edge of danger."},
   {w:"risk-averse",pos:"adj",ipa:"/ˈrɪsk əˌvɜːs/",en:"disliking risk and preferring safety",vi:"e ngại rủi ro",ex:"<b>Risk-averse</b> investors keep their money in the bank."},
   {w:"adrenalin",pos:"n",ipa:"/əˈdrenəlɪn/",en:"a hormone released when you are excited or afraid",vi:"a-đrê-na-lin (hoóc-môn)",ex:"Extreme situations make the body produce <b>adrenalin</b>."},
   {w:"endorphins",pos:"n",ipa:"/enˈdɔːfɪnz/",en:"natural chemicals that make you feel good",vi:"endorphin (chất tạo hưng phấn)",ex:"Exercise releases <b>endorphins</b> and reduces pain."},
   {w:"alert",pos:"adj",ipa:"/əˈlɜːt/",en:"quick to notice and react to things",vi:"tỉnh táo, cảnh giác",ex:"Adrenalin makes the body more <b>alert</b> to danger."}]},
  {sub:"Language of freedom", words:[
   {w:"ban",pos:"v",ipa:"/bæn/",en:"to forbid something officially",vi:"cấm",ex:"Certain countries completely <b>ban</b> the sale of guns."},
   {w:"curb",pos:"v",ipa:"/kɜːb/",en:"to control or limit something",vi:"kiềm chế, hạn chế",ex:"New laws are designed to <b>curb</b> reckless driving."},
   {w:"restrict",pos:"v",ipa:"/rɪˈstrɪkt/",en:"to limit the size, amount or freedom of something",vi:"hạn chế",ex:"Regulations <b>restrict</b> the most dangerous activities."},
   {w:"legalize",pos:"v",ipa:"/ˈliːɡəlaɪz/",en:"to make something legal",vi:"hợp pháp hoá",ex:"Some states have chosen to <b>legalize</b> certain drugs."},
   {w:"authorize",pos:"v",ipa:"/ˈɔːθəraɪz/",en:"to give official permission for something",vi:"cho phép, uỷ quyền",ex:"The president will <b>authorize</b> the building of new colleges."},
   {w:"grant",pos:"v",ipa:"/ɡrɑːnt/",en:"to agree to give or allow something formally",vi:"cấp, ban cho",ex:"If states <b>grant</b> people the vote, they should use it wisely."}]},
  {sub:"Noun forms", words:[
   {w:"legislation",pos:"n",ipa:"/ˌledʒɪsˈleɪʃn/",en:"a law or set of laws",vi:"pháp luật, đạo luật",ex:"The government introduced new <b>legislation</b> on safety."},
   {w:"regulations",pos:"n",ipa:"/ˌreɡjuˈleɪʃnz/",en:"official rules that control how something is done",vi:"quy định",ex:"Health-and-safety <b>regulations</b> protect employees."},
   {w:"prevention",pos:"n",ipa:"/prɪˈvenʃn/",en:"the act of stopping something from happening",vi:"sự phòng ngừa",ex:"<b>Prevention</b> is often cheaper than a cure."},
   {w:"objection",pos:"n",ipa:"/əbˈdʒekʃn/",en:"a reason for disagreeing with something",vi:"sự phản đối",ex:"Companies raised a strong <b>objection</b> to the new policy."}]},
  {sub:"Cause–effect & conditional linkers", words:[
   {w:"consequently",pos:"adv",ipa:"/ˈkɒnsɪkwəntli/",en:"as a result of something",vi:"do đó, vì vậy",ex:"He ignored the risks and <b>consequently</b> lost everything."},
   {w:"provided that",pos:"conj phr",ipa:"/prəˈvaɪdɪd/",en:"only if a particular condition is met",vi:"miễn là, với điều kiện",ex:"Risk is acceptable <b>provided that</b> it is carefully managed."},
   {w:"as long as",pos:"conj phr",ipa:"/əz ˈlɒŋ əz/",en:"on condition that",vi:"chừng nào, miễn là",ex:"People may take risks <b>as long as</b> they harm no one else."}]}
 ]},

 t4:{title:"Environment", groups:[
  {sub:"Natural disasters", words:[
   {w:"dam",pos:"n",ipa:"/dæm/",en:"a barrier built to hold back water",vi:"đập (nước)",ex:"The <b>dam</b> provides both flood control and electricity."},
   {w:"levee",pos:"n",ipa:"/ˈlevi/",en:"an earth wall built to prevent a river flooding",vi:"đê",ex:"<b>Levees</b> block the progress of rising water."},
   {w:"flood barrier",pos:"n phr",ipa:"/flʌd ˈbæriə/",en:"a structure built to stop flooding",vi:"rào/đập chắn lũ",ex:"The Thames Barrier is an enormous <b>flood barrier</b>."},
   {w:"sandbagging",pos:"n",ipa:"/ˈsæn(d)bæɡɪŋ/",en:"the use of bags of sand to hold back water",vi:"chắn nước bằng bao cát",ex:"<b>Sandbagging</b> can stop flood water very cheaply."},
   {w:"tsunami",pos:"n",ipa:"/tsuːˈnɑːmi/",en:"a very large, destructive sea wave",vi:"sóng thần",ex:"Even the best levees cannot stop a <b>tsunami</b>."},
   {w:"drought",pos:"n",ipa:"/draʊt/",en:"a long period with little or no rain",vi:"hạn hán",ex:"A prolonged <b>drought</b> can kill crops and livestock."},
   {w:"erosion",pos:"n",ipa:"/ɪˈrəʊʒn/",en:"the gradual wearing away of soil or rock",vi:"sự xói mòn",ex:"Cutting down trees leads to heavy soil <b>erosion</b>."}]},
  {sub:"Climate & ecology", words:[
   {w:"global warming",pos:"n phr",ipa:"/ˌɡləʊbl ˈwɔːmɪŋ/",en:"the gradual rise in the earth's temperature",vi:"sự nóng lên toàn cầu",ex:"Greenhouse gases are the main cause of <b>global warming</b>."},
   {w:"greenhouse gases",pos:"n phr",ipa:"/ˈɡriːnhaʊs ˌɡæsɪz/",en:"gases that trap heat in the atmosphere",vi:"khí nhà kính",ex:"Burning fossil fuels releases <b>greenhouse gases</b>."},
   {w:"fossil fuels",pos:"n phr",ipa:"/ˈfɒsl ˌfjuːəlz/",en:"fuels such as coal, oil and gas from ancient remains",vi:"nhiên liệu hoá thạch",ex:"We must reduce our dependence on <b>fossil fuels</b>."},
   {w:"renewable energy",pos:"n phr",ipa:"/rɪˈnjuːəbl/",en:"energy from sources that do not run out",vi:"năng lượng tái tạo",ex:"Solar and wind are forms of <b>renewable energy</b>."},
   {w:"deforestation",pos:"n",ipa:"/ˌdiːˌfɒrɪˈsteɪʃn/",en:"the cutting down of forests over a large area",vi:"nạn phá rừng",ex:"<b>Deforestation</b> is destroying animal habitats."},
   {w:"biodiversity",pos:"n",ipa:"/ˌbaɪəʊdaɪˈvɜːsəti/",en:"the variety of plant and animal life in an area",vi:"đa dạng sinh học",ex:"Rainforests contain enormous <b>biodiversity</b>."},
   {w:"logging",pos:"n",ipa:"/ˈlɒɡɪŋ/",en:"the activity of cutting down trees for wood",vi:"khai thác gỗ",ex:"Illegal <b>logging</b> threatens the Amazon rainforest."},
   {w:"subsistence farming",pos:"n phr",ipa:"/səbˈsɪstəns/",en:"farming that produces only enough for the farmer's family",vi:"canh tác tự cung tự cấp",ex:"<b>Subsistence farming</b> clears small areas of forest."},
   {w:"livestock",pos:"n",ipa:"/ˈlaɪvstɒk/",en:"animals kept on a farm",vi:"gia súc, vật nuôi",ex:"Cleared land is often used as pasture for <b>livestock</b>."},
   {w:"habitat",pos:"n",ipa:"/ˈhæbɪtæt/",en:"the natural home of an animal or plant",vi:"môi trường sống",ex:"Deforestation destroys the <b>habitat</b> of many species."},
   {w:"ecosystem",pos:"n",ipa:"/ˈiːkəʊsɪstəm/",en:"all the living things in an area and their environment",vi:"hệ sinh thái",ex:"A loss of biodiversity threatens entire <b>ecosystems</b>."}]},
  {sub:"Disaster & mitigation phrases", words:[
   {w:"mitigation",pos:"n",ipa:"/ˌmɪtɪˈɡeɪʃn/",en:"the act of making something less severe",vi:"sự giảm nhẹ (thiệt hại)",ex:"Disaster <b>mitigation</b> reduces the impact of floods."},
   {w:"desalination",pos:"n",ipa:"/ˌdiːˌsælɪˈneɪʃn/",en:"the process of removing salt from sea water",vi:"quá trình khử mặn",ex:"<b>Desalination</b> plants turn sea water into drinking water."},
   {w:"prolonged",pos:"adj",ipa:"/prəˈlɒŋd/",en:"continuing for a long time",vi:"kéo dài",ex:"A <b>prolonged</b> drought put millions at risk of hunger."}]}
 ]},

 t5:{title:"Architecture", groups:[
  {sub:"Buildings & materials", words:[
   {w:"architect",pos:"n",ipa:"/ˈɑːkɪtekt/",en:"a person who designs buildings",vi:"kiến trúc sư",ex:"The <b>architect</b> designed a striking glass tower."},
   {w:"marble",pos:"n",ipa:"/ˈmɑːbl/",en:"a hard, smooth stone used in fine building",vi:"đá cẩm thạch",ex:"The palace floors were made of white <b>marble</b>."},
   {w:"tile",pos:"n",ipa:"/taɪl/",en:"a flat piece of baked clay used to cover surfaces",vi:"gạch / ngói ốp",ex:"The roof is covered with red clay <b>tiles</b>."},
   {w:"insulation",pos:"n",ipa:"/ˌɪnsjuˈleɪʃn/",en:"material used to keep heat inside a building",vi:"vật liệu cách nhiệt",ex:"Straw walls provide excellent <b>insulation</b>."},
   {w:"solar panels",pos:"n phr",ipa:"/ˈsəʊlə ˌpænlz/",en:"devices that turn sunlight into electricity",vi:"tấm pin mặt trời",ex:"<b>Solar panels</b> supply the house with electricity."},
   {w:"durable",pos:"adj",ipa:"/ˈdjʊərəbl/",en:"tough and able to last a long time",vi:"bền, lâu hỏng",ex:"Buildings made from <b>durable</b> materials last for decades."},
   {w:"affordable",pos:"adj",ipa:"/əˈfɔːdəbl/",en:"cheap enough for people to be able to buy",vi:"vừa túi tiền",ex:"Eco-homes must be <b>affordable</b> to become common."},
   {w:"compromise",pos:"n",ipa:"/ˈkɒmprəmaɪz/",en:"an agreement reached by each side giving up something",vi:"sự thoả hiệp",ex:"Green design often requires a <b>compromise</b> on size."}]},
  {sub:"Urban planning", words:[
   {w:"structural engineer",pos:"n phr",ipa:"/ˈstrʌktʃərəl/",en:"a person whose job is to help build an architect's design",vi:"kỹ sư kết cấu",ex:"A <b>structural engineer</b> makes sure the building is safe."},
   {w:"conservation",pos:"n",ipa:"/ˌkɒnsəˈveɪʃn/",en:"the protection of old buildings or the natural world",vi:"sự bảo tồn",ex:"The <b>conservation</b> of ancient buildings matters to many."},
   {w:"skyscraper",pos:"n",ipa:"/ˈskaɪskreɪpə/",en:"a very tall modern building",vi:"toà nhà chọc trời",ex:"<b>Skyscrapers</b> dominate the city's skyline."},
   {w:"outskirts",pos:"n",ipa:"/ˈaʊtskɜːts/",en:"the outer areas of a town or city",vi:"vùng ngoại ô",ex:"The suburbs are found on the <b>outskirts</b> of the city."},
   {w:"green belt",pos:"n phr",ipa:"/ˈɡriːn belt/",en:"an area of protected countryside around a city",vi:"vành đai xanh",ex:"The <b>green belt</b> may not be built on."},
   {w:"urban sprawl",pos:"n phr",ipa:"/ˈɜːbən sprɔːl/",en:"the uncontrolled spread of a city into the countryside",vi:"sự bành trướng đô thị",ex:"<b>Urban sprawl</b> is swallowing valuable farmland."},

      "✗ greater than <u>ordinary hikers</u> (so sánh rủi ro với con người) → <b>than those of ordinary hikers</b>.","✗ greater than <u>ordinary hikers</u> (comparing risks with people) → <b>than those of ordinary hikers</b>.")]},
  {ref:"RK-3", para:"Body 1 · Personal risk",
   quote:"In the UK, the government <mark>protects its population from risk</mark> in a number of areas. It <mark>makes it compulsory to</mark> wear a seatbelt or helmet while on the roads, and <mark>manages risk of disease</mark> by taxing or prohibiting unhealthy foods or cigarettes. It <mark>prevents the spread of disease</mark> by investing in vaccination programmes and health education.",
   phrases:["protect … from risk","make it compulsory to …","by + V-ing (method)","prevent the spread of disease"],
   qs:[Q("hieu","Mỗi câu nêu một biện pháp + cách thực hiện. Cấu trúc nào diễn tả “bằng cách”?","Each sentence gives a measure + the method. Which structure expresses ‘by doing’?",
      "<b>by + V-ing</b>: by taxing or prohibiting…, by investing in… → cách đưa VÍ DỤ CỤ THỂ vào thân bài.","<b>by + -ing</b>: by taxing or prohibiting…, by investing in… → a neat way to add SPECIFIC examples to a body paragraph."),
    Q("y","Đề <i>“The only way to improve road safety is to give much stricter punishments.”</i> — câu “makes it compulsory to wear a seatbelt or helmet” gợi ý phản bác thế nào?","Prompt: <i>“The only way to improve road safety is to give much stricter punishments.”</i> How does ‘makes it compulsory to wear a seatbelt or helmet’ suggest a counter-argument?",
      "Ngoài phạt nặng còn có biện pháp PHÒNG NGỪA: luật bắt buộc đội mũ bảo hiểm, thắt dây an toàn, giáo dục lái xe → “only way” là sai.","Besides harsh punishment there are PREVENTIVE measures: compulsory helmets and seatbelts, driver education → ‘the only way’ is wrong."),
    Q("cum","Viết câu với <b>make it compulsory (for sb) to</b> + <b>by + V-ing</b>.","Write a sentence with <b>make it compulsory (for someone) to</b> + <b>by + -ing</b>.",
      "Vietnam reduced road deaths <b>by making it compulsory for</b> motorcyclists <b>to</b> wear helmets.","Vietnam reduced road deaths <b>by making it compulsory for</b> motorcyclists <b>to</b> wear helmets.",
      "✗ make <u>compulsory</u> people wear → <b>make it compulsory for people to wear</b>.","✗ make <u>compulsory</u> people wear → <b>make it compulsory for people to wear</b>.")]},
  {ref:"RK-4", para:"Body 1 · Professional risk",
   quote:"Workers are <mark>protected from harm</mark> through <mark>government-implemented health and safety regulations</mark> and companies and managers are <mark>liable for</mark> employee death or injury. This <mark>has resulted in</mark> 800 fewer deaths per year in the British workplace.",
   phrases:["be protected from harm","health and safety regulations","be liable for","This has resulted in …"],
   qs:[Q("hieu","Câu 2 đóng vai trò gì trong đoạn? Vì sao nó làm luận điểm thuyết phục hơn?","What role does sentence 2 play in the paragraph? Why does it make the argument stronger?",
      "Đó là BẰNG CHỨNG/KẾT QUẢ cụ thể (số liệu) cho biện pháp ở câu 1. Mẫu: biện pháp → <b>This has resulted in</b> + kết quả đo được.","It is concrete EVIDENCE/RESULT (a statistic) for the measure in sentence 1. Pattern: measure → <b>This has resulted in</b> + a measurable result."),
    Q("y","Đề <i>“In many countries the government has limited working hours by law. Why? Positive or negative?”</i> — dùng ý “regulations protect workers” thế nào?","Prompt: <i>“Many countries have limited working hours by law. Why? Positive or negative?”</i> How can you use the idea that regulations protect workers?",
      "Lý do: bảo vệ người lao động khỏi kiệt sức, tai nạn do mệt mỏi. Đánh giá tích cực: luật giờ làm như luật an toàn lao động → giảm tai nạn và bệnh tật.","Reason: to protect workers from exhaustion and fatigue-related accidents. Positive: like health and safety rules, working-time laws reduce accidents and illness."),
    Q("cum","Viết 2 câu: biện pháp + <b>This has resulted in</b> + kết quả.","Write two sentences: a measure + <b>This has resulted in</b> + a result.",
      "Many cities have introduced speed cameras near schools. <b>This has resulted in</b> a sharp fall in the number of children injured on the roads.","Many cities have introduced speed cameras near schools. <b>This has resulted in</b> a sharp fall in the number of children injured on the roads.",
      "✗ result <u>to</u> / This has resulted <u>that</u> → <b>result in + noun</b>; <b>result from</b> = do nguyên nhân.","✗ result <u>to</u> / This has resulted <u>that</u> → <b>result in + noun</b>; <b>result from</b> = be caused by.")]},
  {ref:"RK-5", para:"Body 1 · Financial risk",
   quote:"<mark>In terms of</mark> financial protection, the UK government gives those in poverty <mark>access to healthcare, food and shelter</mark>. It also tries to <mark>prevent fraud and other financial crime</mark>, while <mark>encouraging economic prudence</mark> through methods such as saving.",
   phrases:["In terms of …","give sb access to …","prevent fraud","encourage economic prudence"],
   qs:[Q("y","Đề <i>“Credit cards are easy to obtain, but many people cannot repay their debts. Do the advantages outweigh the disadvantages?”</i> — ý nào dùng được?","Prompt: <i>“Credit cards are easy to obtain, but many people cannot repay their debts. Do the advantages outweigh the disadvantages?”</i> Which idea can you use?",
      "Nhà nước khuyến khích tiết kiệm và chống gian lận tài chính → thẻ tín dụng khuyến khích chi tiêu vượt khả năng, trái với “economic prudence”.","The state encourages saving and fights financial crime → credit cards encourage spending beyond one’s means, the opposite of ‘economic prudence’."),
    Q("cum","Viết câu mở đầu bằng <b>In terms of …,</b> để chuyển sang khía cạnh mới.","Write a sentence starting with <b>In terms of …,</b> to move to a new aspect.",
      "<b>In terms of</b> personal finance, easy credit can encourage young people to spend money they do not have.","<b>In terms of</b> personal finance, easy credit can encourage young people to spend money they do not have.",
      "✗ <u>In term of</u> / <u>In terms with</u> → <b>In terms of</b>.","✗ <u>In term of</u> / <u>In terms with</u> → <b>In terms of</b>.")]},
  {ref:"RK-6", para:"Body 2 · Objections",
   quote:"<mark>While some people believe</mark> the UK government <mark>acts in the best interests of</mark> their citizens, <mark>others feel</mark> it <mark>infringes on the freedom of the public</mark>. They <mark>object to paying</mark> hefty financial penalties (for example, for riding a motorbike without a helmet), <mark>even though</mark> they may personally accept the risk.",
   phrases:["While some people believe …, others feel …","act in the best interests of","infringe on the freedom of","object to + V-ing"],
   qs:[Q("hieu","Câu 1 là topic sentence của đoạn phản biện. Nó chuyển ý từ đoạn trước bằng kỹ thuật gì?","Sentence 1 is the topic sentence of the counter-argument paragraph. How does it link back to the previous paragraph?",
      "Mệnh đề <b>While some people believe…</b> tóm tắt ý đoạn trước (thông tin cũ) rồi mới nêu ý mới (others feel…). Đây là topic sentence kiểu “given → new”.","The clause <b>While some people believe…</b> sums up the previous paragraph (given information) before introducing the new idea (others feel…) — a ‘given → new’ topic sentence."),
    Q("y","Đề <i>“Governments should ban dangerous sports vs people should be free to choose”</i>: viết topic sentence cho đoạn “tự do lựa chọn”.","Prompt: <i>“ban dangerous sports vs freedom to choose”</i> — write the topic sentence for the ‘freedom’ paragraph.",
      "While some people believe a ban would protect citizens, others feel it would infringe on the freedom of adults to decide which risks they wish to take.","While some people believe a ban would protect citizens, others feel it would infringe on the freedom of adults to decide which risks they wish to take."),
    Q("cum","Viết câu với <b>object to + V-ing</b>.","Write a sentence with <b>object to + -ing</b>.",
      "Many drivers <b>object to paying</b> higher fines when they feel the speed limit is unreasonably low.","Many drivers <b>object to paying</b> higher fines when they feel the speed limit is unreasonably low.",
      "✗ object to <u>pay</u> → <b>object to paying</b> (to là giới từ). Tương tự: look forward to, be used to.","✗ object to <u>pay</u> → <b>object to paying</b> (to is a preposition). Similarly: look forward to, be used to.")]},
  {ref:"RK-7", para:"Body 2 · Objections",
   quote:"People who smoke and eat unhealthy food argue that they are <mark>posing less risk to their health than</mark> horse riders or skiers and it is dangerous sports which should be banned, not food. Businesses complain that health and safety regulations mean that they spend too much time and money <mark>protecting against very low risks</mark>, and that this <mark>has a negative impact on</mark> their business and the national economy.",
   phrases:["pose a risk to","protect against very low risks","have a negative impact on","It is … which should …"],
   qs:[Q("y","Lập luận của doanh nghiệp là gì? Dùng cho đề nào trong Ngân hàng đề?","What is the businesses’ argument? Which bank prompt can use it?",
      "Quy định quá mức tốn thời gian và tiền → hại kinh doanh và kinh tế. Dùng cho đề giới hạn giờ làm việc (mặt tiêu cực) hoặc đề cấm thể thao mạo hiểm (ngành du lịch).","Excessive regulation costs time and money → harms business and the economy. Use it for the working-hours prompt (negative side) or the extreme-sports ban (tourism)."),
    Q("cum","Viết câu với <b>pose a risk to</b> và <b>have a negative impact on</b>.","Write a sentence with <b>pose a risk to</b> and <b>have a negative impact on</b>.",
      "Drivers who use their phones <b>pose a serious risk to</b> other road users, and their behaviour <b>has a negative impact on</b> public confidence in road safety.","Drivers who use their phones <b>pose a serious risk to</b> other road users, and their behaviour <b>has a negative impact on</b> public confidence in road safety.",
      "✗ <u>make</u> a risk / negative impact <u>to</u> → <b>pose / take a risk</b>; <b>an impact on</b>.","✗ <u>make</u> a risk / a negative impact <u>to</u> → <b>pose / take a risk</b>; <b>an impact on</b>.")]},
  {ref:"RK-8", para:"Conclusion",
   quote:"This can reduce accidents, disease and crime, and <mark>cater for the basic needs of all members of society</mark>. <mark>Conversely, however,</mark> <mark>over-protective legislation</mark> can <mark>limit individual freedom</mark> and <mark>cause resentment</mark>. It can also suggest that people do not have to <mark>be responsible for their own actions</mark>.",
   phrases:["cater for the basic needs of","over-protective legislation","limit individual freedom","cause resentment","be responsible for their own actions"],
   qs:[Q("y","Đề unit 2 <i>“If children are never exposed to risk, they will never be able to cope with risk”</i>: ý nào trong đoạn có thể chuyển sang chủ đề cha mẹ – con cái?","Unit task 2 <i>“If children are never exposed to risk…”</i>: which idea here can be transferred to parents and children?",
      "“Over-protective” → cha mẹ bảo bọc quá mức khiến trẻ không học cách chịu trách nhiệm với hành động của mình (“do not have to be responsible for their own actions”).","‘Over-protective’ → over-protective parents stop children learning to take responsibility for their own actions."),
    Q("cum","Viết câu với <b>over-protective</b> + <b>be responsible for</b>.","Write a sentence with <b>over-protective</b> + <b>be responsible for</b>.",
      "<b>Over-protective</b> parents may prevent their children from learning to <b>be responsible for</b> their own decisions.","<b>Over-protective</b> parents may prevent their children from learning to <b>be responsible for</b> their own decisions.",
      "✗ responsible <u>about / with</u> → <b>responsible for</b>.","✗ responsible <u>about / with</u> → <b>responsible for</b>.")]},
  {ref:"RK-9", para:"Conclusion · Opinion",
   quote:"<mark>In my opinion,</mark> a country with <mark>tight controls</mark> provides a pleasant and safe environment. However, legislation needs to be <mark>carefully monitored</mark> to ensure it is appropriate, up-to-date and <mark>not excessively restrictive</mark>.",
   phrases:["In my opinion, …","tight controls","be carefully monitored","not excessively restrictive"],
   qs:[Q("hieu","Khác với kết luận ở Unit 1 và 2, kết luận này CÓ nêu quan điểm. Quan điểm đó là gì, và nó có điều kiện gì?","Unlike the conclusions in Units 1 and 2, this one DOES give an opinion. What is it, and what condition is attached?",
      "Ủng hộ kiểm soát chặt (tight controls) NHƯNG luật phải được giám sát để không quá hạn chế → quan điểm rõ ràng + điều kiện (qualified opinion) — mẫu tốt cho band 7+.","It supports tight controls BUT says laws must be monitored so they are not too restrictive → a clear position with a condition (a qualified opinion) — a good band-7+ model."),
    Q("cum","Viết câu quan điểm có điều kiện dùng <b>provided that</b> cho đề cấm thể thao mạo hiểm.","Write a qualified opinion using <b>provided that</b> for the extreme-sports prompt.",
      "In my opinion, adults should be free to take part in extreme sports, <b>provided that</b> they follow strict safety rules and pay for their own insurance.","In my opinion, adults should be free to take part in extreme sports, <b>provided that</b> they follow strict safety rules and pay for their own insurance.",
      "✗ provided that they <u>will follow</u> → <b>provided that they follow</b> (không dùng will sau provided that / as long as).","✗ provided that they <u>will follow</u> → <b>provided that they follow</b> (no will after provided that / as long as).")]}
 ]},
 {id:"quiz", title:"Reading 1 · Are you a risk-taker, or are you risk-averse?", sub:bi("Quiz — từ vựng tự nhiên về rủi ro","A quiz — natural language about risk"), cards:[
  {ref:"QZ-1", para:"Quiz language",
   quote:"Do our quiz to find out whether you love <mark>living on the edge of danger</mark>, or whether you would rather be safe at home! […] There’s nothing wrong with <mark>cutting it fine</mark>. […] You prefer learning by <mark>trial and error</mark>. […] You <mark>play it safe</mark> and go with what you know.",
   phrases:["risk-taker / risk-averse","live on the edge","cut it fine","trial and error","play it safe"],
   qs:[Q("hieu","Cụm nào là văn nói, cụm nào dùng được trong IELTS Writing? Đối chiếu với các cụm trang trọng ở Exercise 6.","Which phrases are informal, and which can be used in IELTS Writing? Compare them with the formal phrases in Exercise 6.",
      "Văn nói: live on the edge, cut it fine, play it safe (dùng hạn chế). Dùng được: risk-averse, trial and error. Trang trọng tương ứng: allowing contingency time, experimentation, a risk-free pastime.","Informal: live on the edge, cut it fine, play it safe (use sparingly). Usable: risk-averse, trial and error. Formal equivalents: allowing contingency time, experimentation, a risk-free pastime."),
    Q("cum","Viết câu học thuật với <b>risk-averse</b> và <b>trial and error</b> về việc học của trẻ em.","Write an academic sentence using <b>risk-averse</b> and <b>trial and error</b> about children’s learning.",
      "Children who are raised by <b>risk-averse</b> parents have fewer chances to learn by <b>trial and error</b>.","Children who are raised by <b>risk-averse</b> parents have fewer chances to learn by <b>trial and error</b>.",
      "✗ <u>risk-averse</u> → không phải “avoid risk”; ✗ learn by <u>trial and errors</u> → <b>trial and error</b>.","✗ learn by <u>trials and errors</u> → <b>trial and error</b> (fixed phrase).")]}
 ]},
 {id:"skills", title:bi("Kỹ năng · Cause & effect + Conditional language","Skills texts · Cause & effect + Conditional language"), sub:bi("Mẫu câu trong tài liệu","Model sentences from the course"), cards:[
  {ref:"CE-1", para:"Cause and effect",
   quote:"Taking risks <mark>results in</mark> greater rewards. Taking risks <mark>leads to</mark> greater rewards. […] Maximizing profit is encouraged in investment banking. <mark>As a result of this</mark>, some bankers take on too much risk in their portfolio. […] <mark>Consequently</mark>, some bankers take on too much risk in their portfolio.",
   phrases:["result in + noun","lead to + noun","As a result of this, …","Consequently, …"],
   qs:[Q("hieu","Phân biệt: <b>result in</b> vs <b>result from</b>; <b>As a result,</b> vs <b>As a result of</b>.","Distinguish <b>result in</b> vs <b>result from</b>; <b>As a result,</b> vs <b>As a result of</b>.",
      "A result in B (A là nguyên nhân); B results from A. <b>As a result,</b> + mệnh đề; <b>As a result of</b> + danh từ / this.","A results in B (A is the cause); B results from A. <b>As a result,</b> + clause; <b>As a result of</b> + noun / this."),
    Q("cum","Viết chuỗi 2 câu về thể thao mạo hiểm dùng <b>leads to</b> và <b>Consequently,</b>","Write a two-sentence chain about extreme sports using <b>leads to</b> and <b>Consequently,</b>",
      "Inexperience often <b>leads to</b> serious accidents in sports such as paragliding. <b>Consequently,</b> some countries require participants to complete a training course first.","Inexperience often <b>leads to</b> serious accidents in sports such as paragliding. <b>Consequently,</b> some countries require participants to complete a training course first.",
      "✗ <u>lead to increase</u> → <b>lead to an increase in</b>.","✗ <u>lead to increase</u> → <b>lead to an increase in</b>.")]},
  {ref:"CD-1", para:"Conditional language",
   quote:"<mark>Provided that</mark> they do not attempt to control too much of our personal lives, governments should <mark>legislate against</mark> extremely <mark>hazardous activities</mark>. […] Governments should legislate against extremely hazardous activities <mark>as long as</mark> they do not attempt to control too much of our personal lives. […] <mark>On condition that</mark> …",
   phrases:["Provided that …","As long as …","On condition that …","legislate against hazardous activities"],
   qs:[Q("y","Vì sao câu điều kiện giúp quan điểm “thuyết phục” hơn trong đề Discussion?","Why does a conditional make your opinion more convincing in a Discussion essay?",
      "Nó cho thấy bạn đã cân nhắc cả hai phía: đồng ý NHƯNG có giới hạn → quan điểm cân bằng, tránh khẳng định tuyệt đối.","It shows you have weighed both sides: you agree BUT within limits → a balanced, qualified position instead of an absolute claim."),
    Q("cum","Viết câu quan điểm cho đề “parents supervise vs children’s freedom” dùng <b>as long as</b>.","Write an opinion for ‘parents supervise vs children’s freedom’ using <b>as long as</b>.",
      "Children should be given more freedom to explore, <b>as long as</b> their parents know where they are and teach them basic safety rules.","Children should be given more freedom to explore, <b>as long as</b> their parents know where they are and teach them basic safety rules.",
      "✗ <u>As long as</u> they <u>will</u> know → <b>As long as they know</b>.","✗ <u>As long as</u> they <u>will</u> know → <b>As long as they know</b>.")]}
 ]}
 ]
}};

ERRCODES["G-CE"]={vi:"Cấu trúc nguyên nhân – kết quả",en:"Cause–effect structures"};
ERRCODES["G-COND"]={vi:"Câu điều kiện (if / provided that / unless)",en:"Conditionals (if / provided that / unless)"};
ERRCODES["G-CONC"]={vi:"Nhượng bộ (Despite / Although / However)",en:"Concession (Despite / Although / However)"};
const fx=(c,w,a,vi,en)=>({t:"fix",c,w,a,r:bi(vi,en)});
const mc=(c,q,o,k,vi,en,qvi)=>({t:"mcq",c,q:qvi?bi(qvi,q):q,o,k,r:bi(vi,en)});
const CLINIC = { t1:{
 intro:{vi:"Các câu dưới đây dựa trên <b>lỗi thật của học sinh Việt Nam</b> khi viết về rủi ro, luật lệ và tự do cá nhân. Trọng tâm unit (theo tài liệu): <b>nguyên nhân – kết quả</b> và <b>câu điều kiện trang trọng</b> (provided that, as long as, on condition that). Ôn lại lỗi Unit 1–2: mạo từ, nhượng bộ, comma splice.",
        en:"These sentences are based on <b>real learners’ errors</b> when writing about risk, laws and personal freedom. Unit focus (from the course): <b>cause and effect</b> and <b>formal conditionals</b> (provided that, as long as, on condition that). Review from Units 1–2: articles, concession, comma splices."},
 groups:[
 {id:"gra", icon:"🧩", title:{vi:"A · Ngữ pháp câu (GRA) — nguyên nhân–kết quả & điều kiện",en:"A · Sentence grammar (GRA) — cause–effect & conditionals"},
  lead:{vi:"Mục tiêu: 0 lỗi G-CE và G-COND trong bài tiếp theo.",en:"Target: zero G-CE and G-COND errors in your next essay."},
  items:[
  fx("G-CE","Taking extreme risks can lead to people get injured.","Taking extreme risks can <b>lead to serious injuries</b>. / … can lead to people <b>getting</b> injured.","<b>lead to / result in + danh từ / V-ing</b> (to, in là giới từ).","<b>lead to / result in + noun / -ing</b> (to and in are prepositions here)."),
  fx("G-CE","Strict safety rules have resulted to a fall in workplace deaths.","Strict safety rules have <b>resulted in</b> a fall in workplace deaths.","<b>result in</b> + kết quả; <b>result from</b> + nguyên nhân. ✗ result to.","<b>result in</b> + effect; <b>result from</b> + cause. ✗ result to."),
  fx("G-CE","Many accidents result in careless driving.","Many accidents <b>result from</b> careless driving. / Careless driving <b>results in</b> many accidents.","Đảo chiều: nguyên nhân <b>results in</b> kết quả; kết quả <b>results from</b> nguyên nhân.","Direction matters: cause <b>results in</b> effect; effect <b>results from</b> cause."),
  fx("G-CE","Because of people do not wear helmets, many of them die in road accidents.","<b>Because</b> people do not wear helmets, many of them die in road accidents. / <b>Because of</b> the failure to wear helmets, …","<b>Because + mệnh đề</b>; <b>Because of / Due to + danh từ</b>.","<b>Because + clause</b>; <b>Because of / Due to + noun</b>."),
  fx("G-CE","As a result of banks took too many risks, the economy collapsed.","<b>As a result of</b> excessive risk-taking by banks, the economy collapsed. / Banks took too many risks. <b>As a result,</b> the economy collapsed.","<b>As a result of + danh từ</b>; <b>As a result, + mệnh đề</b> (sau dấu chấm).","<b>As a result of + noun</b>; <b>As a result, + clause</b> (after a full stop)."),
  fx("G-CE","Smoking causes to many diseases.","Smoking <b>causes</b> many diseases. / Smoking <b>causes people to develop</b> many diseases.","<b>cause + N</b> hoặc <b>cause + O + to V</b>. ✗ cause to + N.","<b>cause + noun</b> or <b>cause + object + to do</b>. ✗ cause to + noun."),
  fx("G-COND","If the government will ban extreme sports, many people will lose their jobs.","If the government <b>bans</b> extreme sports, many people will lose their jobs.","Mệnh đề <i>if</i> (loại 1) dùng <b>hiện tại đơn</b>, không dùng will.","In a first conditional, the <i>if</i>-clause takes the <b>present simple</b>, not will."),
  fx("G-COND","Provided that people will follow safety rules, extreme sports are acceptable.","<b>Provided that</b> people <b>follow</b> safety rules, extreme sports are acceptable.","Sau <b>provided that / as long as / on condition that</b> → hiện tại đơn, không will.","After <b>provided that / as long as / on condition that</b> → present simple, no will."),
  fx("G-COND","Unless parents do not supervise their children, accidents may happen.","<b>Unless</b> parents supervise their children, accidents may happen. / <b>If</b> parents do <b>not</b> supervise …","<b>Unless</b> = if … not → không thêm <i>not</i> nữa.","<b>Unless</b> already means if … not → do not add another <i>not</i>."),
  fx("G-COND","If governments controlled every risk, people would never learnt to be responsible.","If governments controlled every risk, people would never <b>learn</b> to be responsible.","Điều kiện loại 2: <b>would + V nguyên mẫu</b>.","Second conditional: <b>would + base verb</b>."),
  fx("G-STR","The government should make compulsory people wear helmets.","The government should <b>make it compulsory for people to wear</b> helmets.","Cấu trúc trong bài đọc RK-3: <b>make it compulsory (for sb) to V</b>.","The pattern from RK-3: <b>make it compulsory (for someone) to do</b>."),
  fx("G-VF","Many people object to pay heavy fines for minor offences.","Many people <b>object to paying</b> heavy fines for minor offences.","<b>object to + V-ing</b> (to là giới từ) — nguyên văn RK-6.","<b>object to + -ing</b> (to is a preposition) — from RK-6."),
  fx("G-ART","The government should protect the citizens from the risk.","<b>Governments</b> should protect <b>citizens</b> from <b>risk</b>. / The government should protect <b>its citizens</b> from <b>unnecessary risks</b>.","Ôn Unit 2: nói chung → số nhiều/không đếm được không mạo từ; nói về một chính phủ cụ thể → the government + its citizens.","Review Unit 2: general statements → plural / uncountable with no article; a specific government → the government + its citizens."),
  fx("G-RUN","Extreme sports are dangerous, however they are very popular.","Extreme sports are dangerous<b>; however,</b> they are very popular. / <b>Although</b> extreme sports are dangerous, they …","Ôn Unit 2: <b>However</b> không nối hai mệnh đề bằng dấu phẩy.","Review Unit 2: <b>However</b> cannot join two clauses with a comma."),
  mc("G-CE","Excessive risk-taking ___ chaos.",["may lead","may result to","may lead to","may cause to"],2,"<b>lead to + N</b> — Exercise 1 trong tài liệu: “Excessive risk-taking may lead to chaos.”","<b>lead to + noun</b> — course Exercise 1: “Excessive risk-taking may lead to chaos.”"),
  mc("G-COND","Individuals should be allowed to do whatever they like ___ they do not harm others.",["unless","provided that","even though","because of"],1,"Điều kiện cho phép → <b>provided that / as long as</b>. <i>unless</i> = nếu không; <i>even though</i> = nhượng bộ.","A condition → <b>provided that / as long as</b>. <i>unless</i> = if not; <i>even though</i> = concession."),
  mc("G-CE","Choose the CORRECT sentence:",["Due to the roads are crowded, accidents are common.","Due to crowded roads, accidents are common.","Due to crowded roads, so accidents are common.","Crowded roads are due to accidents are common."],1,"<b>Due to + danh từ</b>, không đi với mệnh đề, không thêm <i>so</i>.","<b>Due to + noun</b>, not a clause, and no extra <i>so</i>.","Chọn câu ĐÚNG:")
 ]},
 {id:"lex", icon:"🎯", title:{vi:"B · Chọn từ (LR) — rủi ro, luật lệ & tự do",en:"B · Word choice (LR) — risk, law & freedom"},
  lead:{vi:"Collocation và từ loại hay sai khi viết về rủi ro và luật lệ.",en:"Collocations and word forms often misused when writing about risk and law."},
  items:[
  mc("W-COL","Some people enjoy ___ risks because it makes them feel alive.",["making","doing","taking","playing"],2,"<b>take a risk / take risks</b>; <i>pose a risk to</i> (gây rủi ro cho). ✗ make a risk.","<b>take a risk / take risks</b>; <i>pose a risk to</i> (create a danger for). ✗ make a risk."),
  mc("W-COL","Drunk drivers ___ a serious risk to other road users.",["take","pose","do","give"],1,"<b>pose a risk / threat to</b> (RK-7).","<b>pose a risk / threat to</b> (RK-7)."),
  mc("W-PREP","Children who are protected ___ every danger may not learn to cope with risk.",["of","against / from","with","to"],1,"<b>protect sb from / against</b> (RK-3, RK-4).","<b>protect someone from / against</b> (RK-3, RK-4)."),
  mc("W-COL","Some countries completely ___ the sale of guns.",["restrict","ban","grant","authorize"],1,"<b>ban</b> = cấm hoàn toàn; <i>restrict / limit / curb</i> = hạn chế (Language of freedom).","<b>ban</b> = forbid completely; <i>restrict / limit / curb</i> = control (Language of freedom)."),
  mc("W-COL","If countries ___ people the right to vote, they should use their vote carefully.",["grant","permit","legalize","curb"],0,"<b>grant sb a right</b>; <i>permit sb to do</i>; <i>legalize sth</i>.","<b>grant someone a right</b>; <i>permit someone to do</i>; <i>legalize something</i>."),
  mc("W-FORM","Extreme sports are popular, but they can be extremely ___.",["danger","dangerous","dangerously","endanger"],1,"Sau <i>be</i> → tính từ <b>dangerous</b>. (danger n, endanger v)","After <i>be</i> → adjective <b>dangerous</b>. (danger n, endanger v)"),
  mc("W-FORM","Companies must provide ___ equipment for every worker.",["safe","safety","safely","saved"],1,"<b>safety equipment / safety regulations</b> (danh từ làm bổ ngữ). <i>a safe place</i> (tính từ).","<b>safety equipment / safety regulations</b> (noun modifier). <i>a safe place</i> (adjective)."),
  mc("W-COL","Over-protective laws can ___ individual freedom.",["low","limit","reduce down","cut"],1,"<b>limit / restrict / infringe on individual freedom</b> (RK-6, RK-8).","<b>limit / restrict / infringe on individual freedom</b> (RK-6, RK-8)."),
  mc("W-PREP","Companies are ___ for the safety of their employees.",["responsible to","responsible for","liable to","responsibility of"],1,"<b>be responsible / liable for</b> (RK-4, RK-8).","<b>be responsible / liable for</b> (RK-4, RK-8)."),
  mc("W-REG","Choose the most ACADEMIC version:",["Lots of people think the government is too bossy.","Many people feel that the government infringes on the freedom of the public.","People hate it when the government tells them what to do.","The government always messes with people’s lives."],1,"Nguyên văn RK-6. Tránh <i>lots of, bossy, hate, messes with</i>.","Taken from RK-6. Avoid <i>lots of, bossy, hate, messes with</i>.","Chọn câu mang văn phong HỌC THUẬT nhất:"),
  fx("W-COL","The government should make more laws to stop the risk of people.","The government should <b>introduce new legislation</b> to <b>reduce the risks people face</b>.","<b>introduce / pass legislation</b>; <b>reduce / minimize risks</b>; <b>legislation</b> không đếm được (✗ legislations).","<b>introduce / pass legislation</b>; <b>reduce / minimize risks</b>; <b>legislation</b> is uncountable (✗ legislations)."),
  fx("W-GEN","Extreme sports always kill people, so they must be banned.","Extreme sports <b>can result in</b> serious injuries <b>or even death</b>, so <b>some</b> people argue that they should be banned.","Tránh khẳng định tuyệt đối (always, everyone) → can, may, some, tend to.","Avoid absolute claims (always, everyone) → can, may, some, tend to."),

 ]},
 {id:"org", icon:"🧭", title:{vi:"C · Sắp xếp ý (CC + TR) — “for and against + opinion”",en:"C · Organising ideas (CC + TR) — ‘for and against + opinion’"},
  lead:{vi:"Dạng đề chính của unit: nêu lý lẽ ủng hộ, phản đối và quan điểm riêng.",en:"The unit’s main task type: arguments for, arguments against, and your own opinion."},
  items:[
  mc("O-POS","Prompt: “Taking greater risks leads to larger rewards. Discuss the arguments for and against and give your opinion.” Which thesis is best?",["“This essay will discuss risks.”","“Risks have good and bad sides.”","“Although some risks bring great rewards, I believe that only calculated risks are worth taking.”","“I totally agree because my friend got rich by investing.”"],2,"Cần: nhắc cả 2 phía + quan điểm rõ (có thể có điều kiện). (d): cá nhân, một chiều.","You need both sides + a clear (possibly qualified) opinion. (d) is personal and one-sided.","Đề: “Taking greater risks leads to larger rewards. Discuss the arguments for and against and give your opinion.” Thesis nào tốt nhất?"),
  mc("O-TS","Which is the best TOPIC SENTENCE for the ‘arguments against’ paragraph?",["My uncle lost all his money on the stock market.","On the other hand, taking excessive risks can also lead to serious personal and financial losses.","There are many risks.","51% of new businesses fail within five years."],1,"Topic sentence: khái quát, có tín hiệu chuyển ý (On the other hand), không chứa ví dụ/số liệu.","A topic sentence is general, signals the change (On the other hand) and contains no examples or statistics.","Topic sentence nào tốt nhất cho đoạn “arguments against”?"),
  {t:"order", c:"O-ORD", q:bi("Sắp xếp đoạn “arguments for” (TS → Explanation → Example → Result):","Put the ‘arguments for’ paragraph in order (TS → Explanation → Example → Result):"),
   s:["For example, many successful companies, such as small technology start-ups, began when their founders left secure jobs to follow an uncertain idea.",
      "Those who support this view argue that significant rewards are rarely achieved without taking some risks.",
      "As a result, people who are never willing to take a chance may miss opportunities for personal and professional growth.",
      "This is because new opportunities usually involve uncertainty, whether it is changing career, investing money or moving abroad."], k:"bdac",
   r:bi("b = topic sentence → d = giải thích (This is because…) → a = ví dụ → c = kết quả (As a result…).","b = topic sentence → d = explanation (This is because…) → a = example → c = result (As a result…).")},
  mc("O-LINK","“Some people believe the government acts in the best interests of its citizens. ___, others feel it infringes on their freedom.”",["Similarly","However / On the other hand","Therefore","For example"],1,"Hai quan điểm đối lập → <b>However / On the other hand</b>. Hoặc gộp: <b>While</b> some people believe…, others feel… (RK-6).","Two opposing views → <b>However / On the other hand</b>. Or combine: <b>While</b> some people believe…, others feel… (RK-6)."),
  mc("O-LINK","“Banks were encouraged to maximize profit. ___, some bankers took on too much risk.”",["Consequently","Nevertheless","In contrast","Likewise"],0,"Kết quả → <b>Consequently / As a result of this / Because of this</b> (Cause and effect).","Result → <b>Consequently / As a result of this / Because of this</b> (Cause and effect)."),
  mc("O-REL","Which sentence is IRRELEVANT in a paragraph arguing that extreme sports should be banned? (a) They frequently result in serious injuries. (b) Rescue operations are expensive and put rescuers at risk. (c) Football is the most popular sport in the world. (d) Hospital costs are often paid by taxpayers.",["(a)","(b)","(c)","(d)"],2,"(c) không liên quan đến lý do cấm thể thao mạo hiểm.","(c) has nothing to do with reasons for banning extreme sports.","Câu nào LẠC ĐỀ trong đoạn ủng hộ việc cấm thể thao mạo hiểm? (a) They frequently result in serious injuries. (b) Rescue operations are expensive and put rescuers at risk. (c) Football is the most popular sport in the world. (d) Hospital costs are often paid by taxpayers."),
  mc("O-POS","Prompt (Two-part): “Most released prisoners commit crimes again. Why is this? What can be done?” Which plan is correct?",["BP1: advantages of prison · BP2: disadvantages","BP1: reasons for reoffending · BP2: solutions that match those reasons","BP1 + BP2: solutions only","BP1: types of crime · BP2: my opinion on prison"],1,"Mỗi câu hỏi → 1 đoạn; giải pháp khớp nguyên nhân.","One question → one paragraph; the solutions must match the causes.","Đề (Two-part): “Most released prisoners commit crimes again. Why is this? What can be done?” Dàn ý nào đúng?"),
  fx("O-POS","In conclusion, risks have advantages and disadvantages, so everyone should decide for themselves.","In conclusion, although taking risks can bring considerable rewards, I believe that only <b>calculated</b> risks are worth taking, <b>provided that</b> people understand the possible consequences.","Kết luận phải có QUAN ĐIỂM rõ — mẫu RK-9: “In my opinion… However, …” (quan điểm + điều kiện).","The conclusion needs a CLEAR opinion — model RK-9: “In my opinion… However, …” (opinion + condition)."),
  fx("O-LINK","Safety rules protect workers. Safety rules are expensive. Because safety rules are expensive, safety rules annoy many businesses.","Safety rules protect workers, but <b>they</b> are expensive. <b>This cost</b> explains why <b>such regulations</b> annoy many businesses.","Dùng tham chiếu (they, this + noun, such + noun) để tránh lặp.","Use reference words (they, this + noun, such + noun) to avoid repetition.")
 ]}
 ]
