  outline:[
   {h:"Introduction", t:"Background: people differ — risk-takers vs risk-averse (QZ-1) + thesis: calculated risks only (CD-1)."},
   {h:bi("Body 1 · Lý lẽ ủng hộ","Body 1 · Arguments for"), t:"Personal: trial and error builds confidence (QZ-1). Professional: changing career / starting a business. Financial: investing can maximize profit. Taking risks results in greater rewards (CE-1)."},
   {h:bi("Body 2 · Lý lẽ phản đối","Body 2 · Arguments against"), t:"Get-rich-quick schemes, spending on credit (Practice ex.); excessive risk-taking may lead to chaos (CE-1); banks took on too much risk → consequently… (CE-1); not wearing a seatbelt / protective equipment."},
   {h:"Conclusion", t:"In my opinion… provided that the risks are calculated (RK-9, CD-1)."}
  ],
  build:[bq("Viết thesis có điều kiện dùng <b>provided that</b>.","Write a qualified thesis using <b>provided that</b>.","I believe that taking risks can lead to greater rewards, provided that the risks are carefully calculated rather than reckless."),
   bq("Viết câu cho Body 2 dùng <b>may lead to</b> và <b>Consequently,</b>","Write a Body 2 sentence pair using <b>may lead to</b> and <b>Consequently,</b>","Investing in get-rich-quick schemes may lead to the loss of a lifetime’s savings. Consequently, many families are left in serious debt."),
   bq("Viết ví dụ nghề nghiệp dùng <b>results in</b>.","Write a professional example using <b>results in</b>.","Leaving a secure job to start a company is risky, but for some entrepreneurs it results in far greater financial and personal satisfaction.")],
  model:"On the other hand, taking greater risks does not always lead to larger rewards, and in many cases it results in serious losses. In financial terms, people who invest their savings in get-rich-quick schemes or spend heavily on credit often end up in debt rather than becoming wealthy. The same is true at an institutional level: when banks were encouraged to maximize profit, some took on far too much risk, and the consequences affected millions of ordinary savers. Physical risks can be even more costly, since a moment of carelessness, such as not wearing a seatbelt, may lead to injuries that can never be reversed. Taking risks, therefore, only makes sense when the possible losses have been carefully considered.",
  focus:["G-CE","G-COND","O-POS","W-COL"]},

 {id:"gp1", ty:"dis", date:"13/01/2024 · 28/04/2025 · 16/01/2026 · 16/07/2026",
  p:"Some people think that the government should ban dangerous sports, while others think people should be free to do any sports or activities they choose. Discuss both views and give your opinion.",
  an:an("government · ban · dangerous sports · free to choose",
   "<b>ban</b> (cấm hoàn toàn — khác với “restrict / regulate”) · <b>dangerous sports</b> (không phải thể thao nói chung)","<b>ban</b> (forbid completely — not ‘restrict / regulate’) · <b>dangerous sports</b> (not sport in general)",
   "Discuss both views + opinion.","Discuss both views + give your opinion.",
   "Viết về lợi ích của thể thao nói chung; không phân biệt “ban” và “regulate”; quên ý kiến.","Writing about the benefits of sport in general; not distinguishing ‘ban’ from ‘regulate’; forgetting your opinion."),
  pos:bi("<b>Không nên cấm, nên quản lý</b> — cho phép “provided that” có huấn luyện, thiết bị và bảo hiểm.","<b>Regulate rather than ban</b> — allow dangerous sports “provided that” there is training, equipment and insurance."),
  outline:[
   {h:"Introduction", t:"Governments see it as their responsibility to control risk (RK-1) + both views + opinion."},
   {h:bi("Body 1 · Ủng hộ cấm","Body 1 · For a ban"), t:"Serious injuries/deaths; rescue costs and hospital bills paid by taxpayers; risk to rescuers; protecting the public from risk (RK-3)."},
   {h:bi("Body 2 · Tự do lựa chọn + ý kiến","Body 2 · Freedom + opinion"), t:"While some believe a ban protects citizens, others feel it infringes on freedom (RK-6); adults accept the risk; benefits: confidence, tourism; over-protective legislation causes resentment (RK-8) → my view: regulate (CD-1)."},
   {h:"Conclusion", t:"Opinion + condition (RK-9)."}
  ],
  build:[bq("Viết thesis dùng <b>Rather than …, …</b> + <b>provided that</b>.","Write a thesis using <b>Rather than …, …</b> + <b>provided that</b>.","Rather than banning dangerous sports, I believe governments should allow them, provided that participants are properly trained and insured."),
   bq("Viết topic sentence Body 2 theo mẫu RK-6.","Write the Body 2 topic sentence following RK-6.","While some people believe a ban would protect citizens, others feel it would infringe on the freedom of adults to choose their own activities."),
   bq("Viết câu hệ quả dùng <b>pose a risk to</b> và <b>result in</b>.","Write a consequence sentence using <b>pose a risk to</b> and <b>result in</b>.","Mountain rescues also pose a risk to rescue workers and can result in enormous costs for the public.")],
  model:"Those who support a ban argue that dangerous sports place an unfair burden on the rest of society. Activities such as base jumping and free climbing frequently result in serious injuries or even death, and when accidents happen, rescue teams must often risk their own lives to reach the victims. In addition, the cost of rescue operations and long hospital stays is usually paid by taxpayers rather than by the participants themselves. From this perspective, a government that sees it as its responsibility to protect citizens from avoidable harm would be justified in prohibiting the most hazardous activities, in the same way that it makes it compulsory to wear a seatbelt.",
  focus:["G-COND","W-COL","O-POS","G-CE"]},

 {id:"gp2", ty:"op", date:"19/08/2024",
  p:"The only way to improve safety on our roads is to give much stricter punishments for driving offences. To what extent do you agree or disagree?",
  an:an("only way · improve road safety · much stricter punishments · driving offences",
   "<b>the only way</b> — từ tuyệt đối, dễ phản bác · <b>much stricter</b> (phạt nặng hơn nhiều)","<b>the only way</b> — an absolute claim that is easy to challenge · <b>much stricter</b> (far harsher)",
   "To what extent…? → mức độ đồng ý rõ ràng.","To what extent…? → a clear level of agreement.",
   "Bỏ qua chữ <b>only</b>; chỉ viết về lợi ích của phạt nặng mà không đề cập biện pháp khác.","Ignoring the word <b>only</b>; describing the benefits of punishment without mentioning other measures."),
  pos:bi("<b>Phần lớn không đồng ý</b> — phạt nặng giúp răn đe nhưng không phải cách DUY NHẤT; cần giáo dục, hạ tầng, công nghệ.","<b>Largely disagree</b> — harsher penalties deter, but they are not the ONLY way; education, infrastructure and technology matter too."),
  outline:[
   {h:"Introduction", t:"Paraphrase + largely disagree (the word ‘only’)."},
   {h:bi("Body 1 · Nhượng bộ: phạt nặng có tác dụng","Body 1 · Concession: punishment works"), t:"Admittedly, heavy fines deter speeding and drink-driving; this has resulted in… (RK-4 pattern)."},
   {h:bi("Body 2 · Biện pháp khác","Body 2 · Other measures"), t:"Prevention: making it compulsory to wear helmets/seatbelts (RK-3); driver education; speed cameras; safer road design → many accidents result from lack of skill, not lack of fear (CE-1)."},
   {h:"Conclusion", t:"Restate: a combination of measures."}
  ],
  build:[bq("Viết thesis phản bác chữ “only”.","Write a thesis that challenges the word ‘only’.","Although stricter punishments can discourage dangerous driving, I disagree that they are the only way to make roads safer."),
   bq("Viết câu dùng <b>result from</b> để chỉ ra nguyên nhân tai nạn.","Write a sentence with <b>result from</b> to show a cause of accidents.","Many accidents result from a lack of driving skill rather than a deliberate decision to break the law."),
   bq("Viết câu dùng <b>by making it compulsory for … to …</b>.","Write a sentence with <b>by making it compulsory for … to …</b>.","Governments can also save lives by making it compulsory for all motorcyclists to wear helmets.")],
  model:"However, harsh punishment is far from the only way to make roads safer. Many accidents result from a lack of skill or experience rather than a deliberate decision to break the law, and no fine can teach a new driver how to react on a wet road. Better training and stricter driving tests would therefore address one of the root causes of accidents. Governments can also reduce deaths through preventive measures: Vietnam, for example, cut the number of fatal motorcycle accidents by making it compulsory for riders to wear helmets. In addition, speed cameras, clearer road signs and safer junctions protect road users whether or not drivers are afraid of being punished.",
  focus:["G-CE","G-STR","O-POS","W-GEN"]},

 {id:"gp3", ty:"dis", date:"Writing Studio · Unit task 2",
  p:"‘If children are never exposed to risk, they will never be able to cope with risk.’ Give reasons for and against this statement and give your opinion.",
  an:an("children · never exposed to risk · never able to cope with risk",
   "<b>never … never</b> (khẳng định tuyệt đối) · <b>cope with</b> (đối phó, xử lý)","<b>never … never</b> (an absolute claim) · <b>cope with</b> (deal with)",
   "Reasons for and against + opinion.","Reasons for and against + your opinion.",
   "Chỉ viết một phía; không nêu bằng chứng (Evidence 1–3 theo dàn ý tài liệu).","Writing one side only; giving no evidence (Evidence 1–3 in the course plan)."),
  pos:bi("<b>Đồng ý phần lớn</b> — trẻ cần trải nghiệm rủi ro nhỏ, phù hợp lứa tuổi, “as long as” có hướng dẫn.","<b>Largely agree</b> — children need small, age-appropriate risks, “as long as” adults guide them."),
  outline:[
   {h:"Introduction", t:"Paraphrase + largely agree."},
   {h:bi("Body 1 · Lý lẽ ủng hộ (trẻ cần rủi ro)","Body 1 · Arguments for (children need some risk)"), t:"Evidence 1: learning by trial and error (QZ-1). Evidence 2: confidence and judgement. Evidence 3: over-protection → not responsible for their own actions (RK-8)."},
   {h:bi("Body 2 · Lý lẽ phản đối (bảo vệ trẻ)","Body 2 · Arguments against (protect children)"), t:"Evidence 1: children cannot judge serious danger (traffic, internet). Evidence 2: some injuries are permanent. Evidence 3: parents are responsible for their safety (RK-4: liable for)."},
   {h:"Conclusion", t:"Opinion + condition: as long as the risks are age-appropriate (CD-1)."}
  ],
  build:[bq("Viết câu trả lời 1 câu (Exercise 3 của tài liệu) có bằng chứng.","Write the one-sentence answer (course Exercise 3) with evidence.","Children should be exposed to small, controlled risks, because learning by trial and error helps them judge danger for themselves."),
   bq("Viết câu với <b>over-protective</b> + <b>As a result,</b>","Write a sentence with <b>over-protective</b> + <b>As a result,</b>","Some parents are over-protective and never let their children climb or cycle alone. As a result, these children may lack confidence when facing new situations."),
   bq("Viết câu kết luận dùng <b>as long as</b>.","Write a concluding sentence using <b>as long as</b>.","In my opinion, children benefit from taking risks, as long as those risks are suited to their age and adults are nearby.")],
  model:"There are strong reasons to believe that children need some exposure to risk. Most importantly, young people learn to judge danger by trial and error: a child who falls from a low wall quickly learns how high is too high, a lesson that no warning from an adult can teach as effectively. Small risks also build confidence, since children who are allowed to cycle to school or cook a simple meal discover that they can manage challenges on their own. By contrast, children of over-protective parents may reach adulthood without ever having made a decision about their own safety, and as a result they may struggle to cope when they finally face real risks at university or work.",
  focus:["G-COND","G-CE","O-ORD","W-REG"]},

 {id:"gp4", ty:"ps", date:"29/01/2026",
  p:"Most people who are released from prison go on to commit crimes again. Why is this? What can be done to solve this problem?",
  an:an("released from prison · commit crimes again · why · what can be done",
   "<b>released from prison</b> (người đã mãn hạn — không bàn về nguyên nhân phạm tội lần đầu)","<b>released from prison</b> (ex-prisoners — not why people commit their first crime)",
   "Hai câu hỏi: nguyên nhân tái phạm + giải pháp khớp nguyên nhân.","Two questions: why they reoffend + solutions that match.",
   "Viết về nguyên nhân phạm tội nói chung; đề xuất “phạt nặng hơn” không khớp với nguyên nhân.","Writing about why crime happens in general; proposing ‘harsher punishment’, which does not match the causes."),
  pos:bi("Không cần agree/disagree. Mở bài nêu: nguyên nhân chính là khó tìm việc + môi trường cũ; giải pháp là đào tạo nghề + hỗ trợ tái hoà nhập.","No agree/disagree needed. The introduction previews: the main causes are difficulty finding work + returning to old environments; the solutions are job training + reintegration support."),
  outline:[
   {h:"Introduction", t:"Paraphrase + preview."},
   {h:bi("Body 1 · Nguyên nhân","Body 1 · Causes"), t:"(1) Criminal record → employers reject them → no income → crime. (2) Return to the same friends and neighbourhood; prison teaches criminal skills. Use As a result of this / Consequently (CE-1)."},
   {h:bi("Body 2 · Giải pháp (khớp 1–1)","Body 2 · Solutions (matching 1–1)"), t:"(1) Education and job training in prison; incentives for employers. (2) Mentoring, housing support, community programmes → provided that ex-prisoners take part (CD-1)."},
   {h:"Conclusion", t:"Summary."}
  ],
  build:[bq("Viết câu nguyên nhân dùng <b>Because of this,</b>","Write a cause sentence using <b>Because of this,</b>","Many employers refuse to hire people with a criminal record. Because of this, former prisoners often have no legal way to earn a living."),
   bq("Viết câu giải pháp dùng <b>It is essential to …</b>","Write a solution sentence with <b>It is essential to …</b>","It is essential to provide prisoners with education and job training before they are released."),
   bq("Viết câu kết quả dùng <b>This would result in …</b>","Write a result sentence with <b>This would result in …</b>","This would result in fewer ex-prisoners returning to crime simply because they have no other option.")],
  model:"The main reason why so many former prisoners reoffend is that they find it extremely difficult to rebuild their lives. Most employers are unwilling to hire someone with a criminal record, and as a result of this, many ex-prisoners have no legal source of income and return to crime in order to survive. Another factor is the environment they go back to. On release, many people return to the same neighbourhoods and the same friends who encouraged their criminal behaviour in the first place, while time spent in prison may even have taught them new criminal skills. Consequently, without support, a prison sentence often interrupts a criminal career rather than ending it.",
  focus:["G-CE","O-ORD","W-COL","G-ART"]},

 {id:"gp5", ty:"two", date:"03/04/2025",
  p:"In some countries, the government has limited by law the number of hours employees can work each week. Why is this? Is this a positive or negative development?",
  an:an("government · limited by law · hours employees can work · why · positive or negative",
   "<b>by law</b> (luật pháp — chính phủ can thiệp) · <b>employees</b> (người làm thuê)","<b>by law</b> (legislation — government intervention) · <b>employees</b> (people who work for others)",
   "Hai câu hỏi: lý do + đánh giá tích cực/tiêu cực (chọn rõ).","Two questions: reasons + a clear positive/negative verdict.",
   "Chỉ trả lời câu 2; đánh giá “both”.","Answering only question 2; answering ‘both’."),
  pos:bi("Lý do: bảo vệ sức khoẻ, an toàn lao động, cân bằng cuộc sống. Đánh giá: <b>chủ yếu tích cực</b>, miễn là luật linh hoạt.","Reasons: protecting health and safety, work–life balance. Verdict: <b>largely positive</b>, as long as the law is flexible."),
  outline:[
   {h:"Introduction", t:"Paraphrase + short answers."},
   {h:bi("Body 1 · Lý do","Body 1 · Reasons"), t:"Governments see it as their responsibility to protect workers (RK-1); long hours → fatigue → workplace accidents (RK-4: health and safety regulations); stress-related illness; employers may exploit workers."},
   {h:bi("Body 2 · Đánh giá: tích cực","Body 2 · Verdict: positive"), t:"Admittedly, businesses complain about costs (RK-7)… However, rested workers are more productive; fewer accidents; family life → positive, as long as the rules are not excessively restrictive (RK-9)."},
   {h:"Conclusion", t:"Restate reasons + verdict."}
  ],
  build:[bq("Viết câu lý do dùng <b>see it as their responsibility to</b>.","Write a reason sentence using <b>see it as their responsibility to</b>.","Many governments see it as their responsibility to protect employees from exploitation and exhaustion."),
   bq("Viết câu nhượng bộ theo RK-7 (businesses complain that …).","Write a concession based on RK-7 (businesses complain that …).","Admittedly, some businesses complain that such laws increase their costs and reduce their flexibility."),
   bq("Viết câu quan điểm có điều kiện dùng <b>as long as</b>.","Write a qualified verdict using <b>as long as</b>.","Overall, I consider this a positive development, as long as the rules allow some flexibility for seasonal industries.")],
  model:"There are several reasons why governments have chosen to limit working hours by law. The most important is that they see it as their responsibility to protect employees’ health and safety. Tired workers are far more likely to make mistakes, and in industries such as construction or transport, exhaustion can lead to serious accidents. Long working hours have also been linked to stress-related illnesses, which place an additional burden on public health services. Finally, without legal limits, some employers might pressure staff to work unpaid overtime, so legislation ensures that workers are not exploited simply because they fear losing their jobs.",
  focus:["O-POS","G-CE","W-PREP","G-RUN"]}
]};

 "note.counter":{vi:"<b>Counterargument &amp; Refutation:</b> mọi ý phản đối bạn đưa ra đều cần một câu bác bỏ. Điều bắt đầu như một ý phản đối thường kết thúc thành một lý do ủng hộ quan điểm của bạn. Dùng modal yếu (<i>may, might, could</i>) để làm ý đối phương yếu đi, rồi phản bác bằng <i>However / Then again</i>.",en:"<b>Counterargument &amp; Refutation:</b> every opposing point you raise needs a rebuttal. What begins as a counterargument often ends up as another reason supporting your view. Use weak modals (<i>may, might, could</i>) to make the opposing point sound weaker, then refute it with <i>However / Then again</i>."},

/* --- band table + checklist (shared) --- */
function bandGroupHTML(title, bands, cls){
  const rows = bandDescriptors.filter(d=>bands.includes(d.b)).map(d=>
    `<tr data-b="${d.b}"><td class="bn">${d.b}</td>
     <td>${d.tr}</td><td>${d.cc}</td><td>${d.lr}</td><td>${d.gra}</td></tr>`).join('');
  return `<div class="bandgroup ${cls}"><div class="bghead">${title}</div>
    <div class="bandwrap"><table class="band"><thead><tr>
      <th>Band</th><th>Task Response</th><th>Coherence &amp; Cohesion</th>
      <th>Lexical Resource</th><th>Grammatical Range &amp; Accuracy</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function bandTableHTML(){
  return bandGroupHTML("Band 8–9 · Very good – Expert user", ["8","9"], "bg-hi")
       + bandGroupHTML("Band 6–7 · Competent – Good user", ["6","7"], "bg-mid")
       + bandGroupHTML("Band 4–5 · Limited – Modest user", ["4","5"], "bg-lo")
       + `<div class="bandsrc" style="border:1px solid var(--line);border-radius:8px">${tr('bandsrc')}</div>`;
}
function checklistHTML(topicId){
  let out = `<button class="resetbtn" onclick="resetChecks('${topicId}')">${tr('chk.reset')}</button>`;
  for(const k in checklist){
    const c=checklist[k];
    out += `<div class="crit"><h4><span class="k">${k}</span> ${c.name}</h4>`;
    c.items.forEach((it,idx)=>{
      const id=`chk-${topicId}-${k}-${idx}`;
      const label = (it&&typeof it==='object') ? (it[LANG]||it.vi) : it;
      out+=`<div class="check"><input type="checkbox" id="${id}"><label for="${id}">${label}</label></div>`;
    });
    out+=`</div>`;
  }
  out += `<div class="themetag" style="margin-top:18px">${tr('chk.bands')}</div>`;
  out += bandTableHTML();
  return out;
}
function resetChecks(topicId){
  document.querySelectorAll(`[id^="chk-${topicId}-"]`).forEach(c=>c.checked=false);
}

let _gbVoice=null;
function pickGBVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  // prefer named British voices, then any en-GB voice
  const pref=["Google UK English Female","Google UK English Male","Daniel","Kate","Serena","Arthur","Sonia","Libby","George"];
  for(const name of pref){const v=vs.find(x=>x.name===name);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/English \(United Kingdom\)/i.test(v.name)) || null;
}
if('speechSynthesis' in window){
  _gbVoice=pickGBVoice();
  speechSynthesis.onvoiceschanged=()=>{_gbVoice=pickGBVoice();};
}
function speak(w){
  try{ if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(w);
    u.lang='en-GB'; u.rate=.9;
    if(!_gbVoice)_gbVoice=pickGBVoice();
    if(_gbVoice)u.voice=_gbVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* --- idea block --- */
function ideaHTML(node){
  if(node.theme){return `<div class="themetag">◆ ${esc(node.theme)}</div>`;}
  const cls = node.side==='against'?'arg against':'arg';
  const tag = node.side==='against'?tr('idea.tag.counter'):tr('idea.tag.arg');
  return `<div class="${cls}"><div class="claim"><span class="tag">${tag}</span><span>${esc(node.claim)}</span></div>
    <ul class="chain">${node.chain.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
}

function errLog(){
  const cnt={};
  const add=c=>{cnt[c]=(cnt[c]||0)+1;};
  const all={}; CLINIC.t1.groups.forEach(g=>g.items.forEach((it,i)=>all[g.id+'-'+i]=it));
  for(const k in ST.mcq){const it=all[k]; if(it && ST.mcq[k]!==it.k) add(it.c);}
  for(const k in ST.self){if(ST.self[k]==='miss' && all[k]) add(all[k].c);}

function checkGap(id){
  let ok=0,n=0;
  document.querySelectorAll('#'+id+' li').forEach(li=>{
    const ans=li.dataset.ans.split(' / ').map(norm); const got=[...li.querySelectorAll('input')].map(x=>norm(x.value));

  });
  scoreBadge(id,ok,n);

/* ---------- positional gap check with alternatives ---------- */
function normZ(s){ s=norm(s); return ['–','—','ø','0','x','zero','none','-'].includes(s)?'-':s; }
function checkGap(id){
  let ok=0,n=0;
  document.querySelectorAll('#'+id+' li').forEach(li=>{
    const ans=li.dataset.ans.split(' / '); const got=[...li.querySelectorAll('input')].map(x=>normZ(x.value));
    const good = got.length===ans.length && got.every((g,i)=>ans[i].split('|').map(normZ).includes(g));
    li.querySelector('.mk').innerHTML=good?'<b class="okk">✓</b>':'<b class="nok">✗</b>'; n++; if(good) ok++;
  });
  scoreBadge(id,ok,n);
}

function gapEx(id,ex){

  <div class="card" id="rd3"><div class="rlabel">WRITING SKILLS TEXTS</div>
   <h4 style="margin-bottom:6px">Cause and effect</h4>
   <div class="skillbox"><p>${T.cause.intro}</p><ul>${T.cause.simple.map(x=>`<li>${x}</li>`).join('')}</ul><p>${T.cause.note}</p><ul>${T.cause.complex.map(x=>`<li>${x}</li>`).join('')}</ul> <a class="rlink" onclick="gotoCard('CE-1')">CE-1</a></div>
   <h4 style="margin:16px 0 6px">Conditional language</h4>
   <div class="skillbox"><p>${T.cond.intro}</p><p><i>${T.cond.base}</i></p><p>${T.cond.note}</p><ul>${T.cond.ex.map(x=>`<li>${x}</li>`).join('')}</ul> <a class="rlink" onclick="gotoCard('CD-1')">CD-1</a></div>
   <div class="rlabel" style="margin-top:20px">WRITING PRACTICE 1</div>
   <div class="prompt star"><p><b>${T.practice.p}</b></p><button class="linkbtn" style="margin-top:8px" onclick="show('bank');setTimeout(()=>gotoGP('gp0'),150)">${xt('bank.gp')} →</button></div>
   ${selEx('ex-rcat',V('Exercise 1 · Rủi ro thuộc loại nào? (có thể thuộc nhiều loại — chọn đáp án tốt nhất)','Exercise 1 · Are the risks personal, professional or financial? (some belong to more than one — choose the best answer)'),T.practice.risks.map(r=>[r[0],r[1]]),[["personal","personal"],["professional","professional"],["financial","financial"],["personal / professional","personal / professional"],["personal / professional / financial","personal / professional / financial"]],V('Đáp án là gợi ý của giáo viên; chấp nhận lựa chọn khác nếu học sinh giải thích hợp lý.','The key is a suggestion; other choices are fine if you can justify them.'))}
   <div class="matchwrap"><ol type="a" class="mright">${T.practice.rewards.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>
   ${selEx('ex-rrew',V('Exercise 2 · Nối rủi ro (1–12) với phần thưởng (a–l)','Exercise 2 · Match the risks (1–12) to the rewards (a–l)'),T.practice.risks.map(r=>[r[0],r[2]]),'abcdefghijkl'.split('').map((l,i)=>[l,l+' · '+T.practice.rewards[i]]))}
   ${openEx('rag',V('Exercise 3 · Lý lẽ PHẢN ĐỐI mỗi rủi ro là gì? (chọn 3 rủi ro)','Exercise 3 · What are the arguments against taking each risk? (choose three)'),[["investing in get-rich-quick schemes","You may lose all your savings, because such schemes are often fraudulent."],["not wearing a seatbelt","A minor accident may result in serious or fatal injuries."],["avoiding paying tax","It is illegal and may lead to heavy fines or prison; it also reduces money for public services."]])}
   <div class="rlabel" style="margin-top:20px">WRITING PRACTICE 2</div>
   <div class="prompt star"><p><b>${T.practice2.p}</b></p><ul class="plainul">${T.practice2.plan.map(x=>`<li>${x}</li>`).join('')}</ul><button class="linkbtn" style="margin-top:8px" onclick="show('bank');setTimeout(()=>gotoGP('gp3'),150)">${xt('bank.gp')} →</button></div>
  </div>`);
}

/* ---------- Vocabulary ---------- */
function buildVocab(){
  const X=BOOKEX3;
  sec('vocab', hero('📘', V('Từ vựng chủ đề Risk','Risk vocabulary'), V('Ngôn ngữ tự do · danh từ hoá · glossary phát âm, collocation, câu band 7+','Language of freedom · noun forms · glossary with pronunciation, collocations, band-7+ examples'))+
  `<div class="card"><h3>A · Language of freedom</h3>
    ${selEx('ex-freeT',X.freeT.h,X.freeT.items,[["promote",V('Thúc đẩy tự do','Promoting freedom')],["restrict",V('Hạn chế tự do','Restricting freedom')]])}
    <div class="ex" id="ex-freeC"><h4>${X.freeC.h}</h4><table class="extbl"><tbody>${X.freeC.items.map((it,i)=>`<tr data-ans="${it[1]}"><td class="n">${i+1}</td><td>${esc(it[0])}</td><td><select data-k="fc-${i}" onchange="ST.drafts[this.dataset.k]=this.value"><option value="">—</option>${it[2].map((o,j)=>`<option value="${o}" ${ST.drafts['fc-'+i]===o?'selected':''}>${'abc'[j]} · ${o}</option>`).join('')}</select></td><td class="mk"></td></tr>`).join('')}</tbody></table>
     <div class="exbtn"><button class="linkbtn" onclick="checkSel('ex-freeC')">${xt('check')}</button><button class="resetbtn" onclick="keySel('ex-freeC')">${V('Xem đáp án','Show key')}</button></div></div></div>
   <div class="card"><h3>B · ${V('Danh từ học thuật','Academic nouns')}</h3>${gapEx('ex-nouns',X.nouns)}</div>
   <div class="card"><h3>${tr('vocab.h')}</h3>${richVocabHTML('t3')}</div>`);
}

/* ---------- Lab / Clinic / Check ---------- */
function buildLab(){ const n=READING.t1.sources.reduce((s,x)=>s+x.cards.length,0); sec('lab', hero('📖', xt('rl.h'), V(n+' thẻ · nguyên văn → hiểu → khai thác ý → mượn cụm từ',n+' cards · verbatim → understand → mine ideas → borrow phrases'))+`<div class="card">${readingHTML('t1')}</div>`); }
function buildClinic(){ const n=CLINIC.t1.groups.reduce((s,g)=>s+g.items.length,0); sec('clinic', hero('🛠', xt('sc.h'), V(n+' câu · nguyên nhân–kết quả – điều kiện – collocation rủi ro – sắp xếp ý · Error Log cá nhân',n+' items · cause–effect – conditionals – risk collocations – organisation · personal Error Log'))+`<div class="card" id="clinicbody">${clinicHTML('t1')}</div>`); }
function buildCheck(){
  sec('check', hero('✅', tr('cl.title'), V('Tự kiểm tra trước khi nộp bài','Self-check before submitting'))+
  `<div class="card"><h3>${V('Checklist riêng cho Unit 3','Unit 3 checklist')}</h3><div class="grid2">
    <div class="typebox"><h4>TASK</h4>${[V('Mở bài nhắc tới cả hai phía và nêu quan điểm?','Does the introduction mention both sides and state your opinion?'),V('Có một đoạn “for” và một đoạn “against” cân xứng?','Are there balanced ‘for’ and ‘against’ paragraphs?'),V('Kết luận có quan điểm rõ + điều kiện (như RK-9)?','Does the conclusion give a clear opinion + a condition (like RK-9)?'),V('Đủ 250–300 từ?','Have you written 250–300 words?')].map((x,i)=>`<div class="check"><input type="checkbox" id="tc${i}"><label for="tc${i}">${x}</label></div>`).join('')}</div>
    <div class="typebox"><h4>LANGUAGE</h4>${[V('Dùng đúng lead to / result in + danh từ?','Have you used lead to / result in + noun correctly?'),V('Dùng ít nhất 1 câu provided that / as long as (không will)?','Have you used at least one provided that / as long as sentence (no will)?'),V('Dùng từ ngôn ngữ tự do (ban, restrict, grant…) chính xác?','Have you used the language of freedom (ban, restrict, grant…) accurately?'),V('Kiểm tra lại mạo từ và However (lỗi Unit 2)?','Have you rechecked articles and However (Unit 2 errors)?')].map((x,i)=>`<div class="check"><input type="checkbox" id="lc${i}"><label for="lc${i}">${x}</label></div>`).join('')}</div></div></div>
   <div class="card"><div class="lead">${tr('cl.lead')}</div>${checklistHTML('rk')}</div>`);
}

/* ---------- Skills & Ideas ---------- */
function buildSkills(){
  const X=BOOKEX3, T=TEXTS3;
  const t3=topics.find(t=>t.id==='t3');
  sec('skills', hero('✍️', V('Kỹ năng viết & phát triển ý','Writing skills & idea development'), V('Nguyên nhân–kết quả · câu điều kiện · khung “for and against” · ý tưởng Risk','Cause & effect · conditionals · the ‘for and against’ frame · Risk ideas'))+
  `<div class="card"><h3>1 · Cause and effect</h3>
    <div class="grid2"><div class="typebox"><h4>${V('Động từ','Verb phrases')}</h4><div>A <b>results in</b> B · A <b>leads to</b> B · A <b>means</b> B · B <b>results from</b> A · A <b>causes</b> B</div></div>
    <div class="typebox"><h4>${V('Từ nối giữa hai câu','Linkers between sentences')}</h4><div><b>As a result of this,</b> · <b>Because of this,</b> · <b>Consequently,</b> + clause</div></div></div>
    ${openEx('ce1',X.ce1.h,X.ce1.items)}${openEx('ce2',X.ce2.h,X.ce2.items)}</div>
   <div class="card"><h3>2 · Conditional language</h3>
    <div class="grid2"><div class="typebox"><h4>${V('Thay cho if (trang trọng)','Formal alternatives to if')}</h4><div><b>Provided that</b> / <b>As long as</b> / <b>On condition that</b> + present simple</div></div>
    <div class="typebox"><h4>${V('Vị trí','Position')}</h4><div>${V('Đứng đầu câu (có dấu phẩy) hoặc giữa câu (không dấu phẩy).','At the start (with a comma) or in the middle (no comma).')}</div></div></div>
    ${openEx('cd',X.cond.h,X.cond.items)}</div>
   <div class="card"><h3>3 · ${V('Khung bài “reasons for and against + opinion”','The ‘reasons for and against + opinion’ frame')}</h3>
    <div class="flow6">${[["Introduction",V('Bối cảnh + hai cách tiếp cận + quan điểm','Background + both approaches + opinion'),"RK-1, RK-2"],["Arguments for",V('Those who support… argue that… → giải thích → ví dụ → kết quả','Those who support… argue that… → explain → example → result'),"RK-3, RK-4, RK-5"],["Arguments against","While some people believe…, others feel… / On the other hand,","RK-6, RK-7"],["Conclusion",V('Tóm tắt + In my opinion… + điều kiện (However / provided that)','Summary + In my opinion… + a condition (However / provided that)'),"RK-8, RK-9"]].map((s,i)=>`<div class="f6"><div class="f6n">${i+1}</div><div><b>${s[0]}</b><div>${s[1]}</div><div class="exnote">${s[2].split(', ').map(r=>`<a class="rlink" onclick="gotoCard('${r}')">${r}</a>`).join(' ')}</div></div></div>`).join('')}</div></div>
   <div class="card"><h3>4 · ${V('Phát triển ý (chuỗi lập luận)','Idea development (argument chains)')}</h3><div class="lead">${tr('idea.lead')}</div>${t3.ideas.map(ideaHTML).join('')}</div>
   <div class="card"><h3>5 · ${V('Khung theo dạng bài · lỗi tổ chức ý hay gặp','Frameworks by essay type · common organisation errors')}</h3>
    <div class="grid2">${ROADMAP.types.map(t=>`<div class="typebox tb2"><h4>${typePill(t.ty)}</h4><div class="sig"><b>${xt('rm.sig')}:</b> <i>${esc(t.sig)}</i></div>
    <div class="tbh">${xt('rm.plan')}</div><ol>${t.plan.map(x=>`<li>${x}</li>`).join('')}</ol>
    <div class="tbh">${xt('rm.errs')}</div><ul class="errs">${t.errs.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="tbh">${xt('rm.frame')}</div><div class="frame">${t.frame}</div></div>`).join('')}</div></div>`);
}

/* ---------- Teacher · Answer keys ---------- */
function buildKeys(){
  const X=BOOKEX3, T=TEXTS3, Z=T.quiz;
  const li=(arr)=>`<ol>${arr.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  const block=(h,body)=>`<div class="keyblock"><h4>${h}</h4>${body}</div>`;
  const clinicKey=CLINIC.t1.groups.map(g=>block(L(g.title), li(g.items.map(it=>`<span class="code">${it.c}</span> `+(it.t==='fix'?`<s>${esc(it.w)}</s> → ${it.a}`:it.t==='mcq'?`${it.q} → <b>${String.fromCharCode(97+it.k)}. ${esc(it.o[it.k])}</b>`:`${it.q} → <b>${it.k.split('').join(' ')}</b>`))))).join('');
  sec('keys', hero('🔑','Đáp án tổng hợp (bản giáo viên)','Dùng để in / chữa nhanh trên lớp')+
  `<div class="card"><button class="linkbtn noprint" onclick="window.print()">🖨 In trang đáp án</button>
   <div class="grid2" style="margin-top:12px">
   ${block('Exercise 5 · Scores', li(Z.scores.map(s=>`<b>${s[1]}</b>`)))}
   ${block('Exercise 6 · Formal phrases → quiz', li(Z.formal.map(f=>`${f[0]} → <b>${f[1]}</b>`)))}
   ${block('Exercise 6 · Diagram', li(['adrenalin','alert','faster / stronger','stronger / faster','withstand pain','feel good'].map(x=>`<b>${x}</b>`)))}
   ${block(X.freeT.h, `<p><b>promoting:</b> allow, permit, legalize, grant, authorize</p><p><b>restricting:</b> ban, curb, limit, criminalize, restrict</p>`)}
   ${block(X.freeC.h, li(X.freeC.items.map(x=>`<b>${'abc'[x[2].indexOf(x[1])]} · ${x[1]}</b>`)))}
   ${block(X.nouns.h, li(X.nouns.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.ce1.h, li(X.ce1.items.map(x=>`<i>${esc(x[1])}</i>`)))}
   ${block(X.ce2.h+' (gợi ý)', li(X.ce2.items.map(x=>`<i>${esc(x[1])}</i>`)))}
   ${block(X.cond.h+' (gợi ý)', li(X.cond.items.map(x=>`<i>${esc(x[1])}</i>`)))}
   ${block('Writing Practice · Exercise 1 (gợi ý) & Exercise 2', li(T.practice.risks.map(r=>`${r[0]} → <b>${r[1]}</b> · reward <b>${r[2]}</b>`)))}
   </div><div class="note" style="margin-top:12px">Ghi chú: Exercise 1 (personal / professional / financial) không có đáp án duy nhất — tài liệu ghi “They may belong to more than one topic”; chấp nhận lựa chọn hợp lý nếu học sinh giải thích được. Exercise 2: đáp án dựa trên logic rủi ro → phần thưởng (b = seatbelt, c = late for work, d = protective equipment…).</div></div>
   <div class="card"><h3>Sentence Clinic</h3>${clinicKey}</div>`);
}

function renderMain(){
  mainEl.innerHTML='';
  if(MODE==='teacher') buildPlan(); else buildPath();
  buildTexts(); buildVocab(); buildLab(); buildSkills(); buildClinic(); buildBank(); buildCheck();
  if(MODE==='teacher') buildKeys();
  renderLog();
  const vw=document.getElementById('view-'+currentView); (vw||document.getElementById('view-'+ETABS[0].id)).classList.add('active');
}
function setLang(l){
  LANG=(MODE==='student')?'en':l; document.documentElement.lang=LANG;
  const bvi=document.getElementById('lang-vi'), ben=document.getElementById('lang-en');
  if(bvi) bvi.classList.toggle('on',LANG==='vi'); if(ben) ben.classList.toggle('on',LANG==='en');
  document.getElementById('headIntro').innerHTML = MODE==='student'
   ? 'Do the risk quiz and read the model essay first, collect ideas and phrases, master <b>cause and effect</b> and <b>conditionals</b>, then write about <b>real IELTS exam questions from 2024–2026</b>.'
   : V('Bản giáo viên · Unit <b>Risk</b>: thiết kế bài giảng 4 buổi, toàn bộ bài đọc nguyên văn (quiz + bài luận mẫu), bài tập có chấm, Reading Lab, Sentence Clinic (nguyên nhân–kết quả & điều kiện), 16 đề thật 2024–2026, 6 bài thực hành có hướng dẫn và <b>đáp án tổng hợp</b>.','Teacher edition · <b>Risk</b> unit: a 4-session lesson design, all readings verbatim (quiz + model essay), auto-checked exercises, Reading Lab, Sentence Clinic (cause–effect & conditionals), 16 real 2024–2026 prompts, 6 guided tasks and <b>consolidated answer keys</b>.');
  document.getElementById('foot').innerHTML = (MODE==='student'||LANG==='en')
   ? 'Writing Studio · IELTS Writing Task 2 · Unit 3 Risk — readings and exercises adapted from <b>Evolve Level 4</b> (Cambridge University Press); real exam prompts compiled from talkfirst.vn and ieltscity.vn (reported by candidates, so wording may differ slightly); band descriptors from the British Council / IDP / Cambridge Assessment English.'
   : 'Writing Studio · IELTS Writing Task 2 · Unit 3 Risk — bài đọc và bài tập chuyển thể từ <b>Evolve Level 4</b> (Cambridge University Press); đề thi thật tổng hợp từ talkfirst.vn, ieltscity.vn; band descriptors theo British Council / IDP / Cambridge.';
  renderTabs(); renderMain(); show(currentView);
}
currentView=ETABS[0].id;
setLang(MODE==='student'?'en':'vi');

function showKey(id){document.querySelectorAll('#'+id+' li').forEach(li=>{li.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(li.dataset.ans.replace(/\|/g,' / '))}</span>`;});}

</script>
</body>
</html>
