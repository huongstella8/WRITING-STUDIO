  sec('skills', hero('✍️', V('Kỹ năng viết & phát triển ý','Writing skills & idea development'), V('Danh từ ghép · nguyên nhân–kết quả · giải pháp với It · ý tưởng Environment','Noun phrases · cause & effect · solutions with it · Environment ideas'))+
  `<div class="card"><h3>1 · Academic noun phrases</h3>
    <div class="grid2"><div class="typebox"><h4>${V('Công thức','Pattern')}</h4><div>noun + noun: <b>risk analysis, flood protection, water management system</b><br>verb → noun: manufacture the product → <b>product manufacturing</b></div></div>
    <div class="typebox"><h4>${V('Vì sao dùng?','Why use them?')}</h4><div>${V('Ngắn gọn, học thuật, tăng LR & GRA; tránh mệnh đề quan hệ dài lặp lại.','Concise and academic, they raise LR and GRA scores and avoid long, repetitive relative clauses.')}</div></div></div>
    ${gapEx('ex-npx',X.npx)}</div>
   <div class="card"><h3>2 · Cause and effect</h3>
    <div class="grid2"><div class="typebox"><h4>${V('Nguyên nhân → kết quả','Cause → effect')}</h4><div>X <b>leads to / causes / results in</b> Y</div></div>
    <div class="typebox"><h4>${V('Kết quả ← nguyên nhân','Effect ← cause')}</h4><div>Y <b>is caused by / is due to / is the result of</b> X</div></div>
    <div class="typebox"><h4>because vs because of</h4><div><b>because</b> + clause · <b>because of / due to</b> + noun</div></div>
    <div class="typebox"><h4>${V('Chuỗi nhiều mắt xích','Multi-step chains')}</h4><div>…, <b>which leads to</b> … · <b>This can cause</b> … · …, <b>leaving / meaning that</b> …</div></div></div>
    ${gapEx('ex-link',X.link)}${gapEx('ex-bec',X.bec)}</div>
   <div class="card"><h3>3 · Expressing solutions using <i>it</i></h3>
    <div class="grid2">${T.it.patterns.map(p=>`<div class="typebox"><h4>${p[0]}</h4><div><i>${p[1]}</i></div></div>`).join('')}</div>
    ${matchEx('ex-itm',X.itm)}${openEx('itc',X.itc.h,X.itc.items)}</div>
   <div class="card"><h3>4 · ${V('Phát triển ý (chuỗi lập luận)','Idea development (argument chains)')}</h3><div class="lead">${tr('idea.lead')}</div>${t4.ideas.map(ideaHTML).join('')}</div>
   <div class="card"><h3>5 · ${V('Khung theo dạng bài · lỗi tổ chức ý hay gặp','Frameworks by essay type · common organisation errors')}</h3>
    <div class="grid2">${ROADMAP.types.map(t=>`<div class="typebox tb2"><h4>${typePill(t.ty)}</h4><div class="sig"><b>${xt('rm.sig')}:</b> <i>${esc(t.sig)}</i></div>
    <div class="tbh">${xt('rm.plan')}</div><ol>${t.plan.map(x=>`<li>${x}</li>`).join('')}</ol>
    <div class="tbh">${xt('rm.errs')}</div><ul class="errs">${t.errs.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="tbh">${xt('rm.frame')}</div><div class="frame">${t.frame}</div></div>`).join('')}</div></div>`);
}

/* ---------- Teacher · Answer keys ---------- */
function buildKeys(){
  const X=BOOKEX4, T=TEXTS4, L2='abcdefghi';
  const li=(arr)=>`<ol>${arr.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  const block=(h,body)=>`<div class="keyblock"><h4>${h}</h4>${body}</div>`;
  const mk=(m)=>li(m.left.map((l,i)=>`${l} → <b>${L2[m.key[i]]}</b>`));
  const clinicKey=CLINIC.t1.groups.map(g=>block(L(g.title), li(g.items.map(it=>`<span class="code">${it.c}</span> `+(it.t==='fix'?`<s>${esc(it.w)}</s> → ${it.a}`:it.t==='mcq'?`${it.q} → <b>${String.fromCharCode(97+it.k)}. ${esc(it.o[it.k])}</b>`:`${it.q} → <b>${it.k.split('').join(' ')}</b>`))))).join('');
  sec('keys', hero('🔑','Đáp án tổng hợp (bản giáo viên)','Dùng để in / chữa nhanh trên lớp')+
  `<div class="card"><button class="linkbtn noprint" onclick="window.print()">🖨 In trang đáp án</button>
   <div class="grid2" style="margin-top:12px">
   ${block('Exercise 1 · Photos', li(X.label.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.glac.h, mk(X.glac))}
   ${block(X.acad.h, li(X.acad.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.vow.h, li(X.vow.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.odd.h, li(X.odd.items.map((x,i)=>`<b>${x[3]}</b> ${X.odd.noun[i]}`)))}
   ${block(X.coll.h, li(X.coll.items.map(x=>`<b>${x[1].replace(/\|/g,' / ')}</b>`)))}
   ${block(X.two.h, li(X.two.items.map(x=>`${x[0]} → <b>${x[2].split('').map(c=>x[1]['abc'.indexOf(c)]).join(', ')}</b>`)))}
   ${block(X.defm.h, mk(X.defm))}
   ${block('Interview · Title', '<p><b>1 · Controlling the flow</b> (gợi ý — bao quát nhiều biện pháp kiểm soát lũ; các tiêu đề khác quá hẹp/quá chung).</p>')}
   ${block(X.ref.h, li(X.ref.items.map(x=>`${x[0]} → <b>${x[1]}</b>`)))}
   ${block(X.purp.h, li(X.purp.items.map((x,i)=>`${'abcdef'[i]} · ${x[0]} → <b>${x[1]}</b>`)))}
   ${block(X.quad.h, li(X.quad.items.map(x=>`${x[0]} → <b>${QUAD[x[1]]}</b>`)))}
   ${block(X.npx.h, li(X.npx.items.map(x=>`<b>${x[1].replace(/\|/g,' / ')}</b>`)))}
   ${block(X.link.h, li(X.link.items.map(x=>`<b>${x[1].replace(/\|/g,' / ')}</b>`)))}
   ${block(X.bec.h, li(X.bec.items.map(x=>`<b>${x[1]}</b>`)))}
   ${block(X.itm.h, li(X.itm.left.map((l,i)=>`${l} → <b>${'abcdefgh'[X.itm.key[i]]}</b>`)))}
   ${block('Writing Practice · Task 1', `<p><b>causes:</b> ${T.practice.points.filter(p=>p[1]==='cause').map(p=>p[0]).join(', ')}</p><p><b>effects:</b> ${T.practice.points.filter(p=>p[1]==='effect').map(p=>p[0]).join(', ')}</p>`)}
   </div><div class="note" style="margin-top:12px">Ghi chú: Exercise 1 (ảnh) — vì bản quyền ảnh, bài tập trên trang dùng mô tả bằng chữ thay cho ảnh gốc trong tài liệu; nên chiếu ảnh từ tài liệu khi dạy. Exercise 3 (collocation) chấp nhận nhiều đáp án như tài liệu ghi “more than one answer may be possible”. Sơ đồ chiến lược hạn hán: rainwater harvesting và wells có thể tranh luận (báo cáo nêu wells = “medium cost”).</div></div>
   <div class="card"><h3>Sentence Clinic</h3>${clinicKey}</div>`);
}

function renderMain(){
  mainEl.innerHTML='';
  if(MODE==='teacher') buildPlan(); else buildPath();
  buildTexts(); buildVocab(); buildLab(); buildSkills(); buildClinic(); buildBank(); buildCheck();
  if(MODE==='teacher') buildKeys();
  renderLog();
  const vw=document.getElementById('view-'+currentView); (vw||document.getElementById('view-'+ETABS[0].id)).classList.add('active');
}
function setLang(l){
  LANG=(MODE==='student')?'en':l; document.documentElement.lang=LANG;
  const bvi=document.getElementById('lang-vi'), ben=document.getElementById('lang-en');
  if(bvi) bvi.classList.toggle('on',LANG==='vi'); if(ben) ben.classList.toggle('on',LANG==='en');
  document.getElementById('headIntro').innerHTML = MODE==='student'
   ? 'Read three texts on deforestation, flood protection and drought, collect ideas and phrases, master <b>cause–effect linkers</b>, <b>it-structures</b> and <b>noun phrases</b>, then write about <b>real IELTS exam questions from 2024–2026</b>.'
   : V('Bản giáo viên · Unit <b>Environment</b>: thiết kế bài giảng 4 buổi, toàn bộ 3 bài đọc nguyên văn, bài tập có chấm, Reading Lab, Sentence Clinic, 19 đề thật 2024–2026, 6 bài thực hành có hướng dẫn (đủ 6 dạng bài) và <b>đáp án tổng hợp</b>.','Teacher edition · <b>Environment</b> unit: a 4-session lesson design, all three readings verbatim, auto-checked exercises, Reading Lab, Sentence Clinic, 19 real 2024–2026 prompts, 6 guided tasks (all 6 essay types) and <b>consolidated answer keys</b>.');
  document.getElementById('foot').innerHTML = (MODE==='student'||LANG==='en')
   ? 'Writing Studio · IELTS Writing Task 2 · Unit 4 Environment — readings and exercises adapted from <b>Evolve Level 4</b> (Cambridge University Press); real exam prompts compiled from talkfirst.vn (reported by candidates, so wording may differ slightly); band descriptors from the British Council / IDP / Cambridge Assessment English.'
   : 'Writing Studio · IELTS Writing Task 2 · Unit 4 Environment — bài đọc và bài tập chuyển thể từ <b>Evolve Level 4</b> (Cambridge University Press); đề thi thật tổng hợp từ talkfirst.vn; band descriptors theo British Council / IDP / Cambridge.';
  renderTabs(); renderMain(); show(currentView);
}
currentView=ETABS[0].id;
setLang(MODE==='student'?'en':'vi');
function showKey(id){document.querySelectorAll('#'+id+' li').forEach(li=>{li.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(li.dataset.ans.replace(/\|/g,' / '))}</span>`;});}

</script>
</body>
