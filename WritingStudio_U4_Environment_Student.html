<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Studio · Unit 4 Environment · Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#d76b34; --orange-soft:#e7a173; --sage:#7f9a76; --sage-soft:#c3d0bd;
    --cream:#f1efe7; --paper:#ffffff; --ink:#232321; --muted:#6f6e66;
    --line:#e7e3d7; --yellow:#e9d9a6;
    --shadow:0 1px 2px rgba(30,28,22,.04),0 6px 20px rgba(30,28,22,.06);
    --shadow-lg:0 4px 30px rgba(30,28,22,.10);
    --font-head:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --rad:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);
    line-height:1.62;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:600}
  a{color:var(--orange)}
  /* Header */
  header.top{background:radial-gradient(120% 140% at 0% 0%,#33322d 0%,#1f1e1b 55%,#191814 100%);
    color:#fff;padding:20px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(215,107,52,.28),transparent 70%);pointer-events:none}
  header.top .paradigm{font-family:var(--font-head);font-size:15px;letter-spacing:6px;font-weight:600;
    color:#fff;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:11px;margin-bottom:13px;text-transform:uppercase}
  header.top .brand{font-size:12px;letter-spacing:4px;color:var(--orange-soft);font-weight:700}
  header.top h1{font-size:33px;margin:3px 0 6px;color:#fff;font-weight:600;letter-spacing:-.02em}
  header.top p{margin:0;color:#d3d0c6;font-size:13.5px;max-width:860px;line-height:1.55}
  header.top .langswitch{position:absolute;top:20px;right:26px;display:flex;gap:0;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;overflow:hidden;z-index:2}
  header.top .langswitch button{border:0;background:transparent;color:#d3d0c6;font:inherit;font-weight:700;
    font-size:12px;letter-spacing:.5px;padding:6px 13px;cursor:pointer;transition:.15s}
  header.top .langswitch button.on{background:var(--orange);color:#fff}
  /* Tabs */
  nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:9px 16px;
    box-shadow:0 2px 14px rgba(30,28,22,.05)}
  nav.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);
    padding:8px 15px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
  nav.tabs button:hover{background:var(--cream);color:var(--ink)}
  nav.tabs button.active{background:var(--ink);color:#fff}
  nav.tabs button .tno{font-size:10.5px;opacity:.65;margin-right:5px;font-weight:800}
  /* Layout */
  main{max-width:1090px;margin:0 auto;padding:28px 22px 90px}
  section.view{display:none;animation:fade .25s ease}
  section.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Sub nav */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
  .subnav button{border:1px solid var(--line);background:var(--paper);font:inherit;font-weight:600;
    font-size:13px;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
  .subnav button:hover{border-color:var(--sage)}
  .subnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .panel{display:none}
  .panel.on{display:block}
  /* Cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:22px 24px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .card h3{font-size:21px;margin-bottom:5px;color:var(--ink)}
  .card .lead{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:820px}
  .topichero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:4px 2px}
  .topichero .badge{width:60px;height:60px;border-radius:16px;
    background:linear-gradient(150deg,var(--orange),#c05a26);color:#fff;box-shadow:0 6px 16px rgba(199,90,40,.28);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:23px;font-weight:600;flex-shrink:0}
  .topichero h2{font-size:28px}
  .topichero p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  /* Vocab */
  .vgroup{margin-bottom:18px}
  .vgroup h4{font-size:15px;color:var(--orange);border-bottom:2px solid var(--sage-soft);
    padding-bottom:5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13.5px}
  .chip b{color:var(--ink)}
  .wtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .wtable td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
  .wtable td:first-child{font-weight:600;width:38%;background:var(--cream)}
  /* Rich vocabulary entries */
  .vsub{font-family:var(--font-head);font-size:13.5px;font-weight:600;color:#8a5a2c;display:flex;align-items:center;gap:9px;
    margin:20px 0 12px;letter-spacing:.01em}
  .vsub::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px;display:inline-block}
  .ventry{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:var(--paper);
    box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
  .ventry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .ventry .vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ventry .vw{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
  .ventry .pos{font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);padding:2px 9px;border-radius:12px;font-style:normal;letter-spacing:.3px}
  .ventry .ipa{font-family:var(--font-body);color:var(--orange);font-size:14px;font-weight:500}
  .ventry .vspeak{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:8px;
    cursor:pointer;font-size:13px;padding:3px 9px;color:var(--muted)}
  .ventry .vspeak:hover{border-color:var(--orange);color:var(--orange)}
  .ventry .vdef{font-size:13.6px;margin:2px 0}
  .ventry .vdef b{color:var(--sage);font-size:11px;letter-spacing:.5px;margin-right:4px}
  .ventry .vdef.vi b{color:var(--orange)}
  .ventry .vex{font-size:13.2px;font-style:italic;color:var(--muted);margin-top:6px;
    border-left:3px solid var(--sage-soft);padding-left:10px}
  .ventry .vex b{font-style:normal;color:var(--ink)}
  .ventry .vcol{font-size:12.4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;color:#5c5c54}
  .ventry .vcol b{display:block;color:var(--orange);font-size:9.5px;letter-spacing:.7px;margin-bottom:2px;font-weight:700}
  /* side-by-side vocabulary boxes */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;align-items:stretch}
  .vgrid .ventry{margin-bottom:0;display:flex;flex-direction:column}
  @media(max-width:640px){.vgrid{grid-template-columns:1fr}}
  /* Glossary */
  .gsearch{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font:inherit;
    font-size:14px;margin-bottom:16px;background:var(--paper)}
  .gsearch:focus{outline:none;border-color:var(--orange)}
  .gtopic{scroll-margin-top:70px}
  .gtopic h3{font-size:19px;color:var(--ink);border-bottom:2px solid var(--orange);padding-bottom:6px;margin:22px 0 4px}
  .gcount{font-size:12px;color:var(--muted);margin-bottom:6px}
  .gjump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .gjump a{font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);
    padding:4px 10px;border-radius:16px;background:var(--paper)}
  .gjump a:hover{border-color:var(--orange);color:var(--orange)}
  /* Idea development */
  .arg{border-left:4px solid var(--orange);background:var(--paper);border:1px solid var(--line);
    border-left-width:4px;border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:14px}
  .arg.against{border-left-color:var(--sage)}
  .arg .claim{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
  .arg .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;
    color:#fff;background:var(--orange);flex-shrink:0;margin-top:2px}
  .arg.against .tag{background:var(--sage)}
  .chain{list-style:none;margin:0;padding:0;counter-reset:step}
  .chain li{position:relative;padding:4px 0 4px 30px;font-size:13.8px;counter-increment:step}
  .chain li::before{content:counter(step);position:absolute;left:0;top:4px;width:20px;height:20px;
    background:var(--cream);border:1px solid var(--sage);border-radius:50%;font-size:11px;font-weight:700;
    color:var(--sage);display:flex;align-items:center;justify-content:center}
  .chain li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:24px;bottom:-2px;width:1px;background:var(--sage-soft)}
  .themetag{display:inline-block;background:var(--yellow);color:#6b5a1f;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:14px 0 8px}
  /* Practice bank */
  .prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .prompt .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px}
  .pill.new{background:var(--orange);color:#fff}
  .pill.file{background:var(--sage);color:#fff}
  .pill.common{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
  .pill.type{background:#efe7db;color:#8a6a3a}
  .prompt p{margin:0;font-size:14.5px}
  .prompt .date{font-size:11.5px;color:var(--muted);margin-left:auto}
  /* Checklist */
  .crit{margin-bottom:16px}
  .crit h4{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .crit h4 .k{background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-family:monospace}
  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .check input{margin-top:5px;width:16px;height:16px;accent-color:var(--sage);flex-shrink:0;cursor:pointer}
  .check label{cursor:pointer}
  /* Band table */
  .bandwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .bandsrc{font-size:11.6px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:var(--paper)}
  .bandgroup{margin-bottom:20px}
  .bghead{font-family:Georgia,serif;font-weight:700;font-size:15px;padding:9px 15px;border-radius:10px 10px 0 0;color:#fff}
  .bandgroup.bg-hi .bghead{background:#4f7a41}
  .bandgroup.bg-mid .bghead{background:#a5842f}
  .bandgroup.bg-lo .bghead{background:#b25a2e}
  .bandgroup .bandwrap{border-radius:0 0 12px 12px}
  .refcard ol{margin:8px 0 0;padding-left:20px}
  .refcard li{font-size:13.4px;margin-bottom:8px}
  .refcard .tag2{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);
    padding:2px 8px;border-radius:12px;margin-right:6px;letter-spacing:.4px}
  table.band{border-collapse:collapse;width:100%;min-width:760px;font-size:12.8px}
  table.band th,table.band td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
  table.band thead th{background:var(--ink);color:#fff;font-family:'Segoe UI',sans-serif;font-size:12.5px;position:sticky;top:0}
  table.band td.bn{font-weight:800;font-size:16px;text-align:center;font-family:Georgia,serif;width:46px}
  /* colour-coded by BAND: every criterion in one band shares the same tone (green→red) */
  table.band tr[data-b="9"] td{background:#dcebd4}
  table.band tr[data-b="8"] td{background:#e8f1de}
  table.band tr[data-b="7"] td{background:#f3f0d2}
  table.band tr[data-b="6"] td{background:#faedcc}
  table.band tr[data-b="5"] td{background:#f7e1d0}
  table.band tr[data-b="4"] td{background:#f3d7c7}
  table.band tr[data-b="9"] td.bn{background:#bcd9ae;color:#2f5626}
  table.band tr[data-b="8"] td.bn{background:#cfe3bf;color:#3a5f2b}
  table.band tr[data-b="7"] td.bn{background:#e7dfa6;color:#6f5f16}
  table.band tr[data-b="6"] td.bn{background:#f2dda6;color:#8a6716}
  table.band tr[data-b="5"] td.bn{background:#efc7ac;color:#9e5228}
  table.band tr[data-b="4"] td.bn{background:#e9b79c;color:#a8481f}
  table.band td b{color:#141414;font-weight:800}
  /* Sample essay */
  .essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 26px;font-size:14.5px}
  .essay h3{text-align:center;margin-bottom:16px;font-size:22px}
  .essay p{margin:0 0 13px;position:relative}
  .essay .num{position:absolute;left:-26px;color:var(--sage);font-weight:700;font-family:Georgia,serif}
  mark.hook{background:#f6ddc9;padding:1px 2px}
  mark.thesis{background:#d9e6d3;padding:1px 2px}
  mark.topic{background:#eee2c2;padding:1px 2px}
  mark.counter{background:#e3d4ea;padding:1px 2px}
  mark.refute{background:#cfe3e8;padding:1px 2px}
  mark.restate{background:#d9e6d3;padding:1px 2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
  /* Structure diagram */
  .flow{display:flex;flex-direction:column;gap:2px;max-width:640px;margin:8px 0}
  .flow div{color:var(--ink);padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px}
  .flow .f1{background:var(--orange);color:#fff;margin-right:0}
  .flow .f2{background:var(--orange-soft);margin-left:26px}
  .flow .f3{background:var(--yellow);margin-left:52px}
  .flow .f4{background:var(--sage-soft);margin-left:78px}
  .flow .f5{background:var(--ink);color:#fff;margin-left:104px}
  .flow small{display:block;font-weight:400;font-size:12px;opacity:.9}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.topichero h2{font-size:22px}}
  .typebox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .typebox h4{font-size:14.5px;color:var(--orange);margin-bottom:3px}
  .typebox .ex{font-size:12.8px;color:var(--muted);font-style:italic;margin-top:6px}
  .note{background:#fff7e8;border:1px solid var(--yellow);border-radius:10px;padding:12px 15px;font-size:13px;margin-bottom:16px}
  .qanalyze{background:#ecf3e9;border:1px solid var(--sage-soft);border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.4px}
  .qanalyze .row{display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;border-bottom:1px dashed #cdd8c5}
  .qanalyze .row:last-child{border-bottom:0}
  .qanalyze .lbl{font-weight:700;color:#4f6446;min-width:150px;flex-shrink:0}
  .qanalyze mark{background:#f6ddc9;padding:0 3px;border-radius:3px}
  .qanalyze mark.t{background:#e3d4ea}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .resetbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);margin-bottom:10px}
  .linkbtn{border:0;background:var(--sage);color:#fff;font:inherit;font-weight:700;font-size:12.5px;
    padding:3px 10px;border-radius:7px;cursor:pointer}
  .linkbtn:hover{background:#87997f}

  /* ===== Extension: Reading Lab / Clinic / Bank / Roadmap ===== */
  .rcard,details.gp,.bgroup,#guided,.card{scroll-margin-top:120px}
  .rsrc{margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  .rsrc-h{font-family:var(--font-head);font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rsrc-s{font-size:12.5px;color:var(--muted);font-style:italic}
  .rcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;transition:box-shadow .3s}
  .rcard.flash{box-shadow:0 0 0 3px var(--orange-soft)}
  .rhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .rref{font-family:monospace;font-weight:700;font-size:12px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:6px}
  .rpara{font-size:12px;color:var(--muted);font-weight:600}
  .rquote{margin:6px 0 10px;padding:10px 14px;border-left:4px solid var(--sage);background:#f7f5ee;border-radius:0 8px 8px 0;
    font-family:Georgia,'Times New Roman',serif;font-size:15.2px;line-height:1.7}
  .rquote mark{background:#f6ddc9;padding:0 2px;border-radius:3px}
  .rphr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{font-size:12px;background:#ecf3e9;border:1px solid var(--sage-soft);color:#4f6446;padding:3px 9px;border-radius:14px;cursor:pointer;font-weight:600}
  .chip:hover{background:var(--sage-soft)}
  .rqs{margin:0;padding-left:0;list-style:none}
  .rq{padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
  .rk{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:4px;background:var(--cream);color:var(--muted)}
  .rq-y .rk{background:#fbe9dc;color:#a4501f}
  .rq-cum .rk{background:#e3eedf;color:#4f6446}
  .xta{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;
    background:#fffdf8;resize:vertical;color:var(--ink)}
  .xta:focus{outline:2px solid var(--sage-soft);border-color:var(--sage)}
  details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--orange);margin-top:6px;user-select:none}
  .ans{background:#ecf3e9;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.8px}
  .errnote{background:#fff1ec;border:1px solid #f1c7b0;border-radius:8px;padding:7px 12px;margin-top:6px;font-size:13px}
  .rule{background:#f7f5ee;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13.2px}
  .code{font-family:monospace;font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .cgroup{margin-top:26px}
  .cgroup h4{font-size:18px;margin-bottom:4px}
  .citem{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 15px;margin:10px 0}
  .citem.ok{border-left-color:var(--sage)}
  .citem.bad{border-left-color:var(--orange)}
  .cq{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:14.2px}
  .ctype{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-top:2px}
  .wrong{color:#a4501f;text-decoration:line-through;text-decoration-color:rgba(164,80,31,.35);flex:1 1 300px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  @media(max-width:720px){.opts{grid-template-columns:1fr}}
  .opt{text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .opt:hover:not([disabled]){border-color:var(--sage)}

const TEXTS4 = {
 defo:{ title:"Deforestation",
  paras:[
   {t:`Deforestation means ${H('the removal of a forest')} so that the land is ${H('converted for urban use or agriculture')}. The destruction of forests occurs for many reasons: trees are used as fuel or for construction, while cleared land is used as ${H('pasture for livestock')} and crop plantations. ${H('The main adverse effects of deforestation are')} aridity and ${H('damage to animal habitat')}, as well as climate change and ${H('erosion damage')}.`, cards:["DF-1"]},
   {t:`${H('The main causes of deforestation are')} ${H('commercial agriculture by big business')} and ${H('subsistence farming by local people')}. In Indonesia, ${H('industrial logging')} is carried out to clear areas for the production of palm oil while in Brazil, large areas of the Amazon rainforest were cleared to grow soya and vegetable oil. Subsistence farmers clear an area big enough to graze cattle or grow crops by cutting down the trees and burning them. However, after two or three years, the land can no longer be used so the farmer moves to another piece of land. It takes around ten years for the piece of land to recover. However, in populated areas, the land cannot recover and ${H('this leads to heavy erosion')} because the layer of soil that protects the ground is removed during the crop-growing process. ${H('This can cause flooding problems')} in heavy rain.`, cards:["DF-2","DF-3"]},
   {t:`One area affected by deforestation is the Amazon Basin in Brazil. The vast rainforests of the Amazon cover an area around 25 times the size of the UK and ${H('absorb an estimated 1.5 billion tonnes of carbon dioxide annually')}. They are thought to have helped ${H('keep global warming under control')} in recent years. However, in areas where deforestation has taken place, the increased temperatures ${H('result in less rain')} because there are not enough trees to provide water for clouds to form. If tropical forests dry out, more trees will die and there will be more logging and more fires. ${H('This will cause more emissions of carbon dioxide')}, making the rainforest ${H('contribute to global warming rather than help solve it')}.`, cards:["DF-4"]},
   {t:`Forest destruction is also ${H('having an effect on biodiversity')}. The growth in the world’s population is causing ${H('the loss of habitats')} and damage to land where plants and animal species live, ${H('reducing biodiversity and leading to the extinction of many species')}. A decrease in biodiversity ${H('threatens entire ecosystems')} and destroys ${H('future sources of food and medicine')}.`, cards:["DF-5"]},
   {t:`The damage caused by humans to the world’s forests leads to changes in ${H('the natural environment')} and causes global warming. ${H('Governments should act to protect forests from illegal logging')} and ${H('plant more trees to absorb carbon dioxide')}. Deforestation ${H('on such a large scale')} is sure to ${H('have disastrous effects for the environment')}.`, cards:["DF-6"]}
  ]},
 interview:{ titleOpts:["Controlling the flow","The best way to protect people from flooding","What to do about risk","Protecting your house against flooding"],
  intro:"The world has always had to face water-based natural disasters, such as tsunami and hurricanes. In an illuminating interview, <i>Water Management Monthly</i> talks to Dan Smith, who works in ‘disaster mitigation’ for a government ministry.",
  qa:[
   {q:"Dan, could you tell us what disaster mitigation means?", a:`Disaster mitigation means ${H('attempting to minimize the impact of natural disasters')} both before and after they happen. My department and I work in <b>two specific areas</b> in order to try and do this: ${H('risk reduction and risk analysis')}. They are both ${H('equally crucial')} in disaster mitigation.`, cards:["IV-1"]},
   {q:"What do you mean by risk reduction?", a:`Risk reduction means many things. <b>It</b> is not just referring to ${H('big engineering projects like dams')}. Often, ${H('small community projects can be the most effective means of')} risk reduction. The main way floods can be prevented is by ${H('the construction and maintenance of')} earth wall defences, or levees. <b>These</b> block the progress of rising water. However, even the best levees can’t protect against ${H('the destructive power of a tsunami')}. In <b>this case</b>, ${H('early-warning systems are lifesavers')}. They can let people know as early as possible if there is likely to be flooding.`, cards:["IV-2"]},
   {q:"What types of risk analysis do you do?", a:`Firstly, risk analysis concerns ${H('flood mapping')}, where we identify the parts of the country which are ${H('at most risk from flooding')}. Secondly, there is ${H('mitigation planning')}, which means helping local communities plan for ${H('when disaster strikes')}. Thirdly, <b>we</b> make sure that the country’s dams all work properly and are safe. ${H('Although many people criticize dams because of their environmental impact, there are many benefits to them too')}, such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. ${H('In terms of a cost-benefit analysis')}, we are definitely ahead.`, cards:["IV-3"]},
   {q:"Do you think countries are better prepared now for natural disasters than they were in the past?", a:`Definitely. We are constantly developing new ${H('flood-prevention solutions')}. An example of <b>one such measure</b> can be found in the UK, with the Thames Barrier. This is ${H('an enormous engineering project')} designed to prevent London from flooding.`, cards:[]},
   {q:"Aren’t programmes like <b>that</b> very expensive? What lower-cost alternatives are there?", a:`Flood prevention does not have to be expensive. Sandbags, for example, can be ${H('a highly effective way of')} stopping flood water.`, cards:[]},
   {q:"Is there any more which can be done, or are we as prepared as we can be?", a:`There’s always more which could be done. But remember that ${H('the government can only be responsible for flood prevention up to a certain point')}. People have to ${H('become aware of the dangers of flooding themselves')}. This is crucial. Expensive early-warning systems are ${H('a waste of money if people take no notice of them')}.`, cards:["IV-4"]}
  ]},
 report:{ title:"Combating drought in rural Africa: a report",
  paras:[
   {n:1,t:`In order to ${H('mitigate the problems which drought can bring')}, there are several ${H('short- and long-term strategies')} which can be adopted. ${H('A range of policies designed to combat these problems')} exist ${H('at local, national and international levels')}. As well as looking at these issues in general, this report will ${H('make specific recommendations')} in the case of Kenya, where drought has been a major problem in recent years.`, cards:[]},
   {n:2,t:`Droughts frequently ${H('put millions of people at risk of food insecurity')} in central Kenya. The area is so dry that it cannot support agricultural crops. There are few permanent rivers and the seasonal waterways, which are the result of flood waters in the rainy months, disrupt transport across the region. The population of this area mainly ${H('live off their cattle')}. Droughts can quickly kill off their herd, leaving little or no income, and because the area is so vast, ${H('infrastructure is under-developed')}, meaning that access to the population is difficult.`, cards:["DR-1"]},
   {n:3,t:`When drought is predicted in central Kenya, it is important to prepare for it and be ready to respond to it as quickly as possible in order to ${H('minimize casualties')}. ${H('Preventive measures')} which may be adopted before a drought include recycling water. This is ${H('highly cost-effective')}. Recycled water, from the washing of clothes for example, can be given to animals and used to irrigate land. Once drought strikes, ${H('the most important short-term response is to')} transport bottles of drinking water into the drought area, although this is quite expensive. Since drought also often kills animals and crops, ${H('it is vital to')} bring food to prevent people from starving.`, cards:["DR-2"]},
   {n:4,t:`Since drought tends to reoccur in the same central areas of Kenya, ${H('long-term solutions are also necessary')}. ${H('Drought monitoring')} does not have to be expensive, and it should be possible to gather relevant data fairly cheaply, which can then be used for appropriate planning at the local and national levels. This usually involves developing ${H('irrigation systems')} for farming communities, or building canals and dams to benefit villages and cities. On a micro-scale, the construction of wells can help provide more water ${H('at medium cost and in reasonable timeframes')}. On a wider scale, ${H('desalination plants')}, which remove salt from sea water, also make drinking water available, but at a higher cost. Additionally, ${H('harvesting rainwater')} involves collecting and storing any rain that does fall. The majority of these strategies are undoubtedly expensive and ${H('may only be affordable for richer countries')}, which have the technology and expertise to predict and plan for drought more effectively.`, cards:["DR-3"]},
   {n:5,t:`Poorer countries, on the other hand, are generally unable to afford long-term solutions, and may have to ${H('rely on international support and charity')} in the short-term. Lack of education and under-developed infrastructure may also ${H('hamper')} some of these projects.`, cards:["DR-3"]},
   {n:6,t:`As a result of this report, the three following recommendations for Kenya are made. First, ${H('provide training in')} recycling and harvesting water throughout the country at a local level. Second, ${H('implement a well-construction programme')}, ${H('so as to maximize')} the amount of water available nationally. Thirdly, ${H('lobby the international community to provide funding for')} a desalination plant on the coast, ${H('to ensure that')} Kenya can always meet its water needs.`, cards:["DR-4"]}
  ]},

const Q=(k,vq,eq,va,ea,ve,ee)=>({k,q:bi(vq,eq),a:bi(va,ea),err:(ve||ee)?bi(ve,ee):undefined});
const READING = { t1:{
 intro:{vi:"Mỗi thẻ là <b>một đoạn trích nguyên văn</b> từ bài đọc. Làm theo 3 bước: <b>① Hiểu</b> → <b>② Khai thác ý</b> (ý này dùng cho đề nào?) → <b>③ Mượn cụm từ</b> (viết câu mới cho đề thi thật). Unit này rất mạnh về <b>chuỗi nguyên nhân → kết quả</b>: hãy để ý các mũi tên lập luận trong từng đoạn.",
        en:"Each card is a <b>verbatim extract</b> from the readings. Work in 3 steps: <b>① Understand</b> → <b>② Mine the idea</b> (which prompt can it serve?) → <b>③ Borrow the phrase</b> (write a new sentence for a real exam prompt). This unit is rich in <b>cause → effect chains</b>: notice how each argument moves step by step."},
 sources:[
 {id:"defo", title:"Reading 1 · Deforestation", sub:bi("Bài viết giải thích: định nghĩa → nguyên nhân → hệ quả → giải pháp","Explanatory text: definition → causes → effects → solution"), cards:[
  {ref:"DF-1", para:"Definition & effects",
   quote:"Deforestation means <mark>the removal of a forest</mark> so that the land is <mark>converted for urban use or agriculture</mark>. […] <mark>The main adverse effects of deforestation are</mark> aridity and <mark>damage to animal habitat</mark>, as well as climate change and <mark>erosion damage</mark>.",
   phrases:["X means …","be converted for … use","The main adverse effects of X are …","damage to animal habitat"],
   qs:[Q("hieu","Câu cuối liệt kê 4 hệ quả. Cấu trúc nào giúp liệt kê gọn trong MỘT câu?","The last sentence lists four effects. Which structure lists them neatly in ONE sentence?",
      "<b>The main adverse effects of X are A and B, as well as C and D.</b> → mẫu câu tổng quát rất hợp làm topic sentence cho đoạn “effects”.","<b>The main adverse effects of X are A and B, as well as C and D.</b> → an ideal topic-sentence pattern for an ‘effects’ paragraph."),
    Q("cum","Viết topic sentence cho đoạn hệ quả của đề <i>“Household waste is increasing”</i> theo mẫu trên.","Write a topic sentence for the effects paragraph of <i>“Household waste is increasing”</i> using this pattern.",
      "<b>The main adverse effects of</b> rising household waste <b>are</b> overflowing landfill sites and polluted rivers, <b>as well as</b> the release of greenhouse gases.","<b>The main adverse effects of</b> rising household waste <b>are</b> overflowing landfill sites and polluted rivers, <b>as well as</b> the release of greenhouse gases.",
      "✗ The main adverse effect<u>s</u> of X <u>is</u> → chủ ngữ số nhiều <b>effects … are</b>.","✗ The main adverse effect<u>s</u> of X <u>is</u> → plural subject: <b>effects … are</b>.")]},
  {ref:"DF-2", para:"Causes",
   quote:"<mark>The main causes of deforestation are</mark> <mark>commercial agriculture by big business</mark> and <mark>subsistence farming by local people</mark>. In Indonesia, <mark>industrial logging</mark> is carried out to clear areas for the production of palm oil while in Brazil, large areas of the Amazon rainforest were cleared to grow soya and vegetable oil.",
   phrases:["The main causes of X are …","commercial agriculture by big business","subsistence farming by local people","X is carried out to …"],
   qs:[Q("y","Đoạn này phân chia trách nhiệm cho HAI nhóm. Dùng ý này cho đề <i>“Individuals can do nothing to improve the environment; only governments and large companies can.”</i> thế nào?","The extract splits responsibility between TWO groups. How can you use this for <i>“Individuals can do nothing to improve the environment; only governments and large companies can.”</i>?",
      "Doanh nghiệp lớn gây phá rừng quy mô lớn (công nghiệp) → ủng hộ vai trò của công ty/chính phủ; nhưng người dân địa phương cũng góp phần → cá nhân không phải “vô can”.","Big business causes large-scale deforestation → supports the role of companies and governments; but local people also contribute → individuals are not powerless or blameless."),
    Q("cum","Viết câu nguyên nhân với <b>The main causes of … are … and …</b> cho đề rác thải sinh hoạt.","Write a cause sentence with <b>The main causes of … are … and …</b> for the household-waste prompt.",
      "<b>The main causes of</b> rising household waste <b>are</b> excessive packaging by manufacturers <b>and</b> a throwaway culture among consumers.","<b>The main causes of</b> rising household waste <b>are</b> excessive packaging by manufacturers <b>and</b> a throwaway culture among consumers.",
      "✗ The main reason<u>s</u> of → <b>the main causes of / the main reasons for</b>.","✗ The main reasons <u>of</u> → <b>the main causes of / the main reasons for</b>.")]},
  {ref:"DF-3", para:"Erosion chain",
   quote:"However, in populated areas, the land cannot recover and <mark>this leads to heavy erosion</mark> because the layer of soil that protects the ground is removed during the crop-growing process. <mark>This can cause flooding problems</mark> in heavy rain.",
   phrases:["this leads to …","because …","This can cause …"],
   qs:[Q("hieu","Vẽ chuỗi nhân quả của đoạn này (ít nhất 4 mắt xích).","Draw the cause–effect chain in this extract (at least four links).",
      "Phá rừng/canh tác → đất không phục hồi → mất lớp đất bảo vệ → xói mòn nặng → lũ khi mưa lớn. Mỗi câu bắt đầu bằng <b>this</b> = kết quả của câu trước (given → new).","Clearing land → the land cannot recover → the protective soil layer is removed → heavy erosion → flooding in heavy rain. Each sentence starts with <b>this</b> = the result of the previous one (given → new)."),
    Q("cum","Viết chuỗi 3 câu (dùng <b>this leads to</b> và <b>This can cause</b>) về việc dùng nhiều ô tô chạy xăng.","Write a three-sentence chain (with <b>this leads to</b> and <b>This can cause</b>) about using petrol cars.",
      "Millions of petrol cars burn fossil fuels every day, and <b>this leads to</b> high levels of carbon dioxide in the atmosphere. Rising CO₂ traps heat around the planet. <b>This can cause</b> more frequent heatwaves and droughts.","Millions of petrol cars burn fossil fuels every day, and <b>this leads to</b> high levels of carbon dioxide in the atmosphere. Rising CO₂ traps heat around the planet. <b>This can cause</b> more frequent heatwaves and droughts.",
      "✗ This leads to <u>increase</u> → <b>leads to an increase in</b>.","✗ This leads to <u>increase</u> → <b>leads to an increase in</b>.")]},
  {ref:"DF-4", para:"The Amazon",
   quote:"The vast rainforests of the Amazon […] <mark>absorb an estimated 1.5 billion tonnes of carbon dioxide annually</mark>. […] However, in areas where deforestation has taken place, the increased temperatures <mark>result in less rain</mark> […]. If tropical forests dry out, more trees will die and there will be more logging and more fires. <mark>This will cause more emissions of carbon dioxide</mark>, making the rainforest <mark>contribute to global warming rather than help solve it</mark>.",
   phrases:["absorb … annually","result in less rain","If … will …","contribute to X rather than help solve it"],
   qs:[Q("y","Đây là ví dụ cụ thể có số liệu. Dùng cho đề <i>“Outline the human causes of climate change. What effects will these have?”</i> ở phần nào?","This is a specific example with figures. Where can you use it in <i>“Outline the human causes of climate change. What effects will these have?”</i>",
      "Phần nguyên nhân (phá rừng làm mất “bể chứa” CO₂) VÀ phần hệ quả (vòng luẩn quẩn: nóng → khô → cháy → thêm CO₂).","Both the causes paragraph (deforestation removes a carbon ‘sink’) AND the effects paragraph (a vicious circle: heat → drought → fires → more CO₂)."),
    Q("cum","Viết câu dùng <b>contribute to … rather than help solve it</b> về xe điện chạy bằng điện than.","Write a sentence with <b>contribute to … rather than help solve it</b> about electric cars charged with coal power.",
      "If electric cars are charged with electricity from coal-fired power stations, they may <b>contribute to</b> air pollution <b>rather than help solve it</b>.","If electric cars are charged with electricity from coal-fired power stations, they may <b>contribute to</b> air pollution <b>rather than help solve it</b>.",
      "✗ contribute <u>for</u> / contribute to <u>reduce</u> → <b>contribute to + N / V-ing</b>.","✗ contribute <u>for</u> / contribute to <u>reduce</u> → <b>contribute to + noun / -ing</b>.")]},
  {ref:"DF-5", para:"Biodiversity",
   quote:"Forest destruction is also <mark>having an effect on biodiversity</mark>. The growth in the world’s population is causing <mark>the loss of habitats</mark> […], <mark>reducing biodiversity and leading to the extinction of many species</mark>. A decrease in biodiversity <mark>threatens entire ecosystems</mark> and destroys <mark>future sources of food and medicine</mark>.",
   phrases:["have an effect on","the loss of habitats","…, reducing X and leading to Y","threaten entire ecosystems"],
   qs:[Q("y","Đề <i>“Species extinction is a natural process, so humans should not try to prevent it.”</i> — câu cuối giúp phản bác thế nào?","Prompt: <i>“Species extinction is a natural process, so humans should not try to prevent it.”</i> How does the last sentence help you disagree?",
      "Tuyệt chủng hiện nay do CON NGƯỜI gây ra (mất môi trường sống), không phải tự nhiên; và mất đa dạng sinh học đe doạ cả hệ sinh thái, nguồn thực phẩm, thuốc của chính con người.","Today’s extinctions are caused by HUMANS (habitat loss), not nature; and the loss of biodiversity threatens whole ecosystems and our own future food and medicine."),
    Q("cum","Viết câu với cấu trúc phân từ <b>…, reducing … and leading to …</b>.","Write a sentence with the participle structure <b>…, reducing … and leading to …</b>.",
      "Plastic waste is entering the oceans in huge quantities, <b>reducing</b> fish populations <b>and leading to</b> the death of many seabirds.","Plastic waste is entering the oceans in huge quantities, <b>reducing</b> fish populations <b>and leading to</b> the death of many seabirds.",
      "✗ …, <u>it reduces</u> … → dùng phân từ <b>reducing</b> để tránh comma splice.","✗ …, <u>it reduces</u> … → use the participle <b>reducing</b> to avoid a comma splice.")]},
  {ref:"DF-6", para:"Conclusion",
   quote:"<mark>Governments should act to protect forests from illegal logging</mark> and <mark>plant more trees to absorb carbon dioxide</mark>. Deforestation <mark>on such a large scale</mark> is sure to <mark>have disastrous effects for the environment</mark>.",
   phrases:["act to protect X from Y","plant more trees to absorb carbon dioxide","on such a large scale","have disastrous effects"],
   qs:[Q("cum","Viết câu giải pháp cho đề rác thải dùng <b>Governments should act to …</b>","Write a solution sentence for the waste prompt with <b>Governments should act to …</b>","<b>Governments should act to</b> limit unnecessary packaging by taxing manufacturers that use excessive plastic.","<b>Governments should act to</b> limit unnecessary packaging by taxing manufacturers that use excessive plastic.",
      "✗ protect forests <u>of</u> illegal logging → <b>protect … from</b>.","✗ protect forests <u>of</u> illegal logging → <b>protect … from</b>.")]}
 ]},
 {id:"iv", title:"Reading 2 · An interview with a disaster-mitigation expert", sub:bi("Phỏng vấn — giải pháp ngắn hạn/dài hạn, đắt/rẻ, trách nhiệm cá nhân","Interview — short/long-term and costly/cheap solutions, personal responsibility"), cards:[
  {ref:"IV-1", para:"Definition",
   quote:"Disaster mitigation means <mark>attempting to minimize the impact of natural disasters</mark> both before and after they happen. My department and I work in two specific areas in order to try and do this: <mark>risk reduction and risk analysis</mark>. They are both <mark>equally crucial</mark>.",
   phrases:["minimize the impact of","both before and after","risk reduction / risk analysis","equally crucial"],
   qs:[Q("hieu","<i>risk reduction</i> và <i>risk analysis</i> là danh từ ghép học thuật. Viết lại mỗi cụm thành một mệnh đề đầy đủ.","<i>risk reduction</i> and <i>risk analysis</i> are academic noun phrases. Rewrite each one as a full clause.",
      "risk reduction = reducing risk; risk analysis = analysing risk. Danh từ ghép giúp câu ngắn gọn, học thuật (kỹ năng Academic noun phrases).","risk reduction = reducing risk; risk analysis = analysing risk. Noun phrases make writing concise and academic (Academic noun phrases skill)."),
    Q("cum","Viết câu với <b>minimize the impact of</b> cho đề về biến đổi khí hậu.","Write a sentence with <b>minimize the impact of</b> for a climate-change prompt.",
      "Coastal cities must invest in flood defences to <b>minimize the impact of</b> rising sea levels.","Coastal cities must invest in flood defences to <b>minimize the impact of</b> rising sea levels.",
      "✗ minimize the impact <u>to</u> → <b>the impact of X on Y</b>.","✗ minimize the impact <u>to</u> → <b>the impact of X on Y</b>.")]},
  {ref:"IV-2", para:"Risk reduction",
   quote:"It is not just referring to <mark>big engineering projects like dams</mark>. Often, <mark>small community projects can be the most effective means of</mark> risk reduction. […] However, even the best levees can’t protect against <mark>the destructive power of a tsunami</mark>. In this case, <mark>early-warning systems are lifesavers</mark>.",
   phrases:["not just … but …","small community projects","the most effective means of","the destructive power of"],
   qs:[Q("y","Đề <i>“Individuals can do nothing to improve the environment; only governments and large companies can.”</i> — câu “small community projects can be the most effective” ủng hộ phía nào?","Prompt: <i>“Individuals can do nothing…; only governments and large companies can.”</i> Which side does ‘small community projects can be the most effective’ support?",
      "Phản bác đề: dự án nhỏ của cộng đồng (thu gom rác, trồng cây, tái chế) đôi khi hiệu quả nhất → cá nhân KHÔNG bất lực.","It challenges the statement: small community projects (clean-ups, tree planting, recycling) can be the most effective → individuals are NOT powerless."),
    Q("cum","Viết câu dùng <b>the most effective means of</b>.","Write a sentence with <b>the most effective means of</b>.",
      "Local recycling schemes are often <b>the most effective means of</b> reducing household waste.","Local recycling schemes are often <b>the most effective means of</b> reducing household waste.",
      "✗ the most effective <u>mean</u> → <b>means</b> (số ít và số nhiều giống nhau).","✗ the most effective <u>mean</u> → <b>means</b> (same form in singular and plural).")]},
  {ref:"IV-3", para:"Dams",
   quote:"<mark>Although many people criticize dams because of their environmental impact, there are many benefits to them too</mark>, such as hydroelectricity, irrigation, water storage, water sports and, of course, flood control. <mark>In terms of a cost-benefit analysis</mark>, we are definitely ahead.",
   phrases:["Although many people criticize X because of …, there are many benefits to them too","environmental impact","In terms of a cost-benefit analysis"],
   qs:[Q("y","Câu đầu là mẫu NHƯỢNG BỘ hoàn hảo cho đề Adv/Disadv. Áp dụng cho đề <i>“Countries are switching from fossil fuels to solar and wind power: positive or negative?”</i>","The first sentence is a perfect CONCESSION pattern for Adv/Disadv essays. Apply it to <i>“Countries are switching from fossil fuels to solar and wind power: positive or negative?”</i>",
      "Although many people criticize wind farms because of their impact on the landscape, there are many benefits to them too, such as clean electricity and new jobs.","Although many people criticize wind farms because of their impact on the landscape, there are many benefits to them too, such as clean electricity and new jobs."),
    Q("cum","Viết câu đánh giá với <b>In terms of a cost-benefit analysis, …</b>","Write an evaluation sentence starting <b>In terms of a cost-benefit analysis, …</b>","<b>In terms of a cost-benefit analysis</b>, solar panels clearly pay for themselves within a decade.","<b>In terms of a cost-benefit analysis</b>, solar panels clearly pay for themselves within a decade.",
      "✗ Although … , <u>but</u> there are … → bỏ <i>but</i> (ôn Unit 1–2).","✗ Although … , <u>but</u> there are … → drop <i>but</i> (review Units 1–2).")]},
  {ref:"IV-4", para:"Personal responsibility",
   quote:"Remember that <mark>the government can only be responsible for flood prevention up to a certain point</mark>. People have to <mark>become aware of the dangers of flooding themselves</mark>. This is crucial. Expensive early-warning systems are <mark>a waste of money if people take no notice of them</mark>.",
   phrases:["can only be responsible for X up to a certain point","become aware of","a waste of money if …","take no notice of"],
   qs:[Q("y","Ý này dùng cho đề nào trong Ngân hàng đề (nhóm B)? Viết topic sentence.","Which bank prompt (group B) can use this idea? Write a topic sentence.",
      "Đề “Individuals can do nothing… only governments” hoặc “Politicians bear more responsibility than individuals”: <i>However, governments can only be responsible for protecting the environment up to a certain point; without the cooperation of ordinary citizens, even the best policies will fail.</i>","“Individuals can do nothing… only governments” or “Politicians bear more responsibility than individuals”: <i>However, governments can only be responsible for protecting the environment up to a certain point; without the cooperation of ordinary citizens, even the best policies will fail.</i>"),
    Q("cum","Viết câu với <b>a waste of money if …</b> về chương trình tái chế.","Write a sentence with <b>a waste of money if …</b> about recycling schemes.",
      "Recycling bins on every street are <b>a waste of money if</b> residents <b>take no notice of</b> the instructions for sorting their rubbish.","Recycling bins on every street are <b>a waste of money if</b> residents <b>take no notice of</b> the instructions for sorting their rubbish.",
      "✗ aware <u>about</u> → <b>aware of</b>.","✗ aware <u>about</u> → <b>aware of</b>.")]}
 ]},
 {id:"dr", title:"Reading 3 · Combating drought in rural Africa: a report", sub:bi("Báo cáo — vấn đề → giải pháp ngắn/dài hạn → khuyến nghị","Report — problem → short/long-term solutions → recommendations"), cards:[
  {ref:"DR-1", para:"2 · Effects of drought",
   quote:"Droughts frequently <mark>put millions of people at risk of food insecurity</mark> in central Kenya. […] Droughts can quickly kill off their herd, <mark>leaving little or no income</mark>, and because the area is so vast, <mark>infrastructure is under-developed</mark>, <mark>meaning that</mark> access to the population is difficult.",
   phrases:["put sb at risk of","food insecurity","…, leaving …","…, meaning that …"],
   qs:[Q("hieu","Hai cụm <b>leaving …</b> và <b>meaning that …</b> có chức năng gì?","What job do <b>leaving …</b> and <b>meaning that …</b> do?",
      "Cả hai nối HỆ QUẢ vào cuối câu mà không cần câu mới → câu phức tự nhiên, tránh lặp “so”.","Both attach a CONSEQUENCE to the end of the sentence without starting a new one → natural complex sentences, no repeated ‘so’."),
    Q("cum","Viết câu hệ quả biến đổi khí hậu dùng <b>put … at risk of</b> và <b>…, leaving …</b>.","Write a climate-change effect sentence with <b>put … at risk of</b> and <b>…, leaving …</b>.",
      "Rising sea levels <b>put</b> millions of coastal residents <b>at risk of</b> flooding, <b>leaving</b> many families homeless.","Rising sea levels <b>put</b> millions of coastal residents <b>at risk of</b> flooding, <b>leaving</b> many families homeless.",
      "✗ put people <u>in risk</u> → <b>put people at risk of</b>.","✗ put people <u>in risk</u> → <b>put people at risk of</b>.")]},
  {ref:"DR-2", para:"3 · Short-term strategies",
   quote:"<mark>Preventive measures</mark> which may be adopted before a drought include recycling water. This is <mark>highly cost-effective</mark>. […] Once drought strikes, <mark>the most important short-term response is to</mark> transport bottles of drinking water into the drought area, <mark>although this is quite expensive</mark>.",
   phrases:["preventive measures","highly cost-effective","the most important short-term response is to …","…, although this is …"],
   qs:[Q("y","Đoạn này đánh giá giải pháp theo 2 tiêu chí: thời gian & chi phí. Áp dụng 2 tiêu chí này cho giải pháp của đề “household waste”.","This paragraph judges solutions by two criteria: time and cost. Apply them to solutions for the household-waste prompt.",
      "Ngắn hạn, rẻ: thu phí túi nilon, phân loại rác tại nguồn. Dài hạn, đắt: nhà máy tái chế, luật bắt buộc nhà sản xuất giảm bao bì.","Short-term, cheap: charging for plastic bags, sorting waste at home. Long-term, costly: recycling plants, laws forcing manufacturers to cut packaging."),
    Q("cum","Viết câu giải pháp + nhượng bộ dùng <b>…, although this is …</b>.","Write a solution + concession sentence with <b>…, although this is …</b>.",
      "Building modern recycling plants is the most effective long-term solution, <b>although this is</b> extremely expensive for developing countries.","Building modern recycling plants is the most effective long-term solution, <b>although this is</b> extremely expensive for developing countries.",
      "✗ cost-effective <u>with</u> → <b>cost-effective</b> (tính từ đứng một mình) / <b>a cost-effective way of</b>.","✗ cost-effective <u>with</u> → <b>cost-effective</b> (stands alone) / <b>a cost-effective way of</b>.")]},
  {ref:"DR-3", para:"4–5 · Long-term strategies & cost",
   quote:"The majority of these strategies are undoubtedly expensive and <mark>may only be affordable for richer countries</mark>, which have <mark>the technology and expertise</mark> to predict and plan for drought more effectively. Poorer countries, <mark>on the other hand</mark>, are generally unable to afford long-term solutions, and may have to <mark>rely on international support and charity</mark> in the short-term.",
   phrases:["may only be affordable for","the technology and expertise","on the other hand","rely on international support"],
   qs:[Q("y","Đề <i>“Environmental problems should be solved by one international organisation rather than by each national government.”</i> — dùng ý giàu/nghèo thế nào?","Prompt: <i>“Environmental problems should be solved by one international organisation rather than by each national government.”</i> How can you use the rich/poor idea?",
      "Nước nghèo không đủ tiền và chuyên môn → cần một tổ chức quốc tế huy động tài chính, công nghệ (ủng hộ đề). Đồng thời mỗi chính phủ hiểu rõ tình hình địa phương (phía còn lại).","Poorer countries lack money and expertise → an international body can pool funding and technology (supports the statement). National governments, however, understand local conditions best (the other side)."),
    Q("cum","Viết câu với <b>may only be affordable for</b> + <b>on the other hand</b>.","Write a sentence with <b>may only be affordable for</b> + <b>on the other hand</b>.",
      "Electric cars <b>may only be affordable for</b> wealthier families; low-income households, <b>on the other hand</b>, often depend on old, polluting vehicles.","Electric cars <b>may only be affordable for</b> wealthier families; low-income households, <b>on the other hand</b>, often depend on old, polluting vehicles.",
      "✗ <u>On the other hands</u> → <b>On the other hand</b>; ✗ rely <u>in</u> → <b>rely on</b>.","✗ <u>On the other hands</u> → <b>On the other hand</b>; ✗ rely <u>in</u> → <b>rely on</b>.")]},
  {ref:"DR-4", para:"6 · Recommendations",
   quote:"First, <mark>provide training in</mark> recycling and harvesting water throughout the country at a local level. Second, <mark>implement a well-construction programme</mark>, <mark>so as to maximize</mark> the amount of water available nationally. Thirdly, <mark>lobby the international community to provide funding for</mark> a desalination plant on the coast, <mark>to ensure that</mark> Kenya can always meet its water needs.",
   phrases:["provide training in","implement a … programme","so as to maximize","to ensure that …"],
   qs:[Q("hieu","Mỗi khuyến nghị có cấu trúc gì? Vì sao đây là mẫu tốt cho đoạn giải pháp?","What structure does each recommendation follow? Why is it a good model for a solutions paragraph?",
      "Hành động (động từ) + mục đích (so as to / to ensure that) → giải pháp cụ thể: AI làm GÌ, để ĐẠT GÌ.","Action (verb) + purpose (so as to / to ensure that) → a specific solution: WHO does WHAT, to ACHIEVE what."),
    Q("cum","Viết 2 giải pháp cho đề <i>“Fewer people use bicycles. How can they be encouraged?”</i> dùng <b>so as to</b> và <b>to ensure that</b>.","Write two solutions for <i>“Fewer people cycle. How can they be encouraged?”</i> with <b>so as to</b> and <b>to ensure that</b>.",
      "City councils should build separate cycle lanes <b>so as to</b> make cycling safer. They could also provide secure bicycle parking at stations <b>to ensure that</b> commuters can combine cycling with public transport.","City councils should build separate cycle lanes <b>so as to</b> make cycling safer. They could also provide secure bicycle parking at stations <b>to ensure that</b> commuters can combine cycling with public transport.",
      "✗ so as <u>maximize</u> → <b>so as to maximize</b>.","✗ so as <u>maximize</u> → <b>so as to maximize</b>.")]}
 ]},
 {id:"sk", title:bi("Kỹ năng · Academic noun phrases + Expressing solutions using it","Skills texts · Academic noun phrases + Expressing solutions using it"), sub:bi("Mẫu câu trong tài liệu","Model sentences from the course"), cards:[

 intro:{vi:"Các câu dưới đây dựa trên <b>lỗi thật của học sinh Việt Nam</b> khi viết về môi trường. Trọng tâm unit (theo tài liệu): <b>because / because of / due to / caused by</b>, <b>cấu trúc It</b> để nêu giải pháp và <b>danh từ ghép học thuật</b>. Ôn lại G-CE (Unit 3), G-ART, G-RUN.",

 groups:[
 {id:"gra", icon:"🧩", title:{vi:"A · Ngữ pháp câu (GRA)",en:"A · Sentence grammar (GRA)"},
  lead:{vi:"Mục tiêu: 0 lỗi because/because of, 0 lỗi cấu trúc It, dùng được ≥ 3 danh từ ghép trong mỗi bài.",en:"Target: zero because/because of errors, zero it-structure errors, at least 3 noun phrases in every essay."},
  items:[
  fx("G-CE","Many animals are dying because of their habitats are being destroyed.","Many animals are dying <b>because</b> their habitats are being destroyed. / … <b>because of</b> habitat destruction.","<b>because + mệnh đề</b>; <b>because of / due to + danh từ</b> (Exercise 3 trong tài liệu).","<b>because + clause</b>; <b>because of / due to + noun</b> (course Exercise 3)."),
  fx("G-CE","Climate change is caused from human activities.","Climate change is <b>caused by</b> human activities. / … <b>results from</b> human activities.","<b>be caused by</b>; <b>result from</b>; <b>be due to</b> (bảng nguyên nhân – kết quả trong tài liệu).","<b>be caused by</b>; <b>result from</b>; <b>be due to</b> (the course’s cause–effect table)."),
  fx("G-CE","Deforestation results animal extinction and loss of biodiversity.","Deforestation <b>results in</b> animal extinction and loss of biodiversity.","<b>result in</b> + kết quả (không bỏ <i>in</i>).","<b>result in</b> + effect (do not drop <i>in</i>)."),
  fx("G-CE","Droughts will lead to forest fires increase.","Droughts will <b>lead to</b> more forest fires. / … lead to <b>an increase in</b> forest fires.","<b>lead to + danh từ</b>; ✗ lead to + mệnh đề.","<b>lead to + noun</b>; ✗ lead to + clause."),
  fx("G-CE","Due to people use too many plastic bags, the oceans are polluted.","<b>Because</b> people use too many plastic bags, the oceans are polluted. / <b>Due to</b> the overuse of plastic bags, …","<b>Due to + danh từ</b>; dùng danh từ hoá (the overuse of) để viết học thuật hơn.","<b>Due to + noun</b>; nominalize (the overuse of) for a more academic style."),
  fx("G-IT","Is important to protect the environment for future generations.","<b>It is</b> important to protect the environment for future generations.","Tiếng Anh cần chủ ngữ: <b>It is + adj + to V</b>. Lỗi bỏ chủ ngữ do dịch từ “Quan trọng là…”.","English needs a subject: <b>It is + adjective + to do</b>. Dropping it comes from translating word for word."),
  fx("G-IT","It is worth to invest in renewable energy.","It is worth <b>investing</b> in renewable energy.","<b>It is worth + V-ing</b> (tài liệu: “It is worth preparing for natural disasters”).","<b>It is worth + -ing</b> (course: “It is worth preparing for natural disasters”)."),
  fx("G-IT","Reducing the amount of plastic packaging that supermarkets give to customers every day is necessary.","<b>It is necessary to reduce</b> the amount of plastic packaging that supermarkets give to customers every day.","Chủ ngữ quá dài → chuyển sang <b>It is + adj + to V</b> (Expressing solutions using it).","A very long subject → move it after <b>It is + adjective + to do</b> (Expressing solutions using it)."),
  fx("G-IT","It is surprising governments do not prepare for floods.","It is surprising <b>that</b> governments do not <b>always</b> prepare for floods.","<b>It is + adj + that + mệnh đề</b>; trong văn viết nên giữ <i>that</i>.","<b>It is + adjective + that + clause</b>; keep <i>that</i> in formal writing."),
  fx("G-NP","We need to have a system to manage water to protect against flooding.","We need a <b>water management system</b> to protect against flooding.","Danh từ ghép học thuật: system for managing water → <b>water management system</b>.","Academic noun phrase: a system for managing water → <b>water management system</b>."),
  fx("G-NP","The report that the government made was very influential.","The <b>government report</b> was very influential.","report made by the government → <b>government report</b> (Exercise 1).","report made by the government → <b>government report</b> (Exercise 1)."),
  fx("G-ART","Environment is being destroyed by human.","<b>The environment</b> is being destroyed by <b>humans / human activity</b>.","<b>the environment</b> luôn có <i>the</i>; <i>human</i> đếm được → <b>humans</b> (hoặc dùng <i>human activity</i>).","<b>the environment</b> always takes <i>the</i>; <i>human</i> is countable → <b>humans</b> (or <i>human activity</i>)."),
  fx("G-CU","People should reduce the amount of rubbishes and wastes they produce.","People should reduce the amount of <b>rubbish and waste</b> they produce.","<b>rubbish, waste, pollution, litter, traffic</b> thường không đếm được → không -s.","<b>rubbish, waste, pollution, litter, traffic</b> are usually uncountable → no -s."),
  fx("G-RUN","Forests absorb carbon dioxide, they help to control global warming.","Forests absorb carbon dioxide, <b>helping</b> to keep global warming under control. / … carbon dioxide<b>, which</b> helps …","Dùng phân từ (<b>helping</b>) hoặc <b>which</b> thay cho comma splice (mẫu DF-5).","Use a participle (<b>helping</b>) or <b>which</b> instead of a comma splice (model DF-5)."),
  mc("G-CE","Low-lying islands may be submerged ___ rising sea levels.",["because","because of","so","caused"],1,"Theo sau là cụm danh từ (rising sea levels) → <b>because of</b>.","A noun phrase follows (rising sea levels) → <b>because of</b>."),
  mc("G-IT","Choose the CORRECT sentence:",["It is never a good idea building homes in a flood zone.","It is never a good idea to build homes in a flood zone.","Is never a good idea to build homes in a flood zone.","It never a good idea to build homes in a flood zone."],1,"<b>It is a good idea + to V</b> (Exercise 1 trong tài liệu).","<b>It is a good idea + to do</b> (course Exercise 1).","Chọn câu ĐÚNG:")
 ]},
 {id:"lex", icon:"🎯", title:{vi:"B · Chọn từ (LR) — collocation môi trường",en:"B · Word choice (LR) — environment collocations"},
  lead:{vi:"Collocation và từ loại hay sai nhất khi viết về môi trường.",en:"The collocations and word forms most often misused on environment topics."},
  items:[
  mc("W-COL","We need to switch to ___ energy such as solar and wind power.",["renew","renewable","renewing","recycle"],1,"<b>renewable energy</b> ↔ <b>fossil fuels</b> (Exercise 2).","<b>renewable energy</b> ↔ <b>fossil fuels</b> (Exercise 2)."),
  mc("W-COL","Global warming is caused by the increase in ___ in the atmosphere.",["greenhouse gases","glasshouse gas","green gases","house gases"],0,"<b>greenhouse gases</b>; cũng dùng: <i>carbon emissions</i>.","<b>greenhouse gases</b>; also: <i>carbon emissions</i>."),
  mc("W-FORM","Governments should take action to prevent more ___ disasters.",["environment","environmental","environmentally","environmentalist"],1,"Tính từ bổ nghĩa cho danh từ: <b>environmental disasters / problems / damage</b>.","An adjective before a noun: <b>environmental disasters / problems / damage</b>."),
  mc("W-FORM","Factories ___ rivers by dumping chemical waste.",["pollution","polluted","pollute","pollutant"],2,"Động từ <b>pollute</b>; danh từ <b>pollution</b> (không đếm được), <b>pollutant</b> (chất gây ô nhiễm).","Verb <b>pollute</b>; nouns <b>pollution</b> (uncountable), <b>pollutant</b> (a substance that pollutes)."),
  mc("W-COL","Many people ___ their rubbish into rivers instead of using bins.",["throw away","throw","drop out","take off"],1,"<b>throw sth into</b> (ném vào); <i>throw away</i> = vứt bỏ (không có tân ngữ chỉ nơi).","<b>throw something into</b> a place; <i>throw away</i> = get rid of (no destination)."),
  mc("W-COL","Schools should ___ awareness of environmental issues.",["rise","raise","arise","increase up"],1,"<b>raise awareness of</b> (ngoại động từ). <i>rise</i> là nội động từ.","<b>raise awareness of</b> (transitive). <i>rise</i> is intransitive."),
  mc("W-COL","Tigers and rhinos are ___ species.",["danger","dangerous","endangered","endangering"],2,"<b>endangered species</b> = loài có nguy cơ tuyệt chủng; <i>dangerous</i> = nguy hiểm.","<b>endangered species</b> = at risk of extinction; <i>dangerous</i> = able to harm you."),
  mc("W-PREP","Deforestation has a serious effect ___ biodiversity.",["to","on","for","with"],1,"<b>have an effect / impact on</b> (DF-5).","<b>have an effect / impact on</b> (DF-5)."),
  mc("W-COL","Choose the best word for the academic context: “The most serious ___ facing the planet is climate change.”",["problem","thing","issue","stuff"],2,"<b>issue / challenge</b> học thuật hơn <i>problem</i>; tránh <i>thing, stuff</i> (Academic words Exercise 1).","<b>issue / challenge</b> are more academic than <i>problem</i>; avoid <i>thing, stuff</i> (Academic words Exercise 1)."),
  mc("W-COL","Experts ___ that there will not be enough fresh water in the future.",["think","guess","predict","feel"],2,"<b>predict</b> (dự đoán) thay cho <i>think</i> (Exercise 1 trong tài liệu).","<b>predict</b> instead of <i>think</i> (course Exercise 1)."),
  fx("W-COL","Weather change is making natural disasters more and more serious.","<b>Climate change</b> is making natural disasters <b>increasingly severe</b>.","“Biến đổi khí hậu” = <b>climate change</b> (weather = thời tiết hằng ngày). <b>more and more</b> → <b>increasingly</b>; disaster đi với <b>severe / devastating</b>.","Long-term change = <b>climate change</b> (weather = day-to-day conditions). <b>more and more</b> → <b>increasingly</b>; disasters are <b>severe / devastating</b>."),
  fx("W-REG","Lots of people don’t care about the environment and just throw stuff everywhere.","<b>Many people</b> show little concern for the environment and <b>dispose of their rubbish irresponsibly</b>.","Tránh <i>lots of, don’t care, stuff, everywhere</i> → <i>many, show little concern for, dispose of … irresponsibly</i>.","Avoid <i>lots of, don’t care, stuff, everywhere</i> → <i>many, show little concern for, dispose of … irresponsibly</i>."),
  fx("W-GEN","Individuals can do nothing to protect the environment.","Individuals <b>can make only a limited contribution</b> to protecting the environment <b>on their own</b>.","Tránh tuyệt đối hoá (nothing, always, everyone); dùng <i>limited, largely, to some extent</i>.","Avoid absolutes (nothing, always, everyone); use <i>limited, largely, to some extent</i>."),
  fx("W-COL","The government should make people save the electric and use public transportations.","The government should encourage people to <b>save electricity</b> and use <b>public transport</b>.","<b>save electricity / energy</b> (electric là tính từ); <b>public transport</b> không đếm được (✗ transportations).","<b>save electricity / energy</b> (electric is an adjective); <b>public transport</b> is uncountable (✗ transportations).")
 ]},
 {id:"org", icon:"🧭", title:{vi:"C · Sắp xếp ý (CC + TR)",en:"C · Organising ideas (CC + TR)"},
  lead:{vi:"Chọn lọc thông tin liên quan (kỹ năng <b>Selecting</b> trong tài liệu), chuỗi nguyên nhân–kết quả, giải pháp khớp vấn đề.",en:"Selecting relevant information (the course’s <b>Selecting</b> skill), cause–effect chains, solutions that match problems."},
  items:[
  mc("O-REL","Prompt: “Outline the human causes of climate change. What effects will these have?” Which point should NOT go in the CAUSES paragraph?",["factory emissions","deforestation","rising sea levels","power stations"],2,"<b>rising sea levels</b> là HỆ QUẢ, không phải nguyên nhân (Writing Practice task 1). Kỹ năng <b>Selecting</b>: luôn hỏi “thông tin này có đúng đoạn, đúng đề không?”.","<b>rising sea levels</b> is an EFFECT, not a cause (Writing Practice task 1). <b>Selecting</b>: always ask whether information belongs in this paragraph and answers this question.","Đề: “Outline the human causes of climate change. What effects will these have?” Ý nào KHÔNG được đưa vào đoạn NGUYÊN NHÂN?"),
  mc("O-REL","Same prompt. A student adds a third body paragraph: “Solutions: governments should plant more trees and tax petrol cars.” Is this a good idea?",["Yes — more ideas always mean a higher band.","No — the question asks only for causes and effects, so solutions are irrelevant and waste words.","Yes — but only if it is the longest paragraph.","No — solutions must go in the introduction."],1,"Đề không hỏi giải pháp → viết thêm là lạc đề, mất chữ, có thể làm loãng TR. Chỉ nhắc 1 câu ngắn ở kết luận nếu muốn.","The question does not ask for solutions → adding them is off-task and wastes words. At most, mention one briefly in the conclusion.","Cùng đề. Một học sinh thêm đoạn thân bài thứ 3: “Solutions: governments should plant more trees and tax petrol cars.” Có nên không?"),
  {t:"order", c:"O-ORD", q:bi("Sắp xếp thành chuỗi nguyên nhân → kết quả (mỗi câu bắt đầu bằng kết quả của câu trước):","Put the sentences in order to make a cause → effect chain (each sentence begins with the result of the previous one):"),
   s:["This loss of soil, in turn, means that heavy rain can no longer be absorbed, which often results in flooding.",
      "One of the most damaging human activities is the large-scale clearing of forests for agriculture.",
      "As a result, local communities lose both their homes and their farmland.",
      "When the trees are removed, the layer of soil that protects the ground is quickly washed away."], k:"bdac",
   r:bi("b = topic sentence (nguyên nhân gốc) → d = hệ quả 1 (mất lớp đất) → a = hệ quả 2 (lũ) → c = hệ quả cuối. Đúng mô hình đoạn DF-3: mỗi câu bắt đầu bằng “thông tin cũ”.","b = topic sentence (root cause) → d = effect 1 (soil loss) → a = effect 2 (flooding) → c = final effect. Just like DF-3: each sentence starts with ‘given’ information.")},

/* --- band table + checklist (shared) --- */
function bandGroupHTML(title, bands, cls){
  const rows = bandDescriptors.filter(d=>bands.includes(d.b)).map(d=>
    `<tr data-b="${d.b}"><td class="bn">${d.b}</td>
     <td>${d.tr}</td><td>${d.cc}</td><td>${d.lr}</td><td>${d.gra}</td></tr>`).join('');
  return `<div class="bandgroup ${cls}"><div class="bghead">${title}</div>
    <div class="bandwrap"><table class="band"><thead><tr>
      <th>Band</th><th>Task Response</th><th>Coherence &amp; Cohesion</th>
      <th>Lexical Resource</th><th>Grammatical Range &amp; Accuracy</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function bandTableHTML(){
  return bandGroupHTML("Band 8–9 · Very good – Expert user", ["8","9"], "bg-hi")
       + bandGroupHTML("Band 6–7 · Competent – Good user", ["6","7"], "bg-mid")
       + bandGroupHTML("Band 4–5 · Limited – Modest user", ["4","5"], "bg-lo")
       + `<div class="bandsrc" style="border:1px solid var(--line);border-radius:8px">${tr('bandsrc')}</div>`;
}
function checklistHTML(topicId){
  let out = `<button class="resetbtn" onclick="resetChecks('${topicId}')">${tr('chk.reset')}</button>`;
  for(const k in checklist){
    const c=checklist[k];
    out += `<div class="crit"><h4><span class="k">${k}</span> ${c.name}</h4>`;
    c.items.forEach((it,idx)=>{
      const id=`chk-${topicId}-${k}-${idx}`;
      const label = (it&&typeof it==='object') ? (it[LANG]||it.vi) : it;
      out+=`<div class="check"><input type="checkbox" id="${id}"><label for="${id}">${label}</label></div>`;
    });
    out+=`</div>`;
  }
  out += `<div class="themetag" style="margin-top:18px">${tr('chk.bands')}</div>`;
  out += bandTableHTML();
  return out;
}
function resetChecks(topicId){
  document.querySelectorAll(`[id^="chk-${topicId}-"]`).forEach(c=>c.checked=false);
}

let _gbVoice=null;
function pickGBVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  // prefer named British voices, then any en-GB voice
  const pref=["Google UK English Female","Google UK English Male","Daniel","Kate","Serena","Arthur","Sonia","Libby","George"];
  for(const name of pref){const v=vs.find(x=>x.name===name);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/English \(United Kingdom\)/i.test(v.name)) || null;
}
if('speechSynthesis' in window){
  _gbVoice=pickGBVoice();
  speechSynthesis.onvoiceschanged=()=>{_gbVoice=pickGBVoice();};
}
function speak(w){
  try{ if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(w);
    u.lang='en-GB'; u.rate=.9;
    if(!_gbVoice)_gbVoice=pickGBVoice();
    if(_gbVoice)u.voice=_gbVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function errLog(){
  const cnt={};
  const add=c=>{cnt[c]=(cnt[c]||0)+1;};
  const all={}; CLINIC.t1.groups.forEach(g=>g.items.forEach((it,i)=>all[g.id+'-'+i]=it));
  for(const k in ST.mcq){const it=all[k]; if(it && ST.mcq[k]!==it.k) add(it.c);}
  for(const k in ST.self){if(ST.self[k]==='miss' && all[k]) add(all[k].c);}
  for(const k in ST.order){if(ST.order[k]===false && all[k]) add(all[k].c);}
  return cnt;
}

  const el=document.getElementById('errlog'); if(!el) return;

/* ---------- generic exercises ---------- */
const norm=s=>(s||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.]/g,'').trim();
function gapEx(id,ex){
  return `<div class="ex" id="${id}"><h4>${ex.h}</h4>${ex.box?`<div class="exbox">${ex.box}</div>`:''}<ol>${ex.items.map((it,i)=>{
     const parts=it[0].split('___');
     return `<li data-ans="${esc(it[1])}">${parts.map((p,j)=>esc(p)+(j<parts.length-1?`<input class="gap" data-k="${id}-${i}-${j}" value="${esc(ST.drafts[id+'-'+i+'-'+j]||'')}" oninput="ST.drafts[this.dataset.k]=this.value">`:'')).join('')}<span class="mk"></span></li>`;}).join('')}</ol>
   <div class="exbtn"><button class="linkbtn" onclick="checkGap('${id}')">${xt('check')}</button><button class="resetbtn" onclick="showKey('${id}')">${V('Xem đáp án','Show key')}</button></div></div>`;
}
function checkGap(id){
  let ok=0,n=0;
  document.querySelectorAll('#'+id+' li').forEach(li=>{
    const ans=li.dataset.ans.split(' / ').map(norm); const got=[...li.querySelectorAll('input')].map(x=>norm(x.value));
    const good = got.length===ans.length && got.every(g=>ans.includes(g)) && new Set(got).size===got.length;
    li.querySelector('.mk').innerHTML=good?'<b class="okk">✓</b>':'<b class="nok">✗</b>'; n++; if(good) ok++;
  });
  scoreBadge(id,ok,n);
}
function showKey(id){document.querySelectorAll('#'+id+' li').forEach(li=>{li.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(li.dataset.ans)}</span>`;});}
function scoreBadge(id,ok,n){let b=document.querySelector('#'+id+' .score'); if(!b){b=document.createElement('span');b.className='score';document.querySelector('#'+id+' .exbtn').appendChild(b);} b.textContent=ok+'/'+n; b.classList.toggle('full',ok===n);}
function selEx(id,h,rows,opts,note){ // rows: [label, keyValue, explain?]
  return `<div class="ex" id="${id}"><h4>${h}</h4>${note?`<div class="exnote">${note}</div>`:''}<table class="extbl"><tbody>${rows.map((r,i)=>`<tr data-ans="${esc(r[1])}" data-why="${esc(r[2]||'')}"><td class="n">${i+1}</td><td>${esc(r[0])}</td><td><select data-k="${id}-${i}" onchange="ST.drafts[this.dataset.k]=this.value"><option value="">—</option>${opts.map(o=>`<option value="${esc(o[0])}" ${ST.drafts[id+'-'+i]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></td><td class="mk"></td></tr>`).join('')}</tbody></table>
   <div class="exbtn"><button class="linkbtn" onclick="checkSel('${id}')">${xt('check')}</button><button class="resetbtn" onclick="keySel('${id}')">${V('Xem đáp án','Show key')}</button></div></div>`;
}
function checkSel(id){let ok=0,n=0; document.querySelectorAll('#'+id+' tr').forEach(tr=>{const v=tr.querySelector('select').value; const g=v===tr.dataset.ans; n++; if(g)ok++; tr.querySelector('.mk').innerHTML=(g?'<b class="okk">✓</b>':'<b class="nok">✗</b>')+(tr.dataset.why&&v?` <span class="why">${esc(tr.dataset.why)}</span>`:'');}); scoreBadge(id,ok,n);}
function keySel(id){document.querySelectorAll('#'+id+' tr').forEach(tr=>{const o=[...tr.querySelector('select').options].find(o=>o.value===tr.dataset.ans); tr.querySelector('.mk').innerHTML=`<span class="key">→ ${esc(o?o.text:tr.dataset.ans)}</span>${tr.dataset.why?` <span class="why">${esc(tr.dataset.why)}</span>`:''}`;});}
function matchEx(id,m){const letters='abcdefghijk'; return `<div class="matchwrap"><ol type="a" class="mright">${m.right.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>`+selEx(id,m.h,m.left.map((l,i)=>[l,letters[m.key[i]]]),m.right.map((r,i)=>[letters[i],letters[i]+' · '+r]));}
function oddEx(id,ex){
  return `<div class="ex" id="${id}"><h4>${ex.h}</h4><div class="odd">${ex.items.map((it,i)=>`<div class="oddrow"><span class="n">${i+1}</span>${it.slice(0,3).map(w=>`<button class="oddw" onclick="pickOdd(this,'${it[3]}')">${w}</button>`).join('')}</div>`).join('')}</div></div>`;
}
function pickOdd(b,ans){const row=b.parentNode; row.querySelectorAll('button').forEach(x=>{x.disabled=true; if(x.textContent===ans)x.classList.add('right');}); if(b.textContent!==ans)b.classList.add('wrongpick');}

/* ---------- positional gap check with alternatives ---------- */
function normZ(s){ s=norm(s); return ['–','—','ø','0','x','zero','none','-'].includes(s)?'-':s; }
function checkGap(id){
  let ok=0,n=0;
  document.querySelectorAll('#'+id+' li').forEach(li=>{
    const ans=li.dataset.ans.split(' / '); const got=[...li.querySelectorAll('input')].map(x=>normZ(x.value));
    const good = got.length===ans.length && got.every((g,i)=>ans[i].split('|').map(normZ).includes(g));
    li.querySelector('.mk').innerHTML=good?'<b class="okk">✓</b>':'<b class="nok">✗</b>'; n++; if(good) ok++;
  });
  scoreBadge(id,ok,n);
}

const QUAD={SE:"short-term · expensive",SI:"short-term · inexpensive",LE:"long-term · expensive",LM:"long-term · medium cost",LI:"long-term · inexpensive"};

function gapEx(id,ex){
  return `<div class="ex" id="${id}"><h4>${ex.h}</h4>${ex.box?`<div class="exbox">${ex.box}</div>`:''}<ol>${ex.items.map((it,i)=>{
     const parts=it[0].split('___');
     return `<li data-ans="${esc(it[1])}">${parts.map((p,j)=>p+(j<parts.length-1?`<input class="gap" data-k="${id}-${i}-${j}" value="${esc(ST.drafts[id+'-'+i+'-'+j]||'')}" oninput="ST.drafts[this.dataset.k]=this.value">`:'')).join('')}<span class="mk"></span></li>`;}).join('')}</ol>

}
